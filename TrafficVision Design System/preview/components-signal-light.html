<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .signal { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .housing { background: #0e1422; border: 2px solid #2a3555; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; width: 44px; }
  .light { width: 28px; height: 28px; border-radius: 50%; }
  .light-red-on { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.7); }
  .light-red-off { background: #3f1414; }
  .light-amber-on { background: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.7); }
  .light-amber-off { background: #3d2a00; }
  .light-green-on { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.7); }
  .light-green-off { background: #0d3320; }
  .signal-label { font-size: 11px; color: var(--color-text-muted); text-align: center; font-family: var(--font-mono); }

  .info { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 8px; padding: 14px 16px; flex: 1; }
  .info-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 10px; }
  .phase-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .phase-label { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); width: 64px; }
  .phase-bar { height: 16px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255,255,255,0.8); font-weight: 500; }
</style>
</head>
<body>
<div class="row">
  <div class="signal">
    <div class="housing">
      <div class="light light-red-on"></div>
      <div class="light light-amber-off"></div>
      <div class="light light-green-off"></div>
    </div>
    <div class="signal-label">紅燈<br>STOP</div>
  </div>
  <div class="signal">
    <div class="housing">
      <div class="light light-red-off"></div>
      <div class="light light-amber-on"></div>
      <div class="light light-green-off"></div>
    </div>
    <div class="signal-label">黃燈<br>CAUTION</div>
  </div>
  <div class="signal">
    <div class="housing">
      <div class="light light-red-off"></div>
      <div class="light light-amber-off"></div>
      <div class="light light-green-on"></div>
    </div>
    <div class="signal-label">綠燈<br>GO</div>
  </div>

  <div class="info">
    <div class="info-title">IK7KP — 建國南一段/市民三段  週期 90s</div>
    <div class="phase-row">
      <span class="phase-label">相位 1</span>
      <div class="phase-bar" style="width:120px;background:#22c55e;">42s</div>
    </div>
    <div class="phase-row">
      <span class="phase-label">相位 2</span>
      <div class="phase-bar" style="width:80px;background:#ef4444;">28s</div>
    </div>
    <div class="phase-row">
      <span class="phase-label">相位 3</span>
      <div class="phase-bar" style="width:56px;background:#f59e0b;">20s</div>
    </div>
  </div>
</div>
</body>
</html>
