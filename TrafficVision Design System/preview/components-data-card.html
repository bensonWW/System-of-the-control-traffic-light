<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>TrafficVision DS v2 — Data Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg); padding: 24px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--color-border-medium);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: var(--shadow-card);
  }
  .card-label {
    font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    letter-spacing: var(--tracking-wide);
    text-transform: uppercase;
    color: var(--fg-3);
    margin-bottom: 8px;
  }
  .card-value-row { display: flex; align-items: baseline; gap: 4px; }
  .card-value {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    line-height: 1;
    letter-spacing: var(--tracking-tight);
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  .card-unit { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg-2); }
  .card-delta { font-size: var(--text-xs); margin-top: 6px; display: flex; align-items: center; gap: 4px; color: var(--fg-3); }
  .delta-positive { color: var(--color-text-danger); }
  .delta-negative { color: var(--color-text-success); }
  .card-bar { height: 3px; border-radius: 2px; margin-top: 12px; background: var(--bg-elevated); overflow: hidden; }
  .card-bar-fill { height: 100%; border-radius: 2px; transition: width 600ms cubic-bezier(0.2,0,0,1); }
  .card-glass {
    background: var(--color-bg-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--color-border-medium);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: var(--shadow-card);
  }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; margin-top: 24px; }
  .section-label:first-child { margin-top: 0; }
</style>
</head>
<body>

<div class="section-label">Standard Cards</div>
<div class="grid">
  <div class="card">
    <div class="card-label">平均車速</div>
    <div class="card-value-row">
      <span class="card-value">34.6</span>
      <span class="card-unit">km/h</span>
    </div>
    <div class="card-delta delta-negative">▼ 12.3 較上輪</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:58%;background:var(--color-blue-500);"></div></div>
  </div>

  <div class="card">
    <div class="card-label">總車流量</div>
    <div class="card-value-row">
      <span class="card-value">1,240</span>
      <span class="card-unit">輛</span>
    </div>
    <div class="card-delta delta-positive">▲ 87 較上輪</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:74%;background:var(--color-amber-500);"></div></div>
  </div>

  <div class="card">
    <div class="card-label">壅塞路段</div>
    <div class="card-value-row">
      <span class="card-value" style="color:var(--color-text-danger);">3</span>
      <span class="card-unit">路段</span>
    </div>
    <div class="card-delta delta-positive">▲ 1 較上輪</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:25%;background:var(--color-red-500);"></div></div>
  </div>

  <div class="card">
    <div class="card-label">暢通路段</div>
    <div class="card-value-row">
      <span class="card-value" style="color:var(--color-text-success);">9</span>
      <span class="card-unit">路段</span>
    </div>
    <div class="card-delta delta-negative">▼ 2 較上輪</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:82%;background:var(--color-green-500);"></div></div>
  </div>

  <div class="card">
    <div class="card-label">預測尖峰時間</div>
    <div class="card-value-row">
      <span class="card-value" style="color:var(--color-text-predict);">17:45</span>
    </div>
    <div class="card-delta" style="color:var(--color-text-predict);">GRU 預測 · 置信度 84%</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:84%;background:var(--color-violet-500);"></div></div>
  </div>

  <div class="card-glass">
    <div class="card-label">號誌優化</div>
    <div class="card-value-row">
      <span class="card-value">12</span>
      <span class="card-unit">次 / 今日</span>
    </div>
    <div class="card-delta delta-negative">▼ 3 較昨日</div>
    <div class="card-bar"><div class="card-bar-fill" style="width:60%;background:var(--color-blue-500);"></div></div>
  </div>
</div>

</body>
</html>
