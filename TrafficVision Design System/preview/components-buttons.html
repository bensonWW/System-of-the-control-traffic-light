<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px; }
  /* Base button */
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; font-family: var(--font-body); font-weight: 500; cursor: pointer; border: none; transition: opacity 150ms ease-out, transform 150ms ease-out; padding: 0 14px; height: 36px; font-size: 14px; }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }
  /* Variants */
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-secondary { background: #1f2a42; color: #e2e8f0; border: 1px solid #2a3555; }
  .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #2a3555; }
  .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .btn-success { background: rgba(34,197,94,0.13); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
  /* Sizes */
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 5px; }
  .btn-lg { height: 44px; padding: 0 20px; font-size: 16px; }
  /* States */
  .btn-disabled { opacity: 0.4; pointer-events: none; }
  .btn-icon { width: 36px; padding: 0; justify-content: center; }
  .btn-icon.btn-sm { width: 28px; }
</style>
</head>
<body>
<div class="section-label">Variants</div>
<div class="row">
  <button class="btn btn-primary">啟動優化</button>
  <button class="btn btn-secondary">重新整理</button>
  <button class="btn btn-ghost">匯出報告</button>
  <button class="btn btn-danger">停止模擬</button>
  <button class="btn btn-success">暢通確認</button>
</div>
<div class="section-label">Sizes</div>
<div class="row">
  <button class="btn btn-primary btn-sm">小按鈕</button>
  <button class="btn btn-primary">標準按鈕</button>
  <button class="btn btn-primary btn-lg">大按鈕</button>
</div>
<div class="section-label">States</div>
<div class="row">
  <button class="btn btn-primary">正常</button>
  <button class="btn btn-primary btn-disabled">停用</button>
  <button class="btn btn-icon btn-secondary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
  </button>
  <button class="btn btn-icon btn-primary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-7.49"/></svg>
  </button>
</div>
</body>
</html>
