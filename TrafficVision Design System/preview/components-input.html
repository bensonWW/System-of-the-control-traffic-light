<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-text-muted); }
  .input { background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: 6px; padding: 0 12px; height: 36px; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; display: flex; align-items: center; transition: border-color 150ms; width: 100%; }
  .input-focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.25); }
  .input-error { border-color: #ef4444; }
  .input-disabled { opacity: 0.45; }
  .input-placeholder { color: var(--color-text-muted); }
  .input-search { display: flex; align-items: center; gap: 8px; }
  .field-error { font-size: 12px; color: #f87171; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
</style>
</head>
<body>
<div class="row">
  <div class="field">
    <div class="field-label">路段搜尋</div>
    <div class="input input-focus input-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span style="color:#e2e8f0;">建國南路</span>
    </div>
  </div>
  <div class="field">
    <div class="field-label">時間範圍</div>
    <div class="input">
      <span>2026-01-26 11:00 – 12:00</span>
    </div>
  </div>
</div>
<div class="row">
  <div class="field">
    <div class="field-label">服務水準篩選</div>
    <div class="input" style="justify-content:space-between;">
      <span>全部等級</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
  <div class="field">
    <div class="field-label">路段 ID（停用）</div>
    <div class="input input-disabled"><span class="input-placeholder">ZJHKR40</span></div>
  </div>
</div>
<div class="field">
  <div class="field-label">錯誤狀態</div>
  <div class="input input-error"><span class="input-placeholder">請輸入有效路段名稱</span></div>
  <div class="field-error">找不到符合條件的路段資料</div>
</div>
</body>
</html>
