<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .status-card { flex: 1; background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 8px; padding: 14px 16px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
  .status-name { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .status-cn { font-size: 20px; font-weight: 700; font-family: var(--font-display); margin: 6px 0 2px; }
  .status-moe { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
  .badge { display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 500; font-family: var(--font-body); margin-top: 8px; letter-spacing: 0.04em; }
  .free .status-cn { color: #4ade80; }
  .free .badge { background: rgba(34,197,94,0.12); color: #4ade80; }
  .free .dot { background: #22c55e; }
  .moderate .status-cn { color: #fbbf24; }
  .moderate .badge { background: rgba(245,158,11,0.12); color: #fbbf24; }
  .moderate .dot { background: #f59e0b; }
  .congested .status-cn { color: #f87171; }
  .congested .badge { background: rgba(239,68,68,0.12); color: #f87171; }
  .congested .dot { background: #ef4444; }
</style>
</head>
<body>
<div class="row">
  <div class="status-card free">
    <div><span class="dot"></span><span class="status-name">Free Flow</span></div>
    <div class="status-cn">暢通</div>
    <div class="status-moe">MOELevel = 0</div>
    <div class="badge">FREE FLOW</div>
  </div>
  <div class="status-card moderate">
    <div><span class="dot"></span><span class="status-name">Moderate</span></div>
    <div class="status-cn">普通</div>
    <div class="status-moe">MOELevel = 1</div>
    <div class="badge">MODERATE</div>
  </div>
  <div class="status-card congested">
    <div><span class="dot"></span><span class="status-name">Congested</span></div>
    <div class="status-cn">壅塞</div>
    <div class="status-moe">MOELevel = 2</div>
    <div class="badge">CONGESTED</div>
  </div>
</div>
</body>
</html>
