<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>TrafficVision DS v2 — Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg); padding: 24px; font-family: var(--font-body); }
  .grid { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { border-radius: var(--radius-sm); background: var(--color-blue-500); min-width: 32px; }
  .token { font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); text-align: center; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="bar-wrap"><div class="bar" style="height:2px;opacity:0.35;"></div><div class="px">2</div><div class="token">space-0-5</div></div>
  <div class="bar-wrap"><div class="bar" style="height:4px;opacity:0.4;"></div><div class="px">4</div><div class="token">space-1</div></div>
  <div class="bar-wrap"><div class="bar" style="height:6px;opacity:0.45;"></div><div class="px">6</div><div class="token">space-1-5</div></div>
  <div class="bar-wrap"><div class="bar" style="height:8px;opacity:0.5;"></div><div class="px">8</div><div class="token">space-2</div></div>
  <div class="bar-wrap"><div class="bar" style="height:12px;opacity:0.6;"></div><div class="px">12</div><div class="token">space-3</div></div>
  <div class="bar-wrap"><div class="bar" style="height:16px;opacity:0.7;"></div><div class="px">16</div><div class="token">space-4</div></div>
  <div class="bar-wrap"><div class="bar" style="height:20px;opacity:0.75;"></div><div class="px">20</div><div class="token">space-5</div></div>
  <div class="bar-wrap"><div class="bar" style="height:24px;opacity:0.8;"></div><div class="px">24</div><div class="token">space-6</div></div>
  <div class="bar-wrap"><div class="bar" style="height:32px;opacity:0.85;"></div><div class="px">32</div><div class="token">space-8</div></div>
  <div class="bar-wrap"><div class="bar" style="height:40px;opacity:0.9;"></div><div class="px">40</div><div class="token">space-10</div></div>
  <div class="bar-wrap"><div class="bar" style="height:48px;opacity:0.95;"></div><div class="px">48</div><div class="token">space-12</div></div>
  <div class="bar-wrap"><div class="bar" style="height:64px;"></div><div class="px">64</div><div class="token">space-16</div></div>
  <div class="bar-wrap"><div class="bar" style="height:80px;"></div><div class="px">80</div><div class="token">space-20</div></div>
</div>
</body>
</html>
