<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--color-divider); }
  .row:last-child { border-bottom: none; }
  .size { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); width: 30px; flex-shrink: 0; }
  .sample-display { font-family: var(--font-display); color: var(--color-text-primary); }
  .sample-body { font-family: var(--font-body); color: var(--color-text-secondary); }
  .sample-mono { font-family: var(--font-mono); color: var(--color-text-secondary); }
</style>
</head>
<body>
<div class="row"><span class="size">48</span><span class="sample-display" style="font-size:48px;font-weight:700;line-height:1;">48,230</span></div>
<div class="row"><span class="size">32</span><span class="sample-display" style="font-size:32px;font-weight:700;">交通監控系統</span></div>
<div class="row"><span class="size">24</span><span class="sample-display" style="font-size:24px;font-weight:600;">Traffic Overview</span></div>
<div class="row"><span class="size">20</span><span class="sample-display" style="font-size:20px;font-weight:600;">即時路況分析</span></div>
<div class="row"><span class="size">16</span><span class="sample-body" style="font-size:16px;">建國南路 忠孝東路–仁愛路段目前車流狀況</span></div>
<div class="row"><span class="size">14</span><span class="sample-body" style="font-size:14px;">平均車速 34.6 km/h　佔有率 2.1%　總車流量 61 輛</span></div>
<div class="row"><span class="size">13</span><span class="sample-body" style="font-size:13px;color:var(--color-text-muted);">上次更新：2026-01-26 11:22:31</span></div>
<div class="row"><span class="size">12</span><span class="sample-body" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;font-weight:500;">SECTION ID · TIMESTAMP · LABELS</span></div>
<div class="row"><span class="size">mono</span><span class="sample-mono" style="font-size:13px;">ZJHKR40  AvgSpd=34.64  TotalVol=61</span></div>
</body>
</html>
