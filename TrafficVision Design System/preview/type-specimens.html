<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 14px; }
  .specimen { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 8px; padding: 14px 16px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); margin-bottom: 6px; }
  .display-sample { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--color-text-primary); letter-spacing: -0.02em; line-height: 1.2; }
  .body-sample { font-family: var(--font-body); font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; }
  .mono-sample { font-family: var(--font-mono); font-size: 13px; color: #60a5fa; line-height: 1.6; }
</style>
</head>
<body>
<div class="specimen">
  <div class="tag">Space Grotesk — Display / Numbers</div>
  <div class="display-sample">34.6 km/h &nbsp; 1,240 輛</div>
</div>
<div class="specimen">
  <div class="tag">Noto Sans TC — Body / UI / Chinese</div>
  <div class="body-sample">目前建國南路至忠孝東路路段車流量偏高，平均行車速度為 34.6 公里/小時，佔有率達 47.7%，建議調整號誌時制以疏解壅塞。</div>
</div>
<div class="specimen">
  <div class="tag">JetBrains Mono — IDs / Data / Timestamps</div>
  <div class="mono-sample">ZJHKR40 &nbsp;|&nbsp; 2026-01-26T11:22:31 &nbsp;|&nbsp; MOE=2 &nbsp;|&nbsp; Spd=9.8</div>
</div>
</body>
</html>
