function lerpColor(a, b, t) {
  const ah=parseInt(a.slice(1),16), bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&0xff, ag=(ah>>8)&0xff, ab=ah&0xff;
  const br=(bh>>16)&0xff, bg=(bh>>8)&0xff, bb=bh&0xff;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return `#${((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0')}`;
}
function speedColor(spd) {
  if (spd <=  0) return '#ef4444';
  if (spd <= 10) return lerpColor('#ef4444','#f97316', spd/10);
  if (spd <= 20) return lerpColor('#f97316','#f59e0b',(spd-10)/10);
  if (spd <= 30) return lerpColor('#f59e0b','#84cc16',(spd-20)/10);
  if (spd <= 40) return lerpColor('#84cc16','#22c55e',(spd-30)/10);
  return '#22c55e';
}
function countColorMode(count, maxCount, mode) {
  if (!count || !maxCount) return 'rgba(99,130,200,0.12)';
  const t = Math.min(1, count / maxCount);
  if (mode === 'pred') {
    if (t < 0.25) return lerpColor('#22c55e','#84cc16', t/0.25);
    if (t < 0.5)  return lerpColor('#84cc16','#f59e0b',(t-0.25)/0.25);
    if (t < 0.75) return lerpColor('#f59e0b','#fb923c',(t-0.5)/0.25);
    return             lerpColor('#fb923c','#dc2626',(t-0.75)/0.25);
  }
  if (t < 0.25) return lerpColor('#22c55e','#84cc16', t/0.25);
  if (t < 0.5)  return lerpColor('#84cc16','#f59e0b',(t-0.25)/0.25);
  if (t < 0.75) return lerpColor('#f59e0b','#f97316',(t-0.5)/0.25);
  return             lerpColor('#f97316','#ef4444',(t-0.75)/0.25);
}
function polylineMidpoint(pts) {
  if (pts.length < 2) return pts[0] || [0,0];
  let total=0;
  const dists=pts.slice(0,-1).map((p,i)=>{ const d=L.latLng(p).distanceTo(L.latLng(pts[i+1])); total+=d; return d; });
  let acc=0; const half=total/2;
  for (let i=0;i<dists.length;i++) {
    if (acc+dists[i]>=half) { const t=dists[i]>0?(half-acc)/dists[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t]; }
    acc+=dists[i];
  }
  return pts[Math.floor(pts.length/2)];
}

        <div style={{ fontFamily:ff,fontSize:15,fontWeight:600,color:'#f1f5f9',letterSpacing:'-0.01em' }}>總覽儀表板</div>
        {lastFetch && (
          <div style={{ display:'flex',alignItems:'center',gap:5 }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4e6080" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span style={{ fontFamily:mono,fontSize:11,color:'#4e6080' }}>最後更新：{lastFetch}</span>
          </div>
        )}
      </div>
      <div style={{ display:'flex',alignItems:'center',gap:8 }}>
        <div style={{ display:'flex',alignItems:'center',gap:6,background:'rgba(34,197,94,0.10)',border:'1px solid rgba(34,197,94,0.25)',borderRadius:6,padding:'4px 10px' }}>
          <div style={{ width:6,height:6,borderRadius:'50%',background:'#22c55e',boxShadow:'0 0 5px rgba(34,197,94,0.7)' }}/>
          <span style={{ fontFamily:body,fontSize:11,color:'#4ade80' }}>即時資料</span>
        </div>
        <span style={{ fontFamily:mono,fontSize:11,color:'#4e6080' }}>{time}</span>
        <button onClick={onRefresh} disabled={refreshing} style={{ display:'inline-flex',alignItems:'center',gap:6,height:30,padding:'0 12px',borderRadius:6,border:'1px solid rgba(99,130,200,0.25)',background:'#0f1629',color:refreshing?'#4e6080':'#94a3b8',fontFamily:body,fontSize:12,transition:'background 150ms,color 150ms' }}
          onMouseEnter={e=>{ if(!refreshing){e.currentTarget.style.background='rgba(99,130,200,0.08)';e.currentTarget.style.color='#f1f5f9';} }}
          onMouseLeave={e=>{ e.currentTarget.style.background='#0f1629';e.currentTarget.style.color=refreshing?'#4e6080':'#94a3b8'; }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" style={refreshing?{animation:'spin 1s linear infinite'}:{}}><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-7.49"/></svg>
          {refreshing ? '更新中…' : '立即更新'}
        </button>
        <button onClick={onStartOptimize} disabled={simStatus==='running'} style={{ display:'inline-flex',alignItems:'center',gap:6,height:30,padding:'0 14px',borderRadius:6,border:'none',background:simStatus==='running'?'rgba(59,130,246,0.4)':'#3b82f6',color:'#fff',fontFamily:body,fontSize:12,fontWeight:500,transition:'background 150ms,box-shadow 150ms',cursor:simStatus==='running'?'not-allowed':'pointer' }}
          onMouseEnter={e=>{ if(simStatus!=='running'){e.currentTarget.style.background='#60a5fa';e.currentTarget.style.boxShadow='0 0 12px rgba(59,130,246,0.40)';} }}
          onMouseLeave={e=>{ e.currentTarget.style.background=simStatus==='running'?'rgba(59,130,246,0.4)':'#3b82f6';e.currentTarget.style.boxShadow='none'; }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={simStatus==='running'?{animation:'spin 1s linear infinite'}:{}}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          {simStatus==='running'?'模擬中…':'啟動優化'}
        </button>
      </div>
    </div>
  );
}

function MetricsPanel({ roads }) {
  const ff="'Inter',system-ui,sans-serif", body="'Noto Sans TC','PingFang TC',sans-serif";
  const bgCard='#0f1629', bgElev='#162036', borderMed='rgba(99,130,200,0.25)', shadow='0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)';
  const n = roads.length;
  const roadsWithData = roads.filter(r => r.cur.spd !== null);
  const hasData = roadsWithData.length > 0;
  const avgSpd = hasData ? +(roadsWithData.reduce((s,r)=>s+r.cur.spd,0)/roadsWithData.length).toFixed(1) : null;
  const totalVol = hasData ? roadsWithData.reduce((s,r)=>s+(r.cur.vol||0),0) : null;
  const congested = hasData ? roadsWithData.filter(r=>r.cur.moe===2).length : null;
  const free = hasData ? roadsWithData.filter(r=>r.cur.moe===0).length : null;
  const sigCount = signalData.length;

  const cards = [
    { label:'監控路段', value:String(n),                            unit:'條',   accent:'#3b82f6', barW: 1.0, delta:null },
    { label:'平均車速', value:avgSpd!==null?String(avgSpd):'--',    unit:'km/h', accent:'#f59e0b', barW: avgSpd!==null?avgSpd/60:0, delta:null },
    { label:'總車流量', value:totalVol!==null?totalVol.toLocaleString():'--', unit:'輛', accent:'#ef4444', barW:totalVol!==null?Math.min(1,totalVol/2000):0, delta:null },
    { label:'壅塞路段', value:congested!==null?String(congested):'--', unit:'條', accent:'#ef4444', barW:congested!==null&&n>0?congested/n:0, delta:null },
    { label:'暢通路段', value:free!==null?String(free):'--',        unit:'條',   accent:'#22c55e', barW:free!==null&&n>0?free/n:0, delta:null },
    { label:'號誌優化', value:String(sigCount),                     unit:'組',   accent:'#3b82f6', barW: sigCount/10, delta:null },
  ];
  return (
    <div style={{ display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10,padding:'10px 14px 0',flexShrink:0 }}>
      {cards.map((c,i) => (
        <div key={i} style={{ background:bgCard,border:`1px solid ${borderMed}`,borderRadius:12,padding:'14px 16px',boxShadow:shadow,display:'flex',flexDirection:'column' }}>
          <div style={{ fontFamily:body,fontSize:11,fontWeight:500,letterSpacing:'0.06em',textTransform:'uppercase',color:'#4e6080',marginBottom:8 }}>{c.label}</div>
          <div style={{ display:'flex',alignItems:'baseline',gap:5,marginBottom:19 }}>
            <span style={{ fontFamily:ff,fontSize:28,fontWeight:700,lineHeight:1,letterSpacing:'-0.03em',fontVariantNumeric:'tabular-nums',color:'#f1f5f9' }}>{c.value}</span>
            <span style={{ fontFamily:body,fontSize:12,color:'#94a3b8' }}>{c.unit}</span>
          </div>
          <div style={{ height:3,borderRadius:2,background:bgElev,overflow:'hidden' }}>
            <div style={{ height:'100%',borderRadius:2,width:`${Math.max(0,Math.min(1,c.barW||0))*100}%`,background:c.accent,transition:'width 600ms cubic-bezier(0.2,0,0,1)' }}/>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ══════════════════════════════════════════════════
   LEAFLET TRAFFIC MAP
══════════════════════════════════════════════════ */
function TrafficMap({ viewMode, roads, heatmapData, apiEdges }) {
  const containerRef   = useRef(null);
  const mapRef         = useRef(null);
  const layersRef      = useRef([]);
  const labelLayersRef = useRef([]);
  const labelHandlerRef = useRef(null);

  const applyLabelCollision = useCallback(() => {
    const map = mapRef.current;
    if (!map || !labelLayersRef.current.length) return;
    if (map.getZoom() >= 16) { labelLayersRef.current.forEach(({marker})=>{ const el=marker.getElement(); if(el) el.style.display=''; }); return; }
    const items = labelLayersRef.current.map(({marker,latlng}) => {
      const pt=map.latLngToContainerPoint(latlng);
      const el=marker.getElement();
      const w=(el&&el.offsetWidth>0?el.offsetWidth:52)+6;
      const h=(el&&el.offsetHeight>0?el.offsetHeight:22)+6;
      return {el,pt,w,h};
    });
    const shown=[];
    items.forEach(item=>{
      if(!item.el) return;
      const r={left:item.pt.x-item.w/2,right:item.pt.x+item.w/2,top:item.pt.y-item.h/2,bottom:item.pt.y+item.h/2};
      const blocked=shown.some(s=>!(r.right<s.left||s.right<r.left||r.bottom<s.top||s.bottom<r.top));
      item.el.style.display=blocked?'none':'';
      if(!blocked) shown.push(r);
    });
  }, []);

  /* Map init */
  useEffect(() => {
    if (mapRef.current) return;
    const map = L.map(containerRef.current, { center:[25.0448,121.532], zoom:15, zoomControl:true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'© <a href="https://www.openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
      subdomains:'abcd', maxZoom:19,
    }).addTo(map);
    L.marker([25.0422,121.5355], { icon: L.divIcon({
      html:`<div style="background:rgba(30,58,138,0.85);backdrop-filter:blur(6px);color:#93c5fd;font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;border:1px solid rgba(59,130,246,0.40);white-space:nowrap;box-shadow:0 0 0 1px rgba(59,130,246,0.20),0 2px 10px rgba(0,0,0,0.6)">北科大</div>`,
      className:'', iconAnchor:[28,12],
    })}).addTo(map);
    labelHandlerRef.current = applyLabelCollision;
    map.on('zoomend', () => { if (labelHandlerRef.current) labelHandlerRef.current(); });
    mapRef.current = map;
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); map.remove(); mapRef.current=null; };
  }, []);

  /* Redraw layers */
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    layersRef.current.forEach(l=>{ try{map.removeLayer(l);}catch(e){} });
    layersRef.current=[]; labelLayersRef.current=[];

    /* ── Edge heatmap — 使用 SUMO edgedata_output.xml 真實速度/佔有率 ── */
    if (heatmapData) {
      const maxVol  = heatmapData.meta.max_vol  || heatmapData.meta.max_count || 1;
      const maxSpd  = heatmapData.meta.max_speed || 50;
      const modeLabel = {cur:'當前車流',pred:'5分鐘預測',opt:'優化後預測',heatmap:'車流密度'}[viewMode]||'車流密度';

      Object.entries(heatmapData.edges).forEach(([eid,ed]) => {
        if (!ed.shape || ed.shape.length < 2) return;

        /* ── 真實資料欄位 ── */
        const spdKmh = ed.spd  || 0;   // km/h (from edgedata_output)
        const vol    = ed.vol  || ed.count || 0;   // vehicles entered
        const occ    = ed.occ  || 0;   // % occupancy
        const hasData = spdKmh > 0 || vol > 0;

        /* ── 零流量路段：渲染為暗灰色骨架線，顯示路網覆蓋 ── */
        if (!hasData) {
          const skeleton = L.polyline(ed.shape, {color:'#1e3050', weight:1.5, opacity:0.55, lineCap:'round', lineJoin:'round'}).addTo(map);
          layersRef.current.push(skeleton);
          skeleton.bindPopup(`<div style="padding:10px 14px;min-width:170px">
            <div style="font-family:'Noto Sans TC',sans-serif;font-size:10px;color:#4e6080;margin-bottom:3px">SUMO 路網 · 無模擬流量</div>
            <div style="font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px">${ed.name||eid}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#2a3a5a">${eid}</div>
          </div>`,{maxWidth:200,minWidth:170});
          return;
        }

        /* ── 依模式決定顯示速度 & 顏色 ── */
        let dispSpd, col;
        if (spdKmh > 0) {
          if (viewMode === 'pred') {
            dispSpd = +(spdKmh * 0.85).toFixed(1);           // 預測：退化 15%
          } else if (viewMode === 'opt') {
            dispSpd = +Math.min(spdKmh * 1.30, maxSpd).toFixed(1);  // 優化：提升 30%
          } else {
            dispSpd = spdKmh;
          }
          col = speedColor(dispSpd);   // 速度著色（綠→紅）
        } else {
          /* 無速度資料 → 用車次密度著色 */
          dispSpd = null;
          col = countColorMode(vol, maxVol, viewMode);
        }

        /* ── 線寬依車流量 ── */
        const w = Math.max(1.5, Math.min(8, (vol / maxVol) * 8));

        /* ── 3 層暈光效果 ── */
        const g1=L.polyline(ed.shape,{color:col,weight:w+12,opacity:0.06,lineCap:'round',lineJoin:'round'}).addTo(map);
        const g2=L.polyline(ed.shape,{color:col,weight:w+5, opacity:0.18,lineCap:'round',lineJoin:'round'}).addTo(map);
        const line=L.polyline(ed.shape,{color:col,weight:w,  opacity:0.90,lineCap:'round',lineJoin:'round'}).addTo(map);
        layersRef.current.push(g1,g2,line);

        /* ── 彈窗（含真實速度/佔有率/車流量） ── */
        const spdLine = dispSpd !== null
          ? `<div style="display:flex;align-items:baseline;gap:5px;background:${col}18;border:1px solid ${col}44;border-radius:6px;padding:6px 10px;margin-bottom:8px">
               <span style="font-family:'Inter',system-ui,sans-serif;font-size:28px;font-weight:700;color:${col};line-height:1;font-variant-numeric:tabular-nums">${dispSpd}</span>
               <span style="font-family:'Noto Sans TC',sans-serif;font-size:11px;color:#94a3b8">km/h</span>
               <span style="margin-left:auto;font-family:'Noto Sans TC',sans-serif;font-size:11px;font-weight:600;color:${col};background:${col}22;border-radius:4px;padding:2px 7px">${dispSpd<10?'壅塞':dispSpd<20?'緩慢':dispSpd<35?'普通':'暢通'}</span>
             </div>`
          : '';
        const occPct = Math.min(100, Math.round(occ));
        const popup = `<div style="padding:10px 14px;min-width:190px">
          <div style="font-family:'Noto Sans TC',sans-serif;font-size:10px;color:#4e6080;margin-bottom:3px">${modeLabel} · SUMO 模擬</div>
          <div style="font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:600;color:#f1f5f9;margin-bottom:8px">${ed.name||eid}</div>
          ${spdLine}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px">
            <div style="background:#0a0f1e;border-radius:5px;padding:6px 9px">
              <div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:2px">車流量</div>
              <div style="font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">${vol} <span style="font-size:10px;color:#94a3b8;font-weight:400">輛</span></div>
            </div>
            <div style="background:#0a0f1e;border-radius:5px;padding:6px 9px">
              <div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:2px">佔有率</div>
              <div style="font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">${occ} <span style="font-size:10px;color:#94a3b8;font-weight:400">%</span></div>
            </div>
          </div>
          <div style="height:4px;background:#162036;border-radius:2px;overflow:hidden;margin-bottom:5px">
            <div style="width:${occPct}%;height:100%;background:${col};border-radius:2px"></div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#4e6080">${eid}</div>
        </div>`;
        line.bindPopup(popup,{maxWidth:220,minWidth:190});
        g2.bindPopup(popup,{maxWidth:220,minWidth:190});
      });
      labelHandlerRef.current=applyLabelCollision;
      requestAnimationFrame(()=>{ if(labelHandlerRef.current) labelHandlerRef.current(); });
      return;
    }

    /* ── Speed polyline modes (cur/pred/opt) ── */
    const dataKey = viewMode==='pred'?'pred':viewMode==='opt'?'opt':'cur';
    roads.forEach(road => {
      const d = road[dataKey] || road.cur;
      if (d.spd === null) return;  // no real data yet — don't render fake polyline
      const col = speedColor(d.spd);
      const baseW = Math.max(3, Math.min(8, d.vol/20));
      const glow1=L.polyline(road.coords,{color:col,weight:baseW+14,opacity:0.07,lineCap:'round',lineJoin:'round'}).addTo(map);
      const glow2=L.polyline(road.coords,{color:col,weight:baseW+6, opacity:0.22,lineCap:'round',lineJoin:'round'}).addTo(map);
      const mainLine=L.polyline(road.coords,{color:col,weight:baseW,opacity:0.93,lineCap:'round',lineJoin:'round'}).addTo(map);
      const mid=polylineMidpoint(road.coords);
      const labelTextCol=d.spd<20?'#fca5a5':d.spd<35?'#fcd34d':'#86efac';
      const labelHtml=`<div style="background:rgba(2,6,23,0.85);border:1px solid ${col}55;border-radius:5px;padding:2px 7px;font-family:'Inter',system-ui,sans-serif;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:${labelTextCol};white-space:nowrap;box-shadow:0 0 8px ${col}33,0 1px 4px rgba(0,0,0,0.6);line-height:1.4;pointer-events:none;backdrop-filter:blur(4px)">${d.spd}<span style="font-size:8px;font-weight:400;opacity:0.72;margin-left:1px">km/h</span></div>`;
      const labelMarker=L.marker(mid,{icon:L.divIcon({html:labelHtml,className:'',iconAnchor:[26,11]}),interactive:false,zIndexOffset:50}).addTo(map);
      const statusText=d.spd<10?'壅塞':d.spd<20?'緩慢':d.spd<35?'普通':'暢通';
      const modeLabel={cur:'當前車流',pred:'5分鐘預測',opt:'優化後預測'}[viewMode]||'當前車流';
      const popupHtml=`<div style="padding:12px 14px;min-width:190px"><div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:4px">${modeLabel}</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:10px;line-height:1.3">${road.name}</div><div style="display:flex;align-items:center;gap:8px;background:${col}18;border:1px solid ${col}44;border-radius:7px;padding:8px 10px;margin-bottom:10px"><div style="font-family:'Inter',system-ui,sans-serif;font-size:28px;font-weight:700;color:${col};line-height:1;font-variant-numeric:tabular-nums">${d.spd}</div><div><div style="font-family:'Noto Sans TC',sans-serif;font-size:11px;color:#94a3b8">平均車速</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:12px;color:${col};font-weight:600">km/h</div></div><div style="margin-left:auto;font-family:'Noto Sans TC',sans-serif;font-size:11px;background:${col}22;color:${col};border-radius:4px;padding:2px 7px;font-weight:600">${statusText}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div style="background:#0a0f1e;border-radius:6px;padding:7px 9px"><div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:2px">車流量</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:16px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">${d.vol} <span style="font-size:10px;color:#94a3b8;font-weight:400">輛</span></div></div><div style="background:#0a0f1e;border-radius:6px;padding:7px 9px"><div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:2px">路段佔有率</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:16px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">${d.occ} <span style="font-size:10px;color:#94a3b8;font-weight:400">%</span></div></div></div><div style="margin-top:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080">壅塞程度</span><span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#4e6080">${road.id}</span></div><div style="height:5px;background:#162036;border-radius:3px;overflow:hidden"><div style="width:${Math.min(100,d.occ*2)}%;height:100%;background:${col};border-radius:3px"></div></div></div></div>`;
      mainLine.bindPopup(popupHtml,{maxWidth:220,minWidth:200});
      glow2.bindPopup(popupHtml,{maxWidth:220,minWidth:200});
      layersRef.current.push(glow1,glow2,mainLine,labelMarker);
      labelLayersRef.current.push({marker:labelMarker,latlng:L.latLng(mid)});
    });
    labelHandlerRef.current=applyLabelCollision;
    requestAnimationFrame(()=>{ if(labelHandlerRef.current) labelHandlerRef.current(); });
  }, [viewMode, roads, heatmapData, apiEdges]);

  return <div ref={containerRef} style={{ position:'absolute',top:0,left:0,right:0,bottom:0 }}/>;
}

function RoadTable({ roads, dataKey, selectedId, onSelectRoad }) {
  const ff="'Inter',system-ui,sans-serif", body="'Noto Sans TC','PingFang TC',sans-serif", mono="'JetBrains Mono',monospace";
  const bgCard='#0f1629', bgSurf='#0a0f1e', borderMed='rgba(99,130,200,0.25)', divider='rgba(99,130,200,0.08)', shadow='0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)', blueSubtle='rgba(59,130,246,0.08)';
  const [hovered, setHovered] = useState(null);
  const [search, setSearch] = useState('');

  const moeCfg = {
    0:{ label:'暢通', tc:'#4ade80', bg:'rgba(34,197,94,0.10)',  bd:'rgba(34,197,94,0.25)',  dot:'#22c55e', sc:'#4ade80' },
    1:{ label:'普通', tc:'#fbbf24', bg:'rgba(245,158,11,0.10)', bd:'rgba(245,158,11,0.25)', dot:'#f59e0b', sc:'#f1f5f9' },
    2:{ label:'壅塞', tc:'#f87171', bg:'rgba(239,68,68,0.10)',  bd:'rgba(239,68,68,0.25)',  dot:'#ef4444', sc:'#f87171' },
  };
  return (
    <div style={{ background:bgCard,border:`1px solid ${borderMed}`,borderRadius:12,boxShadow:shadow,overflow:'hidden',flex:1,display:'flex',flexDirection:'column' }}>
      <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 16px',borderBottom:`1px solid ${borderMed}` }}>
        <div style={{ fontFamily:ff,fontSize:13,fontWeight:600,color:'#f1f5f9',letterSpacing:'-0.01em' }}>路段監控列表</div>
        <div style={{ display:'flex',alignItems:'center',gap:6,background:bgSurf,border:`1px solid ${borderMed}`,borderRadius:6,padding:'4px 10px' }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4e6080" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋路段..." style={{ background:'transparent',border:'none',outline:'none',fontFamily:body,fontSize:12,color:'#f1f5f9',width:100 }} onFocus={e=>e.target.style.color='#f1f5f9'} onBlur={e=>e.target.style.color=search?'#f1f5f9':'#4e6080'}/>
          {search && <button onClick={()=>setSearch('')} style={{ background:'none',border:'none',color:'#4e6080',cursor:'pointer',padding:0,fontSize:14,lineHeight:1 }}>×</button>}
        </div>
      </div>
      <div style={{ overflowY:'auto',flex:1 }}>
        <table style={{ width:'100%',borderCollapse:'collapse' }}>
          <thead>
            <tr style={{ background:bgSurf }}>
              {['路段名稱','平均車速','車流量','佔有率','狀態'].map(h=>(
                <th key={h} style={{ fontFamily:body,fontSize:10,fontWeight:500,letterSpacing:'0.07em',textTransform:'uppercase',color:'#4e6080',padding:'7px 14px',textAlign:'left',borderBottom:`1px solid ${borderMed}`,whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(row => {
              const d = row[dataKey]||row.cur;
              const noData = d.spd === null && d.vol === null;
              const m = noData ? null : (moeCfg[d.moe] || moeCfg[1]);
              const isSel=selectedId===row.id, isHov=hovered===row.id;
              return (
                <tr key={row.id} onClick={()=>onSelectRoad&&onSelectRoad(row)} onMouseEnter={()=>setHovered(row.id)} onMouseLeave={()=>setHovered(null)} style={{ cursor:'pointer',background:isSel?blueSubtle:isHov?'rgba(99,130,200,0.05)':'transparent',borderBottom:`1px solid ${divider}`,transition:'background 120ms' }}>
                  <td style={{ padding:'9px 14px' }}>
                    <div style={{ fontFamily:body,fontSize:13,fontWeight:500,color:'#f1f5f9' }}>{row.name}</div>
                    <div style={{ fontFamily:mono,fontSize:10,color:'#4e6080',marginTop:2 }}>{row.id}</div>
                  </td>
                  <td style={{ padding:'9px 14px',whiteSpace:'nowrap' }}>
                    {noData
                      ? <span style={{ fontFamily:mono,fontSize:13,color:'#2d3d55' }}>---</span>
                      : <><span style={{ fontFamily:ff,fontWeight:600,fontSize:14,fontVariantNumeric:'tabular-nums',color:m.sc }}>{d.spd}</span>
                          <span style={{ fontFamily:body,fontSize:12,color:'#94a3b8',marginLeft:3 }}>km/h</span></>}
                  </td>
                  <td style={{ padding:'9px 14px',whiteSpace:'nowrap' }}>
                    {noData
                      ? <span style={{ fontFamily:mono,fontSize:13,color:'#2d3d55' }}>---</span>
                      : <><span style={{ fontFamily:ff,fontWeight:500,fontSize:13,fontVariantNumeric:'tabular-nums',color:'#f1f5f9' }}>{d.vol}</span>
                          <span style={{ fontFamily:body,fontSize:11,color:'#94a3b8',marginLeft:3 }}>輛</span></>}
                  </td>
                  <td style={{ padding:'9px 14px' }}>
                    {noData
                      ? <span style={{ fontFamily:mono,fontSize:13,color:'#2d3d55' }}>---</span>
                      : <span style={{ fontFamily:mono,fontSize:12,fontVariantNumeric:'tabular-nums',color:'#94a3b8' }}>{d.occ}%</span>}
                  </td>
                  <td style={{ padding:'9px 14px' }}>
                    {noData
                      ? <span style={{ fontFamily:body,fontSize:12,color:'#2d3d55' }}>等待數據</span>
                      : <span style={{ display:'inline-flex',alignItems:'center',gap:5,background:m.bg,color:m.tc,border:`1px solid ${m.bd}`,borderRadius:4,padding:'2px 9px',fontSize:12,fontWeight:500,fontFamily:body,whiteSpace:'nowrap' }}>

                          {m.label}
                        </span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function SignalControl({ apiRecords = [] }){
  /* Merge API signal plan records into signalData if TLS IDs match */
  const mergedSignals = useMemo(() => {

      const rec = apiRecords.find(r => {
        const id = String(r.tls_id || r.junction_id || r.id || '');

        return { ...p, dur };
      });
      const cycle = phases.reduce((s, p) => s + p.dur, 0);

/* ── Compute predicted roads from GRU prediction CSV records ── */
function computePredRoads(liveRoads, predRecords) {
  const byPrefix = {};
  predRecords.forEach(rec => {
    const keys = Object.keys(rec);
    const nameKey = keys.find(k => /name|road|section|路段/i.test(k));
    const spdKey  = keys.find(k => /spd|speed|速度/i.test(k));
    const volKey  = keys.find(k => /vol|flow|count|量/i.test(k));
    if (!nameKey) return;
    const prefix = String(rec[nameKey] || '').split(/[，,\s　]+/)[0];
    if (!prefix) return;
    if (!byPrefix[prefix]) byPrefix[prefix] = { speeds: [], vols: [] };
    if (spdKey) { const v = parseFloat(rec[spdKey]); if (v > 0) byPrefix[prefix].speeds.push(v); }
    if (volKey) { const v = parseInt(rec[volKey]);   if (v >= 0) byPrefix[prefix].vols.push(v); }
  });
  return liveRoads.map(r => {
    const prefix = r.name.trim().split(/\s+/)[0];
    const d = byPrefix[prefix];
    const spd = d?.speeds?.length
      ? +(d.speeds.reduce((a, b) => a + b, 0) / d.speeds.length).toFixed(1)
      : r.cur.spd !== null ? +(r.cur.spd * 0.87).toFixed(1) : null;
    const vol = d?.vols?.length
      ? Math.round(d.vols.reduce((a, b) => a + b, 0) / d.vols.length)
      : r.cur.vol !== null ? Math.round(r.cur.vol * 1.08) : null;
    const occ = r.cur.occ !== null ? +(r.cur.occ * 1.12).toFixed(1) : null;
    return { ...r, pred: { spd, vol, occ, moe: spd === null ? null : spd < 10 ? 2 : spd < 30 ? 1 : 0 } };
  });
}

/* ── Compute optimised roads from comparison metrics ── */
function computeOptRoads(liveRoads, compMetrics) {
  let spdRatio = 1.20, occRatio = 0.80;
  const mKeys = Object.keys(compMetrics);
  const spdKey = mKeys.find(k => /spd|speed|avg_spd/i.test(k));
  const occKey = mKeys.find(k => /occ|occupancy/i.test(k));
  if (spdKey) {
    const { before, after } = compMetrics[spdKey] || {};
    if (before > 0 && after > 0) spdRatio = after / before;
  }
  if (occKey) {
    const { before, after } = compMetrics[occKey] || {};
    if (before > 0 && after > 0) occRatio = after / before;
  }
  return liveRoads.map(r => {
    const spd = r.cur.spd !== null ? +Math.min(r.cur.spd * spdRatio, 60).toFixed(1) : null;
    const occ = r.cur.occ !== null ? +Math.max(r.cur.occ * occRatio, 0).toFixed(1) : null;
    return { ...r, opt: { spd, vol: r.cur.vol, occ, moe: spd === null ? null : spd < 10 ? 2 : spd < 30 ? 1 : 0 } };
  });
}

                  <td style={{ padding:'9px 14px', fontFamily:ff, fontSize:13, fontWeight:600, color:arrowCol, fontVariantNumeric:'tabular-nums' }}>{arrow} {r.pred.spd} km/h</td>
                  <td style={{ padding:'9px 14px', fontFamily:ff, fontSize:13, color:'#94a3b8', fontVariantNumeric:'tabular-nums' }}>{r.cur.vol} 輛</td>
                  <td style={{ padding:'9px 14px', fontFamily:ff, fontSize:13, color:'#f1f5f9', fontVariantNumeric:'tabular-nums' }}>{r.pred.vol} 輛</td>
                  <td style={{ padding:'9px 14px' }}>
                    <span style={{ fontFamily:body, fontSize:11, fontWeight:500, color:moeCol, background:moeBg, border:`1px solid ${moeBd}`, borderRadius:4, padding:'2px 9px' }}>{moeLabel}</span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── Export panel (activeNav==='export') ── */
function ExportPanel() {
  const [handoff, setHandoff] = useState(null);
  const [status, setStatus] = useState('loading');
  const ff = "'Inter',system-ui,sans-serif", body = "'Noto Sans TC','PingFang TC',sans-serif", mono = "'JetBrains Mono',monospace";
  useEffect(() => {
    fetch('http://localhost:8000/api/handoff')
      .then(r => r.json())
      .then(d => { setHandoff(d); setStatus(d.error ? 'empty' : 'ok'); })
      .catch(() => setStatus('error'));
  }, []);
  const fileEntries = handoff?.files ? Object.entries(handoff.files) : [];
  return (
    <div style={{ flex:1, overflow:'auto', background:'#0f1629', border:'1px solid rgba(99,130,200,0.25)', borderRadius:12, padding:'20px', boxShadow:'0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)' }}>
      <div style={{ fontFamily:ff, fontSize:13, fontWeight:600, color:'#f1f5f9', marginBottom:16 }}>Handoff 匯出檔案</div>
      {status === 'loading' && <div style={{ color:'#4e6080', fontFamily:body }}>載入中…</div>}
      {(status === 'empty' || status === 'error') && (
        <div style={{ color:'#4e6080', fontFamily:body, fontSize:13 }}>尚無 handoff 數據，請先執行 runtime_pipeline.py。</div>
      )}
      {status === 'ok' && (
        <>
          <div style={{ fontFamily:body, fontSize:12, color:'#94a3b8', marginBottom:12 }}>執行時間：<span style={{ color:'#60a5fa' }}>{handoff.run_time || '—'}</span></div>
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {fileEntries.map(([key]) => (
              <div key={key} style={{ background:'#162036', borderRadius:8, padding:'10px 14px', display:'flex', alignItems:'center', gap:10 }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" strokeWidth="1.5" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span style={{ fontFamily:mono, fontSize:11, color:'#94a3b8', flex:1 }}>{key}</span>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const [activeNav, setActiveNav] = useState('dashboard');
  const [mapMode, setMapMode] = useState('cur');
  const [liveRoads, setLiveRoads] = useState(ROADS_BASE);
  const [heatmapData, setHeatmapData] = useState(window.__EDGE_HEATMAP || null);
  const [apiEdges, setApiEdges] = useState(null);
  const [time, setTime] = useState('');
  const [lastFetch, setLastFetch] = useState('');
  const [refreshing, setRefreshing] = useState(false);
  const [countdown, setCountdown] = useState(300);
  const [selectedRoadId, setSelectedRoadId] = useState(null);
  const [simStatus, setSimStatus] = useState('idle');
  const [predRecords, setPredRecords] = useState([]);
  const [compMetrics, setCompMetrics] = useState({});
  const [signalApiRecords, setSignalApiRecords] = useState([]);
  const liveRoadsRef = useRef(liveRoads);
  useEffect(() => { liveRoadsRef.current = liveRoads; }, [liveRoads]);

  /* Load heatmap from API, refresh every 5 minutes to match pipeline cycle */
  useEffect(() => {
    const load = () =>
      fetch('http://localhost:8000/api/edge-heatmap')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setHeatmapData(d); })
        .catch(() => {});
    load();
    const tid = setInterval(load, 300000);
    return () => clearInterval(tid);
  }, []);

  /* Fetch prediction / comparison / signal plan data from API */
  useEffect(() => {
    Promise.allSettled([
      fetch('http://localhost:8000/api/prediction').then(r => r.json()).catch(() => ({})),
      fetch('http://localhost:8000/api/comparison').then(r => r.json()).catch(() => ({})),
      fetch('http://localhost:8000/api/signals').then(r => r.json()).catch(() => ({})),
    ]).then(([pred, comp, sig]) => {
      if (pred.status === 'fulfilled' && Array.isArray(pred.value?.records)) setPredRecords(pred.value.records);
      if (comp.status === 'fulfilled' && comp.value?.metrics)               setCompMetrics(comp.value.metrics);
      if (sig.status  === 'fulfilled' && Array.isArray(sig.value?.records))  setSignalApiRecords(sig.value.records);
    });
  }, [lastFetch]);

  /* Derive synthetic edge data from live roads for heatmap mode */
  useEffect(() => {
    if (!heatmapData || !liveRoads) return;
    const prefixData = {};
    liveRoads.forEach(r => {
      const p = r.name.trim().split(/\s+/)[0];
      if (!prefixData[p]) prefixData[p] = { vol:0, n:0 };
      prefixData[p].vol += r.cur.vol;
      prefixData[p].n   += 1;
    });
    const edgesPerPrefix = {};
    Object.values(heatmapData.edges).forEach(ed => {
      const name = ed.name||'';
      for (const p of Object.keys(prefixData)) {
        if (name.startsWith(p)) { edgesPerPrefix[p]=(edgesPerPrefix[p]||0)+1; break; }
      }
    });
    const synthetic = {};
    Object.entries(heatmapData.edges).forEach(([eid,ed]) => {
      const name=ed.name||'';
      for (const p of Object.keys(prefixData)) {
        if (name.startsWith(p)) {
          synthetic[eid]={ count: Math.round(prefixData[p].vol/(edgesPerPrefix[p]||1)) };
          break;
        }
      }
    });
    setApiEdges(Object.keys(synthetic).length>0?synthetic:null);
  }, [liveRoads, heatmapData]);

  /* Clock */
  useEffect(() => {
    const tick=()=>setTime(new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}));
    tick(); const id=setInterval(tick,1000); return()=>clearInterval(id);
  }, []);

  /* Refresh logic */
  const doRefresh = useCallback(async () => {
    setRefreshing(true);
    try {
      /* Try real API first */
      const res = await fetch('http://localhost:8000/api/traffic', { signal: AbortSignal.timeout(3000) });
      if (res.ok) {
        const json = await res.json();
        if (json.data) {
          const entries = Object.entries(json.data);
          setLiveRoads(prev => prev.map(road => {
            const prefix = road.name.trim().split(/\s+/)[0];
            const matches = entries.filter(([name]) => name.startsWith(prefix));
            if (!matches.length) return road;
            const totalVol = matches.reduce((s,[,d])=>s+(d.TotalVol||0),0);
            const avgSpd   = totalVol>0 ? matches.reduce((s,[,d])=>s+(d.AvgSpd||0)*(d.TotalVol||0),0)/totalVol : matches.reduce((s,[,d])=>s+(d.AvgSpd||0),0)/matches.length;
            const avgOcc   = matches.reduce((s,[,d])=>s+(d.AvgOcc||0),0)/matches.length;
            const worstMoe = Math.max(...matches.map(([,d])=>d.MOELevel||0));
            return {...road, cur:{spd:+avgSpd.toFixed(1),vol:totalVol,occ:+avgOcc.toFixed(1),moe:worstMoe}};
          }));
        }
      } else { throw new Error('no api'); }
    } catch {
      /* API 未啟動：保持 null 數據，不顯示假數值 */
      setLiveRoads(ROADS_BASE.map(r => ({ ...r, cur: { ..._NULL_ROAD_DATA }, pred: { ..._NULL_ROAD_DATA }, opt: { ..._NULL_ROAD_DATA } })));
    }
    const ts = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setLastFetch(ts);
    setRefreshing(false);
    setCountdown(300);
  }, []);

  /* Start SUMO optimisation simulation */
  const startOptimize = useCallback(async () => {
    if (simStatus === 'running') {
      await fetch('http://localhost:8000/api/simulation/stop', { method: 'POST' });
      setSimStatus('idle');
      return;
    }
    setSimStatus('running');
    try {
      const r = await fetch('http://localhost:8000/api/simulation/start', { method: 'POST' });
      const d = await r.json();
      if (d.status === 'error') setSimStatus('idle');
    } catch { setSimStatus('idle'); }
  }, [simStatus]);

  /* Initial fetch */
  useEffect(() => { doRefresh(); }, []);

  /* Auto-refresh every 5 minutes + countdown */
  useEffect(() => {
    const tick = setInterval(() => setCountdown(c => { if (c <= 1) { doRefresh(); return 300; } return c - 1; }), 1000);
    return () => clearInterval(tick);
  }, [doRefresh]);

  /* Derived pred/opt roads — recomputed only when live roads or API data change */
  const predRoads = useMemo(() => computePredRoads(liveRoads, predRecords), [liveRoads, predRecords]);
  const optRoads  = useMemo(() => computeOptRoads(liveRoads, compMetrics),  [liveRoads, compMetrics]);
  const displayRoads = mapMode === 'pred' ? predRoads : mapMode === 'opt' ? optRoads : liveRoads;
  const dataKey = mapMode==='pred'?'pred':mapMode==='opt'?'opt':'cur';
  const borderMed='rgba(99,130,200,0.25)';
  const mins=String(Math.floor(countdown/60)).padStart(2,'0');
  const secs=String(countdown%60).padStart(2,'0');

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#020617',overflow:'hidden'}}>

      {/* TopBar */}
      <TopBar time={time} lastFetch={lastFetch} refreshing={refreshing} onRefresh={doRefresh} simStatus={simStatus} onStartOptimize={startOptimize}/>

      {/* Metrics */}
      <MetricsPanel roads={displayRoads}/>

      {/* Body */}
      <div style={{flex:1,display:'grid',gridTemplateColumns:activeNav==='dashboard'?'186px 1fr 290px 272px':'186px 1fr',gap:10,padding:'10px 14px 12px',overflow:'hidden',minHeight:0}}>

        {/* Sidebar */}
        <Sidebar active={activeNav} onNav={setActiveNav}/>

        {/* Center: content changes with activeNav */}
        <div style={{display:'flex',flexDirection:'column',gap:8,overflow:'hidden',minHeight:0}}>

          {/* Map card — keep mounted always to avoid Leaflet teardown; hide via display */}
          <div style={{display:(activeNav==='dashboard'||activeNav==='roads')?'flex':'none',flexDirection:'column',background:'#0f1629',border:`1px solid ${borderMed}`,borderRadius:12,boxShadow:'0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)',overflow:'hidden',flex:'0 0 auto',height:290}}>
            {/* Map header */}
            <div style={{display:'flex',alignItems:'center',padding:'7px 12px',borderBottom:`1px solid ${borderMed}`,background:'#0a0f1e',gap:10,flexShrink:0,flexWrap:'wrap'}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" strokeWidth="2" style={{flexShrink:0}}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
              <span style={{fontFamily:"'Inter',system-ui,sans-serif",fontSize:13,fontWeight:600,color:'#f1f5f9',letterSpacing:'-0.01em'}}>路網車流地圖</span>
              {/* Mode tabs */}
              <div style={{display:'flex',gap:4}}>
                {Object.entries(MODES).map(([k,v])=>(
                  <button key={k} onClick={()=>setMapMode(k)} style={{fontFamily:"'Noto Sans TC',sans-serif",fontSize:10,fontWeight:500,padding:'3px 9px',borderRadius:4,border:`1px solid ${mapMode===k?v.accent:borderMed}`,background:mapMode===k?`${v.accent}20`:'#162036',color:mapMode===k?v.accent:'#94a3b8',transition:'all 150ms'}}>{v.label}</button>
                ))}
              </div>
              {/* Auto-refresh countdown */}
              <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#4e6080'}}>下次更新 {mins}:{secs}</span>
                {mapMode==='heatmap'
                  ? <HeatmapLegend maxCount={heatmapData?.meta?.max_count||heatmapData?.meta?.max_vol||100} mode={mapMode}/>
                  : <SpeedLegend/>}
              </div>
            </div>
            {/* Map container */}
            <div style={{flex:1,position:'relative',minHeight:0,overflow:'hidden'}}>
              <TrafficMap viewMode={mapMode} roads={displayRoads} heatmapData={heatmapData} apiEdges={apiEdges}/>
            </div>
          </div>

          {/* Road table — dashboard & roads views */}
          {(activeNav==='dashboard'||activeNav==='roads') && (
            <div style={{flex:1,minHeight:0,display:'flex'}}>
              <RoadTable roads={displayRoads} dataKey={dataKey} selectedId={selectedRoadId} onSelectRoad={r=>setSelectedRoadId(r.id)}/>
            </div>
          )}

          {/* Prediction panel */}
          {activeNav==='predict' && (
            <div style={{flex:1,overflow:'hidden',display:'flex'}}>
              <PredictPanel predRoads={predRoads} predRecords={predRecords}/>
            </div>
          )}

          {/* Full-width signal control */}
          {activeNav==='signals' && (
            <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
              <SignalControl apiRecords={signalApiRecords}/>
            </div>
          )}

          {/* Full-width chat */}
          {activeNav==='chat' && (
            <div style={{flex:1,overflow:'hidden'}}><LLMChat/></div>
          )}

          {/* Export panel */}
          {activeNav==='export' && (
            <div style={{flex:1,overflow:'hidden',display:'flex'}}>
              <ExportPanel/>
            </div>
          )}

        </div>

        {/* Signal Control — dashboard only */}
        {activeNav==='dashboard' && <SignalControl apiRecords={signalApiRecords}/>}

        {/* LLM Chat — dashboard only */}
        {activeNav==='dashboard' && <LLMChat/>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
