/* ══════════════════════════════════════════════════
   COLOR HELPERS
══════════════════════════════════════════════════ */
function lerpColor(a, b, t) {
  const ah=parseInt(a.slice(1),16), bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&0xff, ag=(ah>>8)&0xff, ab=ah&0xff;
  const br=(bh>>16)&0xff, bg=(bh>>8)&0xff, bb=bh&0xff;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return `#${((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0')}`;
}
function speedColor(spd) {
  if (spd <=  0) return '#ef4444';
  if (spd <= 10) return lerpColor('#ef4444','#f97316', spd/10);
  if (spd <= 20) return lerpColor('#f97316','#f59e0b',(spd-10)/10);
  if (spd <= 30) return lerpColor('#f59e0b','#84cc16',(spd-20)/10);
  if (spd <= 40) return lerpColor('#84cc16','#22c55e',(spd-30)/10);
  return '#22c55e';
}
function countColorMode(count, maxCount, mode) {
  if (!count || !maxCount) return 'rgba(99,130,200,0.12)';
  const t = Math.min(1, count / maxCount);
  if (mode === 'pred') {
    if (t < 0.25) return lerpColor('#22c55e','#84cc16', t/0.25);
    if (t < 0.5)  return lerpColor('#84cc16','#f59e0b',(t-0.25)/0.25);
    if (t < 0.75) return lerpColor('#f59e0b','#fb923c',(t-0.5)/0.25);
    return             lerpColor('#fb923c','#dc2626',(t-0.75)/0.25);
  }
  if (t < 0.25) return lerpColor('#22c55e','#84cc16', t/0.25);
  if (t < 0.5)  return lerpColor('#84cc16','#f59e0b',(t-0.25)/0.25);
  if (t < 0.75) return lerpColor('#f59e0b','#f97316',(t-0.5)/0.25);
  return             lerpColor('#f97316','#ef4444',(t-0.75)/0.25);
}
function polylineMidpoint(pts) {
  if (pts.length < 2) return pts[0] || [0,0];
  let total=0;
  const dists=pts.slice(0,-1).map((p,i)=>{ const d=L.latLng(p).distanceTo(L.latLng(pts[i+1])); total+=d; return d; });
  let acc=0; const half=total/2;
  for (let i=0;i<dists.length;i++) {
    if (acc+dists[i]>=half) { const t=dists[i]>0?(half-acc)/dists[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t]; }
    acc+=dists[i];
  }
  return pts[Math.floor(pts.length/2)];
}

function MetricsPanel({ roads, dataKey = 'cur' }) {
  const ff="'Inter',system-ui,sans-serif", body="'Noto Sans TC','PingFang TC',sans-serif";
  const bgCard='#0f1629', bgElev='#162036', borderMed='rgba(99,130,200,0.25)', shadow='0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)';
  const n = roads.length;
  /* 依當前模式 (cur / pred / opt) 取對應的指標欄位；
     不然 pred / opt 模式下 edgeMonitorRoads 的 cur 是空殼，所有統計都會變 -- */
  const _d = (r) => r[dataKey] || r.cur || {};
  const roadsWithData = roads.filter(r => _d(r).spd != null);
  const hasData = roadsWithData.length > 0;
  /* avgSpd 用 spd > 0 的子集計算：dashboard 監控列表會包含 SUMO 路網中
     沒車經過的死巷邊 (spd 紀錄為 0 但非 null)，把它們算進平均會把整體車速
     往下拉 (pred 模式 32.9 vs 排除後 41 km/h)。物理意義也對：「平均車速」
     應該是「實際在動的路段平均速度」。其他統計 (totalVol/congested/free)
     仍用 roadsWithData，因為 vol/moe 對 spd=0 的邊仍有意義 */
  const movingRoads = roadsWithData.filter(r => _d(r).spd > 0);
  const avgSpd = movingRoads.length ? +(movingRoads.reduce((s,r)=>s+_d(r).spd,0)/movingRoads.length).toFixed(1) : null;
  const totalVol = hasData ? roadsWithData.reduce((s,r)=>s+(_d(r).vol||0),0) : null;
  const congested = hasData ? roadsWithData.filter(r=>_d(r).moe===2).length : null;
  const free = hasData ? roadsWithData.filter(r=>_d(r).moe===0).length : null;
  const sigCount = signalData.length;

  /* T3: 每張 card 加 tooltip 解釋資料源 + 單位, 依當前 dataKey (cur/pred/opt) 分歧.
         今天踩過好幾個「為何 X 跟 Y 數字差這麼多」的問題, 把單位明寫在 hover 提示
         可以避免類似誤會. 用 native HTML title 屬性 (browser tooltip), 不增加 deps. */
  const _src = {
    cur:  {vol:'VD 偵測器即時通過量 (TotalVol/3)', spd:'VD 即時平均車速', occ:'VD 即時佔有率'},
    pred: {vol:'GRU pair model 預測 (15 步 × 20 秒 snapshot Σ vehicle_count) — 單位不同於 VD 通過量,差約 6 倍由 Little\'s Law',
           spd:'SUMO no_control 基準模擬, 排除 spd=0 死巷後算術平均', occ:'SUMO no_control 基準模擬'},
    opt:  {vol:'= 預測 vol (車輛數不會因號誌優化而消失)', spd:'SUMO best-strategy 模擬 (顯示優化後速度)', occ:'SUMO best-strategy 模擬'},
  };
  const s = _src[dataKey] || _src.cur;

  const cards = [
    { label:'監控路段', value:String(n),                            unit:'條',   accent:'#3b82f6', barW: 1.0, delta:null, tip:`${dataKey==='cur'?'VD 偵測器':'SUMO + GRU'} 覆蓋的路段/邊數` },
    { label:'平均車速', value:avgSpd!==null?String(avgSpd):'--',    unit:'km/h', accent:'#f59e0b', barW: avgSpd!==null?avgSpd/60:0, delta:null, tip:`${s.spd} (僅含 spd>0 的路段, 排除 SUMO 沒測到速度的邊)` },
    { label:'總車流量', value:totalVol!==null?totalVol.toLocaleString():'--', unit:'輛', accent:'#ef4444', barW:totalVol!==null?Math.min(1,totalVol/2000):0, delta:null, tip:s.vol },
    { label:'壅塞路段', value:congested!==null?String(congested):'--', unit:'條', accent:'#ef4444', barW:congested!==null&&n>0?congested/n:0, delta:null, tip:'MOE = 2 的路段數 (車速 < 10 km/h, 或 VD 回報的 MOELevel)' },
    { label:'暢通路段', value:free!==null?String(free):'--',        unit:'條',   accent:'#22c55e', barW:free!==null&&n>0?free/n:0, delta:null, tip:'MOE = 0 的路段數 (車速 ≥ 30 km/h, 或 VD 回報的 MOELevel)' },
    { label:'號誌優化', value:String(sigCount),                     unit:'組',   accent:'#3b82f6', barW: sigCount/10, delta:null, tip:'本輪有產出 signal plan 的路口數 (來自 signal_plan_summary.csv)' },
  ];
  return (
    <div style={{ display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10,padding:'10px 14px 0',flexShrink:0 }}>
      {cards.map((c,i) => (
        <div key={i} title={c.tip || ''} style={{ background:bgCard,border:`1px solid ${borderMed}`,borderRadius:12,padding:'14px 16px',boxShadow:shadow,display:'flex',flexDirection:'column',cursor:c.tip?'help':'default' }}>
          <div style={{ fontFamily:body,fontSize:11,fontWeight:500,letterSpacing:'0.06em',textTransform:'uppercase',color:'#4e6080',marginBottom:8,display:'flex',alignItems:'center',gap:4 }}>
            {c.label}
            {c.tip && <span aria-hidden="true" style={{fontSize:9,opacity:0.5}}>ⓘ</span>}
          </div>
          <div style={{ display:'flex',alignItems:'baseline',gap:5,marginBottom:19 }}>
            <span style={{ fontFamily:ff,fontSize:28,fontWeight:700,lineHeight:1,letterSpacing:'-0.03em',fontVariantNumeric:'tabular-nums',color:'#f1f5f9' }}>{c.value}</span>
            <span style={{ fontFamily:body,fontSize:12,color:'#94a3b8' }}>{c.unit}</span>
          </div>
          <div style={{ height:3,borderRadius:2,background:bgElev,overflow:'hidden' }}>
            <div style={{ height:'100%',borderRadius:2,width:`${Math.max(0,Math.min(1,c.barW||0))*100}%`,background:c.accent,transition:'width 600ms cubic-bezier(0.2,0,0,1)' }}/>
          </div>
        </div>
      ))}
    </div>
  );
}

function SpeedLegend() {

  return (
    <div style={{ display:'flex',alignItems:'center',gap:8 }}>
      <span style={{ fontFamily:"'Noto Sans TC',sans-serif",fontSize:10,color:'#4e6080',whiteSpace:'nowrap' }}>車速</span>
      <div style={{ display:'flex',alignItems:'center' }}>
        {stops.map((spd,i)=>i<stops.length-1&&(
          <div key={spd} style={{ display:'flex',flexDirection:'column',alignItems:'center' }}>
            <div style={{ width:24,height:4,background:`linear-gradient(90deg,${speedColor(spd)},${speedColor(stops[i+1])})`,borderRadius:i===0?'3px 0 0 3px':i===stops.length-2?'0 3px 3px 0':'0' }}/>

function HeatmapLegend({ maxCount, mode }) {
  const stops=[0,0.25,0.5,0.75,1.0]; const mc=maxCount||1;
  const cf=v=>countColorMode(v*mc,mc,mode);
  return (
    <div style={{ display:'flex',alignItems:'center',gap:8 }}>
      <span style={{ fontFamily:"'Noto Sans TC',sans-serif",fontSize:10,color:'#4e6080',whiteSpace:'nowrap' }}>車次密度</span>
      <div style={{ display:'flex',alignItems:'center' }}>
        {stops.map((t,i)=>i<stops.length-1&&(
          <div key={t} style={{ display:'flex',flexDirection:'column',alignItems:'center' }}>
            <div style={{ width:28,height:4,background:`linear-gradient(90deg,${cf(t)},${cf(stops[i+1])})`,borderRadius:i===0?'3px 0 0 3px':i===stops.length-2?'0 3px 3px 0':'0' }}/>
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'#4e6080',marginTop:1 }}>{Math.round(t*mc)}</span>

        <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'#4e6080',marginTop:5,marginLeft:2 }}>{mc}+</span>

/* ══════════════════════════════════════════════════
   LEAFLET TRAFFIC MAP
══════════════════════════════════════════════════ */
function TrafficMap({ viewMode, roads, heatmapData, baselineHeatmapData, currentHeatmapData }) {
  const containerRef   = useRef(null);
  const mapRef         = useRef(null);
  const layersRef      = useRef([]);
  const labelLayersRef = useRef([]);
  const labelHandlerRef = useRef(null);

  const applyLabelCollision = useCallback(() => {
    const map = mapRef.current;
    if (!map || !labelLayersRef.current.length) return;
    if (map.getZoom() >= 16) { labelLayersRef.current.forEach(({marker})=>{ const el=marker.getElement(); if(el) el.style.display=''; }); return; }
    const items = labelLayersRef.current.map(({marker,latlng}) => {
      const pt=map.latLngToContainerPoint(latlng);
      const el=marker.getElement();
      const w=(el&&el.offsetWidth>0?el.offsetWidth:52)+6;
      const h=(el&&el.offsetHeight>0?el.offsetHeight:22)+6;
      return {el,pt,w,h};
    });
    const shown=[];
    items.forEach(item=>{
      if(!item.el) return;
      const r={left:item.pt.x-item.w/2,right:item.pt.x+item.w/2,top:item.pt.y-item.h/2,bottom:item.pt.y+item.h/2};
      const blocked=shown.some(s=>!(r.right<s.left||s.right<r.left||r.bottom<s.top||s.bottom<r.top));
      item.el.style.display=blocked?'none':'';
      if(!blocked) shown.push(r);
    });
  }, []);

  /* Map init */
  useEffect(() => {
    if (mapRef.current) return;
    const map = L.map(containerRef.current, { center:[25.0448,121.532], zoom:15, zoomControl:true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'© <a href="https://www.openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
      subdomains:'abcd', maxZoom:19,
    }).addTo(map);
    L.marker([25.0422,121.5355], { icon: L.divIcon({
      html:`<div style="background:rgba(30,58,138,0.85);backdrop-filter:blur(6px);color:#93c5fd;font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;border:1px solid rgba(59,130,246,0.40);white-space:nowrap;box-shadow:0 0 0 1px rgba(59,130,246,0.20),0 2px 10px rgba(0,0,0,0.6)">北科大</div>`,
      className:'', iconAnchor:[28,12],
    })}).addTo(map);
    labelHandlerRef.current = applyLabelCollision;
    map.on('zoomend', () => { if (labelHandlerRef.current) labelHandlerRef.current(); });
    mapRef.current = map;
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); map.remove(); mapRef.current=null; };
  }, []);

  /* Redraw layers */
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    layersRef.current.forEach(l=>{ try{map.removeLayer(l);}catch(e){} });
    layersRef.current=[]; labelLayersRef.current=[];

    /* ── Edge heatmap — 全路網 edge 幾何 ──
       pred → 基準(no_control)模擬；opt/heatmap → 最佳策略模擬；
       cur → 用五分鐘車流(baseline)的全路網幾何，但顏色改用真實 VD 車速。 */
    const isCur = viewMode === 'cur';
    const activeHeatmap =
      (viewMode === 'opt' || viewMode === 'heatmap') ? heatmapData
      : isCur ? (baselineHeatmapData || currentHeatmapData || heatmapData)
      : (baselineHeatmapData || heatmapData);   // pred

    const vdByPrefix = {};
    if (isCur) {
      roads.forEach(r => {
        if (r.cur && r.cur.spd != null) vdByPrefix[r.name.trim().split(/\s+/)[0]] = r.cur.spd;
      });
    }
    if (activeHeatmap) {
      const maxVol  = activeHeatmap.meta.max_vol  || activeHeatmap.meta.max_count || 1;
      const modeLabel = {cur:'當前車流',pred:'5分鐘預測',opt:'優化後預測',heatmap:'車流密度'}[viewMode]||'車流密度';

      /* 兩階段渲染：先畫無資料骨架 → 再畫有資料彩色線，後者自然蓋在上面。
         避免單一 forEach 順序裡，後處理的灰骨架蓋掉前面的綠線。

         注意：_entryHasData 的判斷必須與下方主迴圈裡的 hasData 完全一致，
         否則一條 edge 可能被排序為「無資料」（排到前面 → 被後面蓋住）但
         主迴圈又判定為「有資料」並彩色繪製，視覺上就被覆蓋住消失。 */
      const _entryHasData = ([_eid, ed]) => {
        const vol = ed.vol || ed.count || 0;
        if (isCur) {
          const nm = ed.name || '';
          for (const p in vdByPrefix) {
            if (nm.startsWith(p)) {
              const vSpd = vdByPrefix[p];
              return vSpd != null && vSpd > 0;
            }
          }
          return false;
        }
        return vol > 0;
      };
      const sortedEntries = Object.entries(activeHeatmap.edges)
        .slice()
        .sort((a, b) => (_entryHasData(a) ? 1 : 0) - (_entryHasData(b) ? 1 : 0));

      sortedEntries.forEach(([eid,ed]) => {
        if (!ed.shape || ed.shape.length < 2) return;

        /* ── 資料欄位 ── */
        const vol    = ed.vol  || ed.count || 0;   // 車流量(線寬用，五分鐘車流)
        const occ    = ed.occ  || 0;
        let vdSpd = null;
        if (isCur) {
          const nm = ed.name || '';
          for (const p in vdByPrefix) { if (nm.startsWith(p)) { vdSpd = vdByPrefix[p]; break; } }
        }
        const spdKmh = isCur ? (vdSpd || 0) : (ed.spd || 0);
        /* hasData 條件：
             cur 模式 — 只要 VD 有速度就算有資料（跟下方監控列表一致；
                        SUMO 模擬 vol 可能為 0 不代表真的沒車經過）
             pred / opt — SUMO 必須有車流量才算 */
        const hasData = isCur
          ? (vdSpd != null && vdSpd > 0)
          : (vol > 0);

        /* ── 無車流資料路段：藍灰骨架（#8b97b3），不綁 popup —
           點擊不彈窗，避免顯示誤導性的「0 輛 / 0%」面板。 */
        if (!hasData) {
          const noDataCol = '#8b97b3';
          const sk1 = L.polyline(ed.shape, {color:noDataCol, weight:8,  opacity:0.08, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
          const sk2 = L.polyline(ed.shape, {color:noDataCol, weight:4,  opacity:0.18, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
          const sk3 = L.polyline(ed.shape, {color:noDataCol, weight:2,  opacity:0.85, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
          layersRef.current.push(sk1, sk2, sk3);
          return;
        }

        /* ── 速度著色（真實速度，不做假轉換）── */
        let dispSpd, col;
        if (spdKmh > 0) {
          dispSpd = spdKmh;
          col = speedColor(dispSpd);   // 速度著色（綠→紅）
        } else {
          /* 無速度資料 → 用車次密度著色 */
          dispSpd = null;
          col = countColorMode(vol, maxVol, viewMode);
        }

        /* ── 線寬依車流量 ── */
        const w = Math.max(1.5, Math.min(8, (vol / maxVol) * 8));

        /* ── 3 層暈光效果 ── */
        const g1=L.polyline(ed.shape,{color:col,weight:w+12,opacity:0.06,lineCap:'round',lineJoin:'round'}).addTo(map);
        const g2=L.polyline(ed.shape,{color:col,weight:w+5, opacity:0.18,lineCap:'round',lineJoin:'round'}).addTo(map);
        const line=L.polyline(ed.shape,{color:col,weight:w,  opacity:0.90,lineCap:'round',lineJoin:'round'}).addTo(map);
        layersRef.current.push(g1,g2,line);

        /* ── 彈窗（含真實速度/佔有率/車流量） ── */
        const spdLine = dispSpd !== null
          ? `<div style="display:flex;align-items:baseline;gap:5px;background:${col}18;border:1px solid ${col}44;border-radius:6px;padding:6px 10px;margin-bottom:8px">
               <span style="font-family:'Inter',system-ui,sans-serif;font-size:28px;font-weight:700;color:${col};line-height:1;font-variant-numeric:tabular-nums">${dispSpd}</span>
               <span style="font-family:'Noto Sans TC',sans-serif;font-size:11px;color:#94a3b8">km/h</span>
               <span style="margin-left:auto;font-family:'Noto Sans TC',sans-serif;font-size:11px;font-weight:600;color:${col};background:${col}22;border-radius:4px;padding:2px 7px">${dispSpd<10?'壅塞':dispSpd<20?'緩慢':dispSpd<35?'普通':'暢通'}</span>
             </div>`
          : '';
        const popup = `<div style="padding:10px 14px;min-width:190px">
          <div style="font-family:'Noto Sans TC',sans-serif;font-size:10px;color:#4e6080;margin-bottom:3px">${modeLabel} · ${isCur ? 'VD 車速 · 路網車流' : 'SUMO 模擬'}</div>
          <div style="font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:600;color:#f1f5f9;margin-bottom:8px">${ed.name||'未命名路段'}</div>
          ${spdLine}
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#4e6080">${eid}</div>
        </div>`;
        line.bindPopup(popup,{maxWidth:220,minWidth:190});
        g2.bindPopup(popup,{maxWidth:220,minWidth:190});
      });
      labelHandlerRef.current=applyLabelCollision;
      requestAnimationFrame(()=>{ if(labelHandlerRef.current) labelHandlerRef.current(); });
      return;
    }

    /* ── Speed polyline modes (cur/pred/opt) ── */
    const dataKey = viewMode==='pred'?'pred':viewMode==='opt'?'opt':'cur';
    roads.forEach(road => {
      const d = road[dataKey] || road.cur;
      if (d.spd === null) return;  // no real data yet — don't render fake polyline
      const col = speedColor(d.spd);
      const baseW = Math.max(3, Math.min(8, d.vol/20));
      const glow1=L.polyline(road.coords,{color:col,weight:baseW+14,opacity:0.07,lineCap:'round',lineJoin:'round'}).addTo(map);
      const glow2=L.polyline(road.coords,{color:col,weight:baseW+6, opacity:0.22,lineCap:'round',lineJoin:'round'}).addTo(map);
      const mainLine=L.polyline(road.coords,{color:col,weight:baseW,opacity:0.93,lineCap:'round',lineJoin:'round'}).addTo(map);
      const mid=polylineMidpoint(road.coords);
      const labelTextCol=d.spd<20?'#fca5a5':d.spd<35?'#fcd34d':'#86efac';
      const labelHtml=`<div style="background:rgba(2,6,23,0.85);border:1px solid ${col}55;border-radius:5px;padding:2px 7px;font-family:'Inter',system-ui,sans-serif;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:${labelTextCol};white-space:nowrap;box-shadow:0 0 8px ${col}33,0 1px 4px rgba(0,0,0,0.6);line-height:1.4;pointer-events:none;backdrop-filter:blur(4px)">${d.spd}<span style="font-size:8px;font-weight:400;opacity:0.72;margin-left:1px">km/h</span></div>`;
      const labelMarker=L.marker(mid,{icon:L.divIcon({html:labelHtml,className:'',iconAnchor:[26,11]}),interactive:false,zIndexOffset:50}).addTo(map);
      const statusText=d.spd<10?'壅塞':d.spd<20?'緩慢':d.spd<35?'普通':'暢通';
      const modeLabel={cur:'當前車流',pred:'5分鐘預測',opt:'優化後預測'}[viewMode]||'當前車流';
      const popupHtml=`<div style="padding:12px 14px;min-width:190px"><div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:4px">${modeLabel}</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:10px;line-height:1.3">${road.name}</div><div style="display:flex;align-items:center;gap:8px;background:${col}18;border:1px solid ${col}44;border-radius:7px;padding:8px 10px;margin-bottom:10px"><div style="font-family:'Inter',system-ui,sans-serif;font-size:28px;font-weight:700;color:${col};line-height:1;font-variant-numeric:tabular-nums">${d.spd}</div><div><div style="font-family:'Noto Sans TC',sans-serif;font-size:11px;color:#94a3b8">平均車速</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:12px;color:${col};font-weight:600">km/h</div></div><div style="margin-left:auto;font-family:'Noto Sans TC',sans-serif;font-size:11px;background:${col}22;color:${col};border-radius:4px;padding:2px 7px;font-weight:600">${statusText}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div style="background:#0a0f1e;border-radius:6px;padding:7px 9px"><div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:2px">車流量</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:16px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">${d.vol} <span style="font-size:10px;color:#94a3b8;font-weight:400">輛</span></div></div><div style="background:#0a0f1e;border-radius:6px;padding:7px 9px"><div style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080;margin-bottom:2px">路段佔有率</div><div style="font-family:'Inter',system-ui,sans-serif;font-size:16px;font-weight:700;color:#f1f5f9;font-variant-numeric:tabular-nums">${d.occ} <span style="font-size:10px;color:#94a3b8;font-weight:400">%</span></div></div></div><div style="margin-top:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-family:'Noto Sans TC',sans-serif;font-size:9px;color:#4e6080">壅塞程度</span><span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#4e6080">${road.id}</span></div><div style="height:5px;background:#162036;border-radius:3px;overflow:hidden"><div style="width:${Math.min(100,d.occ*2)}%;height:100%;background:${col};border-radius:3px"></div></div></div></div>`;
      mainLine.bindPopup(popupHtml,{maxWidth:220,minWidth:200});
      glow2.bindPopup(popupHtml,{maxWidth:220,minWidth:200});
      layersRef.current.push(glow1,glow2,mainLine,labelMarker);
      labelLayersRef.current.push({marker:labelMarker,latlng:L.latLng(mid)});
    });
    labelHandlerRef.current=applyLabelCollision;
    requestAnimationFrame(()=>{ if(labelHandlerRef.current) labelHandlerRef.current(); });
  }, [viewMode, roads, heatmapData, baselineHeatmapData, currentHeatmapData]);

  return <div ref={containerRef} style={{ position:'absolute',top:0,left:0,right:0,bottom:0 }}/>;
}

/* ══════════════════════════════════════════════════
   ROAD TABLE (driven by live roads data)
══════════════════════════════════════════════════ */
function RoadTable({ roads, dataKey, selectedId, onSelectRoad, collapsed, onToggleCollapse }) {
  const ff="'Inter',system-ui,sans-serif", body="'Noto Sans TC','PingFang TC',sans-serif", mono="'JetBrains Mono',monospace";
  const bgCard='#0f1629', bgSurf='#0a0f1e', borderMed='rgba(99,130,200,0.25)', divider='rgba(99,130,200,0.08)', shadow='0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)', blueSubtle='rgba(59,130,246,0.08)';
  const [hovered, setHovered] = useState(null);
  const [search, setSearch] = useState('');
  const filtered = search ? roads.filter(r => r.name.includes(search) || r.id.toUpperCase().includes(search.toUpperCase())) : roads;
  const moeCfg = {
    0:{ label:'暢通', tc:'#4ade80', bg:'rgba(34,197,94,0.10)',  bd:'rgba(34,197,94,0.25)',  dot:'#22c55e', sc:'#4ade80' },
    1:{ label:'普通', tc:'#fbbf24', bg:'rgba(245,158,11,0.10)', bd:'rgba(245,158,11,0.25)', dot:'#f59e0b', sc:'#f1f5f9' },
    2:{ label:'壅塞', tc:'#f87171', bg:'rgba(239,68,68,0.10)',  bd:'rgba(239,68,68,0.25)',  dot:'#ef4444', sc:'#f87171' },
  };
  return (
    <div style={{ background:bgCard,border:`1px solid ${borderMed}`,borderRadius:12,boxShadow:shadow,overflow:'hidden',flex:1,display:'flex',flexDirection:'column' }}>
      <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 16px',borderBottom: collapsed?'none':`1px solid ${borderMed}` }}>

function SignalControl({ apiRecords = [], liveSignals = null }){
  /* 合併：號誌計畫(apiRecords) 決定相位/狀態；即時串流(liveSignals) 提供當前燈號 */
  const mergedSignals = useMemo(() => {
    const liveKeys = liveSignals ? Object.keys(liveSignals) : [];
    const matchToken = (id, sid) => id === sid || id.split(/[^A-Za-z0-9]+/).includes(sid);
    const findLive = (sid) => {
      const k = liveKeys.find(k => matchToken(k, sid));
      return k ? liveSignals[k] : null;
    };
    return signalData.map(s => {
      const live = findLive(s.id);
      const rec = apiRecords.find(r => {
        const id = String(r.tl_id || r.tls_id || r.junction_id || r.id || '');
        return id ? matchToken(id, s.id) : false;
      });
      let out = s;
      if (rec) {
        const keys = Object.keys(rec);
        const phases = s.phases.map((p, i) => {
          const durKey = keys.find(k => new RegExp(`phase[_\\s]?${i}[_\\s]?dur`, 'i').test(k)) ||
                         keys.find(k => new RegExp(`phase${i}`, 'i').test(k));
          const dur = durKey ? Math.max(5, parseInt(rec[durKey]) || p.dur) : p.dur;
          return { ...p, dur };
        });
        const cycle = phases.reduce((acc, p) => acc + p.dur, 0);
        // 號誌計畫的 score 是壅塞優先度分數：高分代表該路口較壅塞
        const score = parseFloat(rec.score);
        const status = (!isNaN(score) && score >= 1.3) ? 'congested' : 'optimized';
        out = { ...s, phases, cycle, status };
      }
      if (live) out = { ...out, live };
      return out;
    });
  }, [apiRecords, liveSignals]);

  const [selected,setSelected]=useState('655375241');
  const [,setClock]=useState(0);   // 僅用來每秒觸發重繪；相位以 Date.now() 計算
  const S=_SC;
  useEffect(()=>{ const id=setInterval(()=>setClock(c=>c+1),1000); return()=>clearInterval(id); },[]);

  function getPhase(sig){
    // 以牆上時鐘（秒）計算相位，背景頁籤被 throttle 也不會漂移
    const nowSec=Math.floor(Date.now()/1000);
    const elapsed=(nowSec+(sig.offset||0))%sig.cycle;
    let acc=0;
    for(let i=0;i<sig.phases.length;i++){
      if(elapsed<acc+sig.phases[i].dur) return{idx:i,phase:sig.phases[i],remaining:sig.phases[i].dur-(elapsed-acc)};
      acc+=sig.phases[i].dur;
    }
    return{idx:0,phase:sig.phases[0],remaining:sig.phases[0].dur};
  }

  function lightState(state){
    if(!state) return 'red';
    if((state.match(/y/g)||[]).length>0) return 'amber';
    if((state.match(/[Gg]/g)||[]).length>0) return 'green';
    return 'red';
  }

  const sel=mergedSignals.find(s=>s.id===selected);
  const selInfo=sel?getPhase(sel):null;

  return(
    <div style={{background:S.bgCard,border:`1px solid ${S.borderMed}`,borderRadius:12,boxShadow:S.shadow,overflow:'hidden',display:'flex',flexDirection:'column',flex:1,minHeight:0}}>

      {/* ── Header ── */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 14px',borderBottom:`1px solid ${S.borderMed}`,flexShrink:0}}>
        <span style={{fontFamily:S.ff,fontSize:13,fontWeight:600,color:S.fg,letterSpacing:'-0.01em'}}>號誌控制</span>
        <span style={{fontFamily:S.body,fontSize:11,fontWeight:500,color:S.green400,background:S.greenBg,border:`1px solid ${S.greenBd}`,borderRadius:4,padding:'2px 8px'}}>{signalData.length} 個路口</span>
      </div>

      {/* ── Signal list ── */}
      <div style={{padding:'6px 8px',overflowY:'auto',flex:1}}>
        {mergedSignals.map(s=>{

const _LC={

  bgCard:'#0f1629', bgSurf:'#0a0f1e', bgElev:'#162036',

};
const SAMPLE_MSGS=[
  {role:'assistant',text:'您好！我是 TrafficVision AI 助理。請問有什麼關於目前交通數據或號誌控制的問題？',time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})},
];
function parseMarkdown(text){
  return text.split(/\*\*(.*?)\*\*/g).map((part,i)=>i%2===1?<strong key={i} style={{color:_LC.fg,fontWeight:600}}>{part}</strong>:part);
}
function LLMChat({ msgs, setMsgs }){
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  const abortRef=useRef(null);
  const L=_LC;
  const now=()=>new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const send=()=>{
    if(!input.trim()||loading) return;
    const t=input;
    setMsgs(m=>[...m,{role:'user',text:t,time:now()}]);
    setInput(''); setLoading(true);
    const history = msgs
      .filter(m => m.role==='user' || m.role==='assistant')
      .map(m => ({role: m.role, content: m.text}));
    // 中斷前一個未完成的請求，避免先發後到覆蓋；並設 125s 逾時
    if(abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const timer = setTimeout(()=>ctrl.abort(), 125000);
    fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:t, history}),
      signal: ctrl.signal
    })
    .then(r=>r.json())
    .then(data=>{
      clearTimeout(timer);
      setMsgs(m=>[...m,{role:'assistant',text:data.reply||'無法取得回應',time:now()}]);
      setLoading(false);
    })
    .catch(err=>{
      clearTimeout(timer);
      if(err && err.name==='AbortError') { setLoading(false); return; }
      setMsgs(m=>[...m,{role:'assistant',text:'連線失敗，請確認 API 伺服器已啟動。',time:now()}]);
      setLoading(false);
    });
  };
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading]);
  return (
    <div style={{display:'flex',flexDirection:'column',background:L.bgCard,border:`1px solid ${L.borderMed}`,borderRadius:12,boxShadow:L.shadow,overflow:'hidden',flex:1,minHeight:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 14px',borderBottom:`1px solid ${L.borderMed}`,flexShrink:0}}>

          <div style={{width:26,height:26,borderRadius:7,background:L.blueSubtle,border:`1px solid ${L.blueBd}`,display:'flex',alignItems:'center',justifyContent:'center'}}>

          </div>
          <span style={{fontFamily:L.ff,fontSize:13,fontWeight:600,color:L.fg,letterSpacing:'-0.01em'}}>AI 數據助理</span>
        </div>
        <span style={{fontFamily:L.mono,fontSize:10,color:L.fg3,background:L.bgSurf,border:`1px solid ${L.borderMed}`,borderRadius:4,padding:'2px 7px'}}>gemma-4</span>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'14px',display:'flex',flexDirection:'column'}}>
        {msgs.map((m,i)=>{
          const isUser=m.role==='user';
          return (
            <div key={i} style={{display:'flex',justifyContent:isUser?'flex-end':'flex-start',marginBottom:12,gap:8}}>
              {!isUser&&<div style={{width:26,height:26,borderRadius:7,background:L.blueSubtle,border:`1px solid ${L.blueBd}`,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:L.ff,fontSize:10,fontWeight:700,color:L.blue400,flexShrink:0,marginTop:2}}>AI</div>}
              <div style={{maxWidth:'80%',display:'flex',flexDirection:'column',gap:3,alignItems:isUser?'flex-end':'flex-start'}}>
                <div style={{borderRadius:isUser?'10px 10px 3px 10px':'3px 10px 10px 10px',padding:'9px 13px',background:isUser?L.blue500:L.bgElev,border:isUser?'none':`1px solid ${L.borderMed}`,fontFamily:L.body,fontSize:12,lineHeight:1.65,color:isUser?'#fff':L.fg2}}>
                  {m.text.split('\n').filter(Boolean).map((ln,j)=><p key={j} style={{margin:j>0?'6px 0 0':0}}>{parseMarkdown(ln)}</p>)}
                </div>
                <div style={{fontFamily:L.mono,fontSize:10,color:L.fgD}}>{m.time}</div>
              </div>
            </div>
          );
        })}
        {loading&&(
          <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:12}}>
            <div style={{width:26,height:26,borderRadius:7,background:L.blueSubtle,border:`1px solid ${L.blueBd}`,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:L.ff,fontSize:10,fontWeight:700,color:L.blue400,flexShrink:0}}>AI</div>
            <div style={{background:L.bgElev,border:`1px solid ${L.borderMed}`,borderRadius:'3px 10px 10px 10px',padding:'10px 14px',display:'flex',gap:5,alignItems:'center'}}>
              {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:'50%',background:L.fg3,animation:`bounce 1.2s ${i*0.2}s ease-in-out infinite`}}/>)}

        <div ref={bottomRef}/>

      <div style={{padding:'10px 12px',borderTop:`1px solid ${L.borderMed}`,flexShrink:0}}>
        <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
          {['壅塞原因分析','號誌優化建議','預測未來1小時'].map(s=>(

              onMouseLeave={e=>{e.currentTarget.style.borderColor=L.borderMed;e.currentTarget.style.color=L.fg2;}}

          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} placeholder="詢問交通狀況、號誌建議..."
            style={{flex:1,height:36,background:L.bgSurf,border:`1px solid ${L.borderMed}`,borderRadius:8,padding:'0 12px',color:L.fg,fontFamily:L.body,fontSize:12,outline:'none',transition:'border-color 150ms'}}
            onFocus={e=>e.target.style.borderColor=L.blue500} onBlur={e=>e.target.style.borderColor=L.borderMed}/>
          <button onClick={send} disabled={loading||!input.trim()} style={{width:36,height:36,borderRadius:8,border:'none',background:(loading||!input.trim())?'rgba(59,130,246,0.3)':L.blue500,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'background 150ms'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

   APP SHELL

const MODES = {
  cur:  { label:'原始車流', accent:'#3b82f6' },
  pred: { label:'預測車流', accent:'#f59e0b' },
  opt:  { label:'優化車流', accent:'#22c55e' },
};


const _moeFromSpd = spd => spd === null ? null : spd < 10 ? 2 : spd < 30 ? 1 : 0;

/* ── Predicted roads ← SUMO baseline forecast ({road:{spd,vol,occ}}), heuristic fallback ── */
function computePredRoads(liveRoads, predForecast) {
  return liveRoads.map(r => {
    const f = predForecast && predForecast[r.name.trim().split(/\s+/)[0]];
    const spd = (f && f.spd > 0) ? +Number(f.spd).toFixed(1)
      : r.cur.spd !== null ? +(r.cur.spd * 0.87).toFixed(1) : null;
    const vol = (f && f.vol > 0) ? Math.round(f.vol)
      : r.cur.vol !== null ? Math.round(r.cur.vol * 1.08) : null;
    const occ = (f && f.occ > 0) ? +Number(f.occ).toFixed(1)
      : r.cur.occ !== null ? +(r.cur.occ * 1.12).toFixed(1) : null;
    const estimated = !(f && f.spd > 0);   // 無模擬資料時為推估值（非真實預測）
    return { ...r, pred: { spd, vol, occ, moe: _moeFromSpd(spd), estimated } };
  });
}

/* ── Optimised roads ← SUMO best-strategy forecast ({road:{spd,vol,occ}}), heuristic fallback ── */
function computeOptRoads(liveRoads, optForecast) {
  return liveRoads.map(r => {
    const f = optForecast && optForecast[r.name.trim().split(/\s+/)[0]];
    const spd = (f && f.spd > 0) ? +Number(f.spd).toFixed(1)
      : r.cur.spd !== null ? +Math.min(r.cur.spd * 1.20, 60).toFixed(1) : null;
    const vol = (f && f.vol > 0) ? Math.round(f.vol) : r.cur.vol;
    const occ = (f && f.occ > 0) ? +Number(f.occ).toFixed(1)
      : r.cur.occ !== null ? +Math.max(r.cur.occ * 0.80, 0).toFixed(1) : null;
    const estimated = !(f && f.spd > 0);   // 無模擬資料時為推估值（非真實優化結果）
    return { ...r, opt: { spd, vol, occ, moe: _moeFromSpd(spd), estimated } };
  });
}

          <div style={{ fontFamily:body, fontSize:12, color:'#94a3b8', marginBottom:12 }}>執行時間：<span style={{ color:'#60a5fa' }}>{handoff.run_time || '—'}</span></div>
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {fileEntries.map(([key]) => (
              <div key={key} style={{ background:'#162036', borderRadius:8, padding:'10px 14px', display:'flex', alignItems:'center', gap:10 }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" strokeWidth="1.5" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span style={{ fontFamily:mono, fontSize:11, color:'#94a3b8', flex:1 }}>{key}.csv</span>
                <a href={`/api/handoff/download?name=${encodeURIComponent(key + '.csv')}`} download aria-label={`下載 ${key}.csv`} style={{ fontFamily:body, fontSize:11, fontWeight:500, color:'#60a5fa', background:'rgba(59,130,246,0.12)', border:'1px solid rgba(59,130,246,0.3)', borderRadius:5, padding:'3px 10px', textDecoration:'none', flexShrink:0 }}>下載</a>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const [activeNav, setActiveNav] = useState('dashboard');
  const [mapMode, setMapMode] = useState('cur');
  const [liveRoads, setLiveRoads] = useState(ROADS_BASE);
  const [vdRoads, setVdRoads] = useState([]);   // 全 VD 路段（逐段，未聚合）：供監控列表/指標的細分顯示
  const [heatmapData, setHeatmapData] = useState(null);
  const [baselineHeatmapData, setBaselineHeatmapData] = useState(null);
  const [currentHeatmapData, setCurrentHeatmapData] = useState(null);
  const [time, setTime] = useState('');
  const [lastFetch, setLastFetch] = useState('');
  const [refreshing, setRefreshing] = useState(false);
  const [countdown, setCountdown] = useState(300);
  const [selectedRoadId, setSelectedRoadId] = useState(null);
  const [roadListCollapsed, setRoadListCollapsed] = useState(false);  // 路段監控列表收合，讓路網車流地圖佔滿可視範圍
  const [simStatus, setSimStatus] = useState('idle');
  const [simTime, setSimTime] = useState(null);
  const [liveSignals, setLiveSignals] = useState(null);   // {tl_id:{state,phase,next_switch}} 來自 WS
  const [predRecords, setPredRecords] = useState([]);
  const [compMetrics, setCompMetrics] = useState({});
  const [signalApiRecords, setSignalApiRecords] = useState([]);
  const [chatMsgs, setChatMsgs] = useState(SAMPLE_MSGS);   // 提升到 App，避免切頁丟失對話
  const [apiError, setApiError] = useState(false);          // /api/traffic 連線失敗提示
  const [forecastError, setForecastError] = useState(false); // /api/{roads,edges}/forecast 失敗提示
  const [healthData, setHealthData] = useState(null);        // /api/health：predict freshness + last strategy
  const [forecastData, setForecastData] = useState({ pred:{}, opt:{} });
  /* Edge 級預測 / 優化（132 條 named edges）— 取代舊版 pred/opt 模式下監控列表
     只能看到 7 條主幹道聚合的問題；資料來自 /api/edges/forecast */
  const [edgeForecast, setEdgeForecast] = useState({ pred:[], opt:[] });

  /* Load heatmap + road forecast from API, refresh every 5 minutes to match pipeline cycle */
  useEffect(() => {
    const load = () => {
      fetch('/api/edge-heatmap')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setHeatmapData(d); })
        .catch(() => {});
      fetch('/api/edge-heatmap/baseline')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setBaselineHeatmapData(d); })
        .catch(() => {});
      fetch('/api/edge-heatmap/current')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setCurrentHeatmapData(d); })
        .catch(() => {});
      /* D3: forecast endpoints 也要 no-store，避免 dashboard 顯示
             /api/traffic 新值（已 no-store）+ forecast 舊值 的混合狀態。
         D4: 任一 forecast 失敗都要讓使用者知道；之前 .catch(()=>{}) 把
             timeout / 500 全吞掉，table 退回 7 行聚合資料卻無視覺提示。
         allSettled 確保兩個 fetch 都跑完才一次 setForecastError，避免兩條
         fetch 平行 + 各自掛 .finally 造成的 race。 */
      Promise.allSettled([
        fetch('/api/roads/forecast', { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => { if (d && (d.pred || d.opt)) setForecastData({ pred: d.pred || {}, opt: d.opt || {} }); }),
        fetch('/api/edges/forecast', { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => { if (d && (Array.isArray(d.pred) || Array.isArray(d.opt))) setEdgeForecast({ pred: d.pred || [], opt: d.opt || [] }); }),
      ]).then(results => {
        const failed = results.filter(r => r.status === 'rejected');
        failed.forEach(r => console.warn('[dashboard] forecast fetch 失敗:', r.reason && r.reason.message));
        setForecastError(failed.length > 0);
      });
    };
    load();
    const tid = setInterval(load, 300000);
    return () => clearInterval(tid);
  }, []);

  /* Fetch prediction / comparison / signal plan data from API */
  useEffect(() => {
    Promise.allSettled([
      fetch('/api/prediction').then(r => r.json()).catch(() => ({})),
      fetch('/api/comparison').then(r => r.json()).catch(() => ({})),
      fetch('/api/signals').then(r => r.json()).catch(() => ({})),
    ]).then(([pred, comp, sig]) => {
      if (pred.status === 'fulfilled' && Array.isArray(pred.value?.records)) setPredRecords(pred.value.records);
      if (comp.status === 'fulfilled' && comp.value?.metrics)               setCompMetrics(comp.value.metrics);
      if (sig.status  === 'fulfilled' && Array.isArray(sig.value?.records))  setSignalApiRecords(sig.value.records);
    });
  }, [lastFetch]);

  /* /api/health — 拉 pipeline freshness 給 banner 顯示 (T1+T2)
     每 30 秒輪詢一次, 比 forecast 的 5 分鐘頻繁, 這樣 scheduler 跑完新一輪
     使用者能比較快看到「上次預測 X 分前」往下倒數。 */
  useEffect(() => {
    const loadHealth = () => {
      fetch('/api/health', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d) setHealthData(d); })
        .catch(() => {});
    };
    loadHealth();
    const tid = setInterval(loadHealth, 30000);
    return () => clearInterval(tid);
  }, []);

  /* Clock */
  useEffect(() => {
    const tick=()=>setTime(new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}));
    tick(); const id=setInterval(tick,1000); return()=>clearInterval(id);
  }, []);

  /* Refresh logic */
  const doRefresh = useCallback(async () => {
    setRefreshing(true);
    try {
      /* Try real API first */
      const res = await fetch('/api/traffic', { cache: 'no-store', signal: AbortSignal.timeout(3000) });
      if (res.ok) {
        const json = await res.json();
        if (json.data) {
          const entries = Object.entries(json.data);
          setLiveRoads(prev => prev.map(road => {
            const prefix = road.name.trim().split(/\s+/)[0];
            const matches = entries.filter(([name]) => name.startsWith(prefix));
            if (!matches.length) return road;
            const totalVol = matches.reduce((s,[,d])=>s+(d.TotalVol||0),0);
            const avgSpd   = totalVol>0 ? matches.reduce((s,[,d])=>s+(d.AvgSpd||0)*(d.TotalVol||0),0)/totalVol : matches.reduce((s,[,d])=>s+(d.AvgSpd||0),0)/matches.length;
            const avgOcc   = matches.reduce((s,[,d])=>s+(d.AvgOcc||0),0)/matches.length;
            const worstMoe = Math.max(...matches.map(([,d])=>d.MOELevel||0));
            return {...road, cur:{spd:+avgSpd.toFixed(1),vol:Math.round(totalVol/3),occ:+avgOcc.toFixed(1),moe:worstMoe}};
          }));
          /* 逐段 VD 資料（不聚合）：監控列表用，顯示每一條偵測路段。 */
          setVdRoads(entries.map(([name,d]) => ({
            name,
            id: d.SectionId || name,
            cur: {
              spd: d.AvgSpd   != null ? +(+d.AvgSpd).toFixed(1)  : null,
              vol: d.TotalVol != null ? Math.round(+d.TotalVol / 3) : null,
              occ: d.AvgOcc   != null ? +(+d.AvgOcc).toFixed(1)  : null,
              moe: d.MOELevel != null ? +d.MOELevel              : null,
            },
          })));
        }
        setApiError(false);
      } else { throw new Error('no api'); }
    } catch {
      /* API 未啟動：保持 null 數據，不顯示假數值，並顯示連線失敗提示 */
      setApiError(true);
      setLiveRoads(ROADS_BASE.map(r => ({ ...r, cur: { ..._NULL_ROAD_DATA }, pred: { ..._NULL_ROAD_DATA }, opt: { ..._NULL_ROAD_DATA } })));
      setVdRoads([]);
    }
    const ts = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setLastFetch(ts);
    setRefreshing(false);
    setCountdown(300);
  }, []);

  /* Start SUMO optimisation simulation */
  const startOptimize = useCallback(async () => {
    if (simStatus === 'running') {
      await fetch('/api/simulation/stop', { method: 'POST' });
      setSimStatus('idle');
      return;
    }
    setSimStatus('running');
    try {
      const r = await fetch('/api/simulation/start', { method: 'POST' });
      const d = await r.json();
      if (d.status === 'error') setSimStatus('idle');
    } catch { setSimStatus('idle'); }
  }, [simStatus]);

  /* Initial fetch */
  useEffect(() => { doRefresh(); }, []);

  /* 倒數：只做遞減，不在 state updater 內呼 side effect */
  useEffect(() => {
    const tick = setInterval(() => setCountdown(c => c > 0 ? c - 1 : 0), 1000);
    return () => clearInterval(tick);
  }, []);

  /* 倒數歸零 → 觸發刷新（doRefresh 結束會 setCountdown(300) 重啟） */
  useEffect(() => {
    if (countdown === 0) doRefresh();
  }, [countdown, doRefresh]);

  /* WebSocket：訂閱 SUMO 即時模擬串流，驅動「啟動優化」狀態並提供即時號誌相位 */
  useEffect(() => {
    let ws, retry, alive = true;
    const connect = () => {
      if (!alive) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      try { ws = new WebSocket(`${proto}://${location.host}/ws/simulation`); }
      catch { return; }
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'step') {
          setSimStatus('running');
          if (msg.sim_time != null) setSimTime(msg.sim_time);
          if (msg.signals) setLiveSignals(msg.signals);
        } else if (msg.type === 'end') {
          setSimStatus('idle');
          setLiveSignals(null);
        }
      };
      ws.onclose = () => { if (alive) retry = setTimeout(connect, 4000); };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
    };
    connect();
    return () => { alive = false; clearTimeout(retry); try { ws && ws.close(); } catch (e) {} };
  }, []);

  /* Derived pred/opt roads — recomputed only when live roads or API data change */
  const predRoads = useMemo(() => computePredRoads(liveRoads, forecastData.pred), [liveRoads, forecastData]);
  const optRoads  = useMemo(() => computeOptRoads(liveRoads, forecastData.opt),  [liveRoads, forecastData]);
  const displayRoads = mapMode === 'pred' ? predRoads : mapMode === 'opt' ? optRoads : liveRoads;
  const dataKey = mapMode==='pred'?'pred':mapMode==='opt'?'opt':'cur';
  /* Edge 級監控列表：把 /api/edges/forecast 的 132 條 named edges 攤平成
     RoadTable 需要的 {id, name, pred:{...}, opt:{...}} 形狀。
     同時保留每條 edge 的 cur 為 null（cur 模式下我們用 vdRoads，不會走這條） */
  const edgeMonitorRoads = useMemo(() => {
    const byId = new Map();
    (edgeForecast.pred || []).forEach(e => {
      byId.set(e.id, { id: e.id, name: e.name, cur: { spd:null, vol:null, occ:null, moe:null },
                       pred: { spd:e.spd, vol:e.vol, occ:e.occ, moe:e.moe }, opt: null });
    });
    (edgeForecast.opt || []).forEach(e => {
      const ent = byId.get(e.id) || { id: e.id, name: e.name, cur: { spd:null, vol:null, occ:null, moe:null }, pred: null };
      ent.opt = { spd:e.spd, vol:e.vol, occ:e.occ, moe:e.moe };
      byId.set(e.id, ent);
    });
    return Array.from(byId.values());
  }, [edgeForecast]);
  /* 監控列表來源：
       - cur 模式 → vdRoads（64 條逐段 VD，真實感測器）
       - pred / opt 模式 → edgeMonitorRoads（132 條 named SUMO edges，含 75 條全 0 骨架）
         若 /api/edges/forecast 未回應，回退到 displayRoads（7 條聚合）以避免空列表
     舊版兩個三元都鎖在 vdRoads/cur，導致 pred/opt 模式表格永遠顯示 VD 原始值。 */
  const rawMonitorRoads =
    (mapMode === 'cur' && vdRoads.length) ? vdRoads
    : ((mapMode === 'pred' || mapMode === 'opt') && edgeMonitorRoads.length) ? edgeMonitorRoads
    : displayRoads;
  const tableDataKey = dataKey;
  /* 過濾掉當前模式下「速度/車流/佔有率全為 0 或 null」的列。
     pair model 在深夜時段會讓 ~75 條 edge 全 0；表格列出來只會讓使用者看到一堆 0
     而失去意義。地圖上仍會用淡粉白骨架顯示這些 edge，所以路網覆蓋資訊不會遺失。 */
  const monitorRoads = useMemo(() => {
    return rawMonitorRoads.filter(r => {
      const d = r[tableDataKey];
      if (!d) return false;
      const v = (x) => x != null && x !== 0;
      return v(d.spd) || v(d.vol) || v(d.occ);
    });
  }, [rawMonitorRoads, tableDataKey]);
  const borderMed='rgba(99,130,200,0.25)';
  const mins=String(Math.floor(countdown/60)).padStart(2,'0');
  const secs=String(countdown%60).padStart(2,'0');

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#020617',overflow:'hidden'}}>

      {/* TopBar */}
      <TopBar time={time} lastFetch={lastFetch} refreshing={refreshing} onRefresh={doRefresh} simStatus={simStatus} onStartOptimize={startOptimize}/>

      {/* API 連線失敗提示 */}
      {apiError && (
        <div role="alert" style={{background:'rgba(239,68,68,0.12)',borderBottom:'1px solid rgba(239,68,68,0.35)',color:'#fca5a5',fontFamily:"'Noto Sans TC','PingFang TC',sans-serif",fontSize:12,padding:'6px 16px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span aria-hidden="true" style={{fontWeight:700}}>⚠</span> 無法連線到 API 伺服器，顯示的資料可能不是最新。請確認後端是否啟動。
        </div>
      )}
      {/* 預測資料失敗提示 — 區別於 /api/traffic 失敗，這個只影響 5 分鐘預測 / 優化視圖 */}
      {forecastError && !apiError && (
        <div role="alert" style={{background:'rgba(234,179,8,0.10)',borderBottom:'1px solid rgba(234,179,8,0.30)',color:'#fde68a',fontFamily:"'Noto Sans TC','PingFang TC',sans-serif",fontSize:12,padding:'6px 16px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <span aria-hidden="true" style={{fontWeight:700}}>⚠</span> 無法取得 5 分鐘預測 / 優化資料（pipeline 可能跳過或尚未產出）。當前車流仍會正常顯示。
        </div>
      )}
      {/* T1+T2: 預測資料新鮮度 + 本輪策略 (僅 pred/opt 模式顯示, 避免 cur 模式佔位)
              age < 360s: 綠色 (新鮮), 360-900: 黃色 (略舊), > 900: 紅色 (建議查 scheduler) */}
      {(mapMode === 'pred' || mapMode === 'opt') && healthData?.predict && (() => {
        const age = healthData.predict.age_sec ?? 999999;
        const ageMin = Math.floor(age / 60);
        const ageSec = age % 60;
        const ageLabel = age < 60 ? `${age} 秒前` : `${ageMin} 分 ${ageSec} 秒前`;
        const tone = age < 360 ? {bg:'rgba(34,197,94,0.08)',bd:'rgba(34,197,94,0.30)',fg:'#86efac'}
                   : age < 900 ? {bg:'rgba(234,179,8,0.10)',bd:'rgba(234,179,8,0.30)',fg:'#fde68a'}
                   :              {bg:'rgba(239,68,68,0.12)',bd:'rgba(239,68,68,0.35)',fg:'#fca5a5'};
        const strat = healthData.pipeline?.last_strategy;
        const score = healthData.pipeline?.last_composite_score;
        const stratLabel = !strat ? '本輪策略未知'
                         : strat === 'no_control'
                           ? '本輪維持現狀（優化器未找到優於基準的方案，score = 1.000）'
                           : `本輪採用 ${strat}（composite_score = ${typeof score === 'number' ? score.toFixed(4) : '?'}，< 1 即優於基準）`;
        return (
          <div style={{background:tone.bg,borderBottom:`1px solid ${tone.bd}`,color:tone.fg,fontFamily:"'Noto Sans TC','PingFang TC',sans-serif",fontSize:12,padding:'6px 16px',display:'flex',alignItems:'center',gap:12,flexShrink:0,flexWrap:'wrap'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:5}}>
              <span aria-hidden="true" style={{fontWeight:700}}>●</span>
              GRU 預測產出於 <strong style={{fontFamily:"'JetBrains Mono',monospace"}}>{ageLabel}</strong>
            </span>
            <span style={{opacity:0.55,fontSize:10}}>·</span>
            <span>{stratLabel}</span>
            {healthData.pipeline?.last_run_step3_skipped && (
              <><span style={{opacity:0.55,fontSize:10}}>·</span>
                <span style={{color:'#fca5a5'}}>Step 3 已跳過：{healthData.pipeline.last_run_step3_skipped}</span></>
            )}
          </div>
        );
      })()}

      {/* Metrics */}
      <MetricsPanel roads={monitorRoads} dataKey={tableDataKey}/>

      {/* Body */}
      <div style={{flex:1,display:'grid',gridTemplateColumns:activeNav==='dashboard'?'186px 1fr 290px 272px':'186px 1fr',gap:10,padding:'10px 14px 12px',overflow:'hidden',minHeight:0}}>

        {/* Sidebar */}
        <Sidebar active={activeNav} onNav={setActiveNav}/>

        {/* Center: content changes with activeNav */}
        <div style={{display:'flex',flexDirection:'column',gap:8,overflow:'hidden',minHeight:0}}>

          {/* Map card — keep mounted always to avoid Leaflet teardown; hide via display */}
          <div style={{display:(activeNav==='dashboard'||activeNav==='roads')?'flex':'none',flexDirection:'column',background:'#0f1629',border:`1px solid ${borderMed}`,borderRadius:12,boxShadow:'0 0 0 1px rgba(99,130,200,0.25),0 1px 3px rgba(0,0,0,0.40)',overflow:'hidden',flex:1,minHeight:200}}>
            {/* Map header */}
            <div style={{display:'flex',alignItems:'center',padding:'7px 12px',borderBottom:`1px solid ${borderMed}`,background:'#0a0f1e',gap:10,flexShrink:0,flexWrap:'wrap'}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" strokeWidth="2" style={{flexShrink:0}}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
              <span style={{fontFamily:"'Inter',system-ui,sans-serif",fontSize:13,fontWeight:600,color:'#f1f5f9',letterSpacing:'-0.01em'}}>路網車流地圖</span>
              {/* Mode tabs */}
              <div style={{display:'flex',gap:4}}>
                {Object.entries(MODES).map(([k,v])=>(
                  <button key={k} onClick={()=>setMapMode(k)} aria-pressed={mapMode===k} aria-label={`地圖模式：${v.label}`} style={{fontFamily:"'Noto Sans TC',sans-serif",fontSize:10,fontWeight:500,padding:'3px 9px',borderRadius:4,border:`1px solid ${mapMode===k?v.accent:borderMed}`,background:mapMode===k?`${v.accent}20`:'#162036',color:mapMode===k?v.accent:'#94a3b8',transition:'all 150ms'}}>{v.label}</button>
                ))}
              </div>
              {/* Auto-refresh countdown */}
              <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'#4e6080'}}>下次更新 {mins}:{secs}</span>
                <SpeedLegend/>
              </div>
            </div>
            {/* Map container */}
            <div style={{flex:1,position:'relative',minHeight:0,overflow:'hidden'}}>
              <TrafficMap viewMode={mapMode} roads={displayRoads} heatmapData={heatmapData} baselineHeatmapData={baselineHeatmapData} currentHeatmapData={currentHeatmapData}/>
            </div>
          </div>

          {/* Road table — dashboard & roads views */}
          {(activeNav==='dashboard'||activeNav==='roads') && (
            <div style={{flex:'0 0 auto',height:roadListCollapsed?'auto':280,minHeight:0,display:'flex'}}>
              <RoadTable roads={monitorRoads} dataKey={tableDataKey} selectedId={selectedRoadId} onSelectRoad={r=>setSelectedRoadId(r.id)} collapsed={roadListCollapsed} onToggleCollapse={()=>setRoadListCollapsed(c=>!c)}/>
            </div>
          )}

          {/* Prediction panel */}
          {activeNav==='predict' && (
            <div style={{flex:1,overflow:'hidden',display:'flex'}}>
              <PredictPanel predRoads={predRoads} predRecords={predRecords}/>
            </div>
          )}

          {/* Full-width signal control */}
          {activeNav==='signals' && (
            <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
              <SignalControl apiRecords={signalApiRecords} liveSignals={liveSignals}/>
            </div>
          )}

          {/* Full-width chat */}
          {activeNav==='chat' && (
            <div style={{flex:1,overflow:'hidden'}}><LLMChat msgs={chatMsgs} setMsgs={setChatMsgs}/></div>
          )}

          {/* Export panel */}
          {activeNav==='export' && (
            <div style={{flex:1,overflow:'hidden',display:'flex'}}>
              <ExportPanel/>
            </div>
          )}

        </div>

        {/* Signal Control — dashboard only */}
        {activeNav==='dashboard' && <SignalControl apiRecords={signalApiRecords} liveSignals={liveSignals}/>}

        {/* LLM Chat — dashboard only */}
        {activeNav==='dashboard' && <LLMChat msgs={chatMsgs} setMsgs={setChatMsgs}/>}

      </div>
    </div>
  );
}

/* ── Error Boundary：任一元件丟例外時顯示錯誤卡片，避免整頁白屏 ── */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error('Dashboard render error:', err, info); }
  render(){
    if(this.state.err){
      return (
        <div role="alert" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:12,background:'#020617',color:'#f1f5f9',fontFamily:"'Noto Sans TC','PingFang TC',sans-serif",padding:24,textAlign:'center'}}>
          <div style={{fontSize:18,fontWeight:700,color:'#f87171'}}>儀表板發生錯誤</div>
          <div style={{fontSize:13,color:'#94a3b8',maxWidth:520}}>{String(this.state.err && this.state.err.message || this.state.err)}</div>
          <button onClick={()=>location.reload()} style={{marginTop:8,fontFamily:"'Inter',system-ui,sans-serif",fontSize:13,padding:'8px 18px',borderRadius:6,border:'1px solid rgba(99,130,200,0.35)',background:'rgba(59,130,246,0.12)',color:'#60a5fa',cursor:'pointer'}}>重新載入</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
