/* ════════ RESTYLED MAP ════════ */
// ==== TrafficMap ====
/* ══════════════════════════════════════════════════
   LEAFLET TRAFFIC MAP — Variant D "Glass Stack Focus" restyle
   Logic (init, tile layer, layer drawing/sorting, _entryHasData/
   hasData, speedColor, polyline weights, glow layers, label
   collision, both render branches, all useEffect deps) is PRESERVED
   byte-for-byte. Only the popup HTML strings, the divIcon label
   HTML, the NTUT marker chrome and the container className have
   been restyled to the deep-navy glass + neon-accent theme. The
   global .leaflet-* / .pop-* / .marker-ntut CSS overrides do the
   rest of the chrome (container basemap, popup wrapper, zoom chips).
══════════════════════════════════════════════════ */
function TrafficMap({ viewMode, roads, heatmapData, baselineHeatmapData, currentHeatmapData }) {
  const containerRef   = useRef(null);
  const mapRef         = useRef(null);
  const layersRef      = useRef([]);
  const labelLayersRef = useRef([]);
  const labelHandlerRef = useRef(null);

  const applyLabelCollision = useCallback(() => {
    const map = mapRef.current;
    if (!map || !labelLayersRef.current.length) return;
    if (map.getZoom() >= 16) { labelLayersRef.current.forEach(({marker})=>{ const el=marker.getElement(); if(el) el.style.display=''; }); return; }
    const items = labelLayersRef.current.map(({marker,latlng}) => {
      const pt=map.latLngToContainerPoint(latlng);
      const el=marker.getElement();
      const w=(el&&el.offsetWidth>0?el.offsetWidth:52)+6;
      const h=(el&&el.offsetHeight>0?el.offsetHeight:22)+6;
      return {el,pt,w,h};
    });
    const shown=[];
    items.forEach(item=>{
      if(!item.el) return;
      const r={left:item.pt.x-item.w/2,right:item.pt.x+item.w/2,top:item.pt.y-item.h/2,bottom:item.pt.y+item.h/2};
      const blocked=shown.some(s=>!(r.right<s.left||s.right<r.left||r.bottom<s.top||s.bottom<r.top));
      item.el.style.display=blocked?'none':'';
      if(!blocked) shown.push(r);
    });
  }, []);

  /* Map init */
  useEffect(() => {
    if (mapRef.current) return;
    const map = L.map(containerRef.current, { center:[25.0448,121.532], zoom:15, zoomControl:true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'© <a href="https://www.openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
      subdomains:'abcd', maxZoom:19,
    }).addTo(map);
    L.marker([25.0422,121.5355], { icon: L.divIcon({
      html:`<div class="marker-ntut"><span class="pin"></span>北科大</div>`,
      className:'', iconAnchor:[34,13],
    })}).addTo(map);
    labelHandlerRef.current = applyLabelCollision;
    map.on('zoomend', () => { if (labelHandlerRef.current) labelHandlerRef.current(); });
    mapRef.current = map;
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(containerRef.current);
    return () => { ro.disconnect(); map.remove(); mapRef.current=null; };
  }, []);

  /* Redraw layers */
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    layersRef.current.forEach(l=>{ try{map.removeLayer(l);}catch(e){} });
    layersRef.current=[]; labelLayersRef.current=[];

    /* ── Edge heatmap — 全路網 edge 幾何 ──
       pred → 基準(no_control)模擬；opt/heatmap → 最佳策略模擬；
       cur → 用五分鐘車流(baseline)的全路網幾何，但顏色改用真實 VD 車速。 */
    const isCur = viewMode === 'cur';
    const activeHeatmap =
      (viewMode === 'opt' || viewMode === 'heatmap') ? heatmapData
      : isCur ? (baselineHeatmapData || currentHeatmapData || heatmapData)
      : (baselineHeatmapData || heatmapData);   // pred

    const vdByPrefix = {};
    if (isCur) {
      roads.forEach(r => {
        if (r.cur && r.cur.spd != null) vdByPrefix[r.name.trim().split(/\s+/)[0]] = r.cur.spd;
      });
    }
    if (activeHeatmap) {
      const maxVol  = activeHeatmap.meta.max_vol  || activeHeatmap.meta.max_count || 1;
      const modeLabel = {cur:'當前車流',pred:'5分鐘預測',opt:'優化後預測',heatmap:'車流密度'}[viewMode]||'車流密度';

      /* 兩階段渲染：先畫無資料骨架 → 再畫有資料彩色線，後者自然蓋在上面。
         避免單一 forEach 順序裡，後處理的灰骨架蓋掉前面的綠線。

         注意：_entryHasData 的判斷必須與下方主迴圈裡的 hasData 完全一致，
         否則一條 edge 可能被排序為「無資料」（排到前面 → 被後面蓋住）但
         主迴圈又判定為「有資料」並彩色繪製，視覺上就被覆蓋住消失。 */
      const _entryHasData = ([_eid, ed]) => {
        const vol = ed.vol || ed.count || 0;
        if (isCur) {
          const nm = ed.name || '';
          for (const p in vdByPrefix) {
            if (nm.startsWith(p)) {
              const vSpd = vdByPrefix[p];
              return vSpd != null && vSpd > 0;
            }
          }
          return false;
        }
        return vol > 0;
      };
      const sortedEntries = Object.entries(activeHeatmap.edges)
        .slice()
        .sort((a, b) => (_entryHasData(a) ? 1 : 0) - (_entryHasData(b) ? 1 : 0));

      sortedEntries.forEach(([eid,ed]) => {
        if (!ed.shape || ed.shape.length < 2) return;

        /* ── 資料欄位 ── */
        const vol    = ed.vol  || ed.count || 0;   // 車流量(線寬用，五分鐘車流)
        const occ    = ed.occ  || 0;
        let vdSpd = null;
        if (isCur) {
          const nm = ed.name || '';
          for (const p in vdByPrefix) { if (nm.startsWith(p)) { vdSpd = vdByPrefix[p]; break; } }
        }
        const spdKmh = isCur ? (vdSpd || 0) : (ed.spd || 0);
        /* hasData 條件：
             cur 模式 — 只要 VD 有速度就算有資料（跟下方監控列表一致；
                        SUMO 模擬 vol 可能為 0 不代表真的沒車經過）
             pred / opt — SUMO 必須有車流量才算 */
        const hasData = isCur
          ? (vdSpd != null && vdSpd > 0)
          : (vol > 0);

        /* ── 無車流資料路段：藍灰骨架（#8b97b3），不綁 popup —
           點擊不彈窗，避免顯示誤導性的「0 輛 / 0%」面板。 */
        if (!hasData) {
          const noDataCol = '#8b97b3';
          const sk1 = L.polyline(ed.shape, {color:noDataCol, weight:8,  opacity:0.08, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
          const sk2 = L.polyline(ed.shape, {color:noDataCol, weight:4,  opacity:0.18, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
          const sk3 = L.polyline(ed.shape, {color:noDataCol, weight:2,  opacity:0.85, lineCap:'round', lineJoin:'round', interactive:false}).addTo(map);
          layersRef.current.push(sk1, sk2, sk3);
          return;
        }

        /* ── 速度著色（真實速度，不做假轉換）── */
        let dispSpd, col;
        if (spdKmh > 0) {
          dispSpd = spdKmh;
          col = speedColor(dispSpd);   // 速度著色（綠→紅）
        } else {
          /* 無速度資料 → 用車次密度著色 */
          dispSpd = null;
          col = countColorMode(vol, maxVol, viewMode);
        }

        /* ── 線寬依車流量 ── */
        const w = Math.max(1.5, Math.min(8, (vol / maxVol) * 8));

        /* ── 3 層暈光效果 ── */
        const g1=L.polyline(ed.shape,{color:col,weight:w+12,opacity:0.06,lineCap:'round',lineJoin:'round'}).addTo(map);
        const g2=L.polyline(ed.shape,{color:col,weight:w+5, opacity:0.18,lineCap:'round',lineJoin:'round'}).addTo(map);
        const line=L.polyline(ed.shape,{color:col,weight:w,  opacity:0.90,lineCap:'round',lineJoin:'round'}).addTo(map);
        layersRef.current.push(g1,g2,line);

        /* ── 彈窗（含真實速度/佔有率/車流量）— glass + neon 重新樣式，
              色彩仍由資料計算的 col 決定（speedColor / countColorMode）。 */
        const status = dispSpd!==null ? (dispSpd<10?'壅塞':dispSpd<20?'緩慢':dispSpd<35?'普通':'暢通') : '';
        const spdLine = dispSpd !== null
          ? `<div style="display:flex;align-items:baseline;gap:6px;background:${col}1f;border:1px solid ${col}4d;border-radius:8px;padding:7px 11px;margin-bottom:9px">
               <span style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:${col};line-height:1;font-variant-numeric:tabular-nums">${dispSpd}</span>
               <span style="font-family:'Inter','Noto Sans TC',sans-serif;font-size:11px;color:#94a3b8">km/h</span>
               <span style="margin-left:auto;font-family:'Inter','Noto Sans TC',sans-serif;font-size:11px;font-weight:700;color:${col};background:${col}29;border:1px solid ${col}4d;border-radius:999px;padding:2px 9px">${status}</span>
             </div>`
          : '';
        const popup = `<div style="min-width:190px">
          <div class="pop-name">${ed.name||'未命名路段'}</div>
          <div style="font-family:'Inter','Noto Sans TC',sans-serif;font-size:10px;color:#8595b8;margin-bottom:8px">${modeLabel} · ${isCur ? 'VD 車速 · 路網車流' : 'SUMO 模擬'}</div>
          ${spdLine}
          <div class="pop-id">${eid}</div>
        </div>`;
        line.bindPopup(popup,{maxWidth:220,minWidth:190});
        g2.bindPopup(popup,{maxWidth:220,minWidth:190});
      });
      labelHandlerRef.current=applyLabelCollision;
      requestAnimationFrame(()=>{ if(labelHandlerRef.current) labelHandlerRef.current(); });
      return;
    }

    /* ── Speed polyline modes (cur/pred/opt) ── */
    const dataKey = viewMode==='pred'?'pred':viewMode==='opt'?'opt':'cur';
    roads.forEach(road => {
      const d = road[dataKey] || road.cur;
      if (d.spd === null) return;  // no real data yet — don't render fake polyline
      const col = speedColor(d.spd);
      const baseW = Math.max(3, Math.min(8, d.vol/20));
      const glow1=L.polyline(road.coords,{color:col,weight:baseW+14,opacity:0.07,lineCap:'round',lineJoin:'round'}).addTo(map);
      const glow2=L.polyline(road.coords,{color:col,weight:baseW+6, opacity:0.22,lineCap:'round',lineJoin:'round'}).addTo(map);
      const mainLine=L.polyline(road.coords,{color:col,weight:baseW,opacity:0.93,lineCap:'round',lineJoin:'round'}).addTo(map);
      const mid=polylineMidpoint(road.coords);
      const labelTextCol=d.spd<20?'#fca5a5':d.spd<35?'#fcd34d':'#86efac';
      const labelHtml=`<div style="background:rgba(8,13,28,0.85);border:1px solid ${col}55;border-radius:7px;padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:${labelTextCol};white-space:nowrap;box-shadow:0 0 10px ${col}33,0 1px 4px rgba(0,0,0,0.6);line-height:1.4;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)">${d.spd}<span style="font-size:8px;font-weight:400;opacity:0.72;margin-left:2px">km/h</span></div>`;
      const labelMarker=L.marker(mid,{icon:L.divIcon({html:labelHtml,className:'',iconAnchor:[26,11]}),interactive:false,zIndexOffset:50}).addTo(map);
      const statusText=d.spd<10?'壅塞':d.spd<20?'緩慢':d.spd<35?'普通':'暢通';
      const modeLabel={cur:'當前車流',pred:'5分鐘預測',opt:'優化後預測'}[viewMode]||'當前車流';
      const popupHtml=`<div style="min-width:190px"><div class="pop-name">${road.name}</div><div style="font-family:'Inter','Noto Sans TC',sans-serif;font-size:10px;color:#8595b8;margin-bottom:9px">${modeLabel}</div><div style="display:flex;align-items:center;gap:9px;background:${col}1f;border:1px solid ${col}4d;border-radius:8px;padding:8px 11px;margin-bottom:10px"><div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:${col};line-height:1;font-variant-numeric:tabular-nums">${d.spd}</div><div><div style="font-family:'Inter','Noto Sans TC',sans-serif;font-size:10px;color:#94a3b8">平均車速</div><div style="font-family:'Inter','Noto Sans TC',sans-serif;font-size:12px;color:${col};font-weight:600">km/h</div></div><div style="margin-left:auto;font-family:'Inter','Noto Sans TC',sans-serif;font-size:11px;background:${col}29;border:1px solid ${col}4d;color:${col};border-radius:999px;padding:2px 9px;font-weight:700">${statusText}</div></div><div class="pop-grid" style="margin-bottom:10px"><div style="background:rgba(8,13,28,0.55);border:1px solid rgba(120,160,240,0.12);border-radius:8px;padding:7px 10px"><div class="k" style="margin-bottom:3px">車流量</div><div class="v">${d.vol} <span style="font-size:10px;color:#94a3b8;font-weight:400">輛</span></div></div><div style="background:rgba(8,13,28,0.55);border:1px solid rgba(120,160,240,0.12);border-radius:8px;padding:7px 10px"><div class="k" style="margin-bottom:3px">路段佔有率</div><div class="v">${d.occ} <span style="font-size:10px;color:#94a3b8;font-weight:400">%</span></div></div></div><div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-family:'Inter','Noto Sans TC',sans-serif;font-size:9px;color:#8595b8">壅塞程度</span><span class="pop-id" style="margin-bottom:0">${road.id}</span></div><div style="height:5px;background:rgba(120,160,240,0.14);border-radius:3px;overflow:hidden"><div style="width:${Math.min(100,d.occ*2)}%;height:100%;background:${col};box-shadow:0 0 8px ${col}80;border-radius:3px"></div></div></div></div>`;
      mainLine.bindPopup(popupHtml,{maxWidth:220,minWidth:200});
      glow2.bindPopup(popupHtml,{maxWidth:220,minWidth:200});
      layersRef.current.push(glow1,glow2,mainLine,labelMarker);
      labelLayersRef.current.push({marker:labelMarker,latlng:L.latLng(mid)});
    });
    labelHandlerRef.current=applyLabelCollision;
    requestAnimationFrame(()=>{ if(labelHandlerRef.current) labelHandlerRef.current(); });
  }, [viewMode, roads, heatmapData, baselineHeatmapData, currentHeatmapData]);

  return <div ref={containerRef} className="map-canvas" />;
}

/* ════════ RESTYLED APP SHELL + DRAWER ════════ */
/* ============================================================
   TrafficVision — Variant D "Glass Stack Focus" — App shell fragment
   Restyled App shell + layout + NEW right detail drawer.
   Logic sections (MODES, _moeFromSpd, computePredRoads,
   computeOptRoads) are VERBATIM from the original dashboard.html;
   only className usage / presentational JSX wrappers changed in App.
   Pairs with _frag/style.css (Variant D class catalogue).
   ============================================================ */

// ==== MODES ====
/* VERBATIM — logic */
const MODES = {
  cur:  { label:'原始車流', accent:'#3b82f6' },
  pred: { label:'預測車流', accent:'#f59e0b' },
  opt:  { label:'優化車流', accent:'#22c55e' },
};


// ==== _moeFromSpd ====
/* VERBATIM — logic */
const _moeFromSpd = spd => spd === null ? null : spd < 10 ? 2 : spd < 30 ? 1 : 0;


// ==== computePredRoads ====
/* VERBATIM — logic */
/* ── Predicted roads ← SUMO baseline forecast ({road:{spd,vol,occ}}), heuristic fallback ── */
function computePredRoads(liveRoads, predForecast) {
  return liveRoads.map(r => {
    const f = predForecast && predForecast[r.name.trim().split(/\s+/)[0]];
    const spd = (f && f.spd > 0) ? +Number(f.spd).toFixed(1)
      : r.cur.spd !== null ? +(r.cur.spd * 0.87).toFixed(1) : null;
    const vol = (f && f.vol > 0) ? Math.round(f.vol)
      : r.cur.vol !== null ? Math.round(r.cur.vol * 1.08) : null;
    const occ = (f && f.occ > 0) ? +Number(f.occ).toFixed(1)
      : r.cur.occ !== null ? +(r.cur.occ * 1.12).toFixed(1) : null;
    const estimated = !(f && f.spd > 0);   // 無模擬資料時為推估值（非真實預測）
    return { ...r, pred: { spd, vol, occ, moe: _moeFromSpd(spd), estimated } };
  });
}


// ==== computeOptRoads ====
/* VERBATIM — logic */
/* ── Optimised roads ← SUMO best-strategy forecast ({road:{spd,vol,occ}}), heuristic fallback ── */
function computeOptRoads(liveRoads, optForecast) {
  return liveRoads.map(r => {
    const f = optForecast && optForecast[r.name.trim().split(/\s+/)[0]];
    const spd = (f && f.spd > 0) ? +Number(f.spd).toFixed(1)
      : r.cur.spd !== null ? +Math.min(r.cur.spd * 1.20, 60).toFixed(1) : null;
    const vol = (f && f.vol > 0) ? Math.round(f.vol) : r.cur.vol;
    const occ = (f && f.occ > 0) ? +Number(f.occ).toFixed(1)
      : r.cur.occ !== null ? +Math.max(r.cur.occ * 0.80, 0).toFixed(1) : null;
    const estimated = !(f && f.spd > 0);   // 無模擬資料時為推估值（非真實優化結果）
    return { ...r, opt: { spd, vol, occ, moe: _moeFromSpd(spd), estimated } };
  });
}


// ==== DetailDrawer ====
/* NEW — presentational only. Right slide-in glass panel driven by the
   EXISTING selectedRoadId / onClose state already in App. It reads the
   selected row out of `roads` (= App's monitorRoads) using the SAME
   dataKey selection (`road[dataKey] || road.cur`) and the SAME status
   derivation (_moeFromSpd / speedColor) as RoadTable — it does NOT
   compute or fetch anything new, so existing data flow is untouched.
   `open` is a boolean derived in App from selectedRoadId. */
function DetailDrawer({ open, road, dataKey, onClose }) {
  // a11y: this aside is role="dialog" aria-modal="true" — the only modal surface.
  // While open we (a) close on Esc, (b) move focus into the dialog (close button)
  // and remember the previously-focused element, (c) restore focus to that element
  // on close, and (d) trap Tab inside the drawer so focus can't fall through to the
  // still-tabbable sidebar/topbar/table behind it (which aria-modal promises to AT).
  const drawerRef = useRef(null);
  const closeBtnRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const prevFocus = document.activeElement;
    closeBtnRef.current?.focus();
    const onKey = (e) => {
      if (e.key === 'Escape') { onClose && onClose(); return; }
      if (e.key !== 'Tab') return;
      const root = drawerRef.current;
      if (!root) return;
      const focusables = root.querySelectorAll(
        'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
      );
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('keydown', onKey);
      if (prevFocus && typeof prevFocus.focus === 'function') prevFocus.focus();
    };
  }, [open, onClose]);

  // status/colour derivation mirrors RoadTable verbatim in spirit:
  // colour & level come from the displayed speed, falling back to moe.
  const d = road ? (road[dataKey] || road.cur || {}) : {};
  const noData = d.spd == null && d.vol == null;
  const lvl = noData ? null : (d.spd == null ? (d.moe ?? 1) : _moeFromSpd(d.spd));
  const pillCls = lvl === 2 ? 'pill-cong' : lvl === 1 ? 'pill-normal' : 'pill-ok';
  const pillLbl = lvl === 2 ? '壅塞' : lvl === 1 ? '普通' : '暢通';
  const spdCol = (noData || d.spd == null) ? null : speedColor(d.spd);
  const occCol = lvl === 2 ? 'var(--red)' : lvl === 1 ? 'var(--amber)' : 'var(--green)';
  const occW = (d.occ == null) ? 0 : Math.max(0, Math.min(100, d.occ));
  const rec = lvl === 2
    ? <>該路段目前<b>壅塞</b>，建議於主要進入方向<b>延長綠燈 8 秒</b>並啟動鄰近路口連鎖協調，以加速車流疏導。</>
    : lvl === 1
    ? <>該路段車流<b>普通</b>，維持現行號誌時制即可，持續觀察佔有率變化以提早因應尖峰。</>
    : <>該路段車流<b>暢通</b>，號誌時制運作良好，目前無需額外調整。</>;

  return (
    <>
      <div className={'drawer-scrim' + (open ? ' open' : '')} onClick={onClose} aria-hidden="true"/>
      <aside ref={drawerRef} className={'drawer' + (open ? ' open' : '')} role="dialog" aria-modal="true"
             aria-label="路段詳細資訊" aria-hidden={open ? undefined : true}>
        <div className="drawer-head">
          <div className="dh-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19V5M20 19V5M12 19v-3M12 11V8M12 3v1"/></svg>
          </div>
          <div style={{minWidth:0}}>
            <div className="nm">{road ? road.name : '—'}</div>
            <div className="id mono">{road ? road.id : ''}</div>
          </div>
          <button ref={closeBtnRef} className="drawer-close" onClick={onClose} aria-label="關閉詳細資訊">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div className="drawer-body">
          {!road ? (
            <div className="panel-sub" style={{textAlign:'center',padding:'30px 0'}}>請從路段列表選取一條路段。</div>
          ) : noData ? (
            <div className="panel-sub" style={{textAlign:'center',padding:'30px 0'}}>此路段目前等待數據。</div>
          ) : (
            <>
              <div className="dr-status">
                <span className={'pill ' + pillCls}><span className="pd"></span>{pillLbl}</span>
              </div>

              <div className="dr-metrics">
                <div className="dr-metric">
                  <div className="k">平均車速</div>
                  <div className="v tnum" style={spdCol ? {color:spdCol} : undefined}>
                    {d.spd == null ? '--' : d.spd}<small>km/h</small>
                  </div>
                </div>
                <div className="dr-metric">
                  <div className="k">車流量</div>
                  <div className="v tnum">{d.vol == null ? '--' : d.vol}<small>輛</small></div>
                </div>
              </div>

              <div className="dr-section-t">佔有率</div>
              <div className="dr-occ-big">
                <div className="v tnum" style={{fontSize:26,fontWeight:700,fontVariantNumeric:'tabular-nums',lineHeight:1}}>
                  {d.occ == null ? '--' : d.occ}<small style={{fontSize:13,color:'var(--txt2)',fontWeight:500,marginLeft:3}}>%</small>
                </div>
                <div className="track"><span style={{width:`${occW}%`,background:occCol}}></span></div>
              </div>

              <div className="dr-section-t">建議</div>
              <div className="dr-rec">
                <div className="rh">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  號誌優化建議
                </div>
                {rec}
              </div>
            </>
          )}
        </div>
      </aside>
    </>
  );
}


// ==== App ====
/* Hooks / state / effects / derived consts are BYTE-IDENTICAL to the
   original dashboard.html App. Only the returned JSX is restyled to the
   Variant D "Glass Stack Focus" layout (class-based), plus the detail
   drawer is wired in via the EXISTING selectedRoadId state. */
function App() {
  const [activeNav, setActiveNav] = useState('dashboard');
  const [mapMode, setMapMode] = useState('cur');
  const [liveRoads, setLiveRoads] = useState(ROADS_BASE);
  const [vdRoads, setVdRoads] = useState([]);   // 全 VD 路段（逐段，未聚合）：供監控列表/指標的細分顯示
  const [heatmapData, setHeatmapData] = useState(null);
  const [baselineHeatmapData, setBaselineHeatmapData] = useState(null);
  const [currentHeatmapData, setCurrentHeatmapData] = useState(null);
  const [time, setTime] = useState('');
  const [lastFetch, setLastFetch] = useState('');
  const [refreshing, setRefreshing] = useState(false);
  const [countdown, setCountdown] = useState(300);
  const [selectedRoadId, setSelectedRoadId] = useState(null);
  const [roadListCollapsed, setRoadListCollapsed] = useState(false);  // 路段監控列表收合，讓路網車流地圖佔滿可視範圍
  const [simStatus, setSimStatus] = useState('idle');
  const [simTime, setSimTime] = useState(null);
  const [liveSignals, setLiveSignals] = useState(null);   // {tl_id:{state,phase,next_switch}} 來自 WS
  const [predRecords, setPredRecords] = useState([]);
  const [compMetrics, setCompMetrics] = useState({});
  const [signalApiRecords, setSignalApiRecords] = useState([]);
  const [chatMsgs, setChatMsgs] = useState(SAMPLE_MSGS);   // 提升到 App，避免切頁丟失對話
  const [apiError, setApiError] = useState(false);          // /api/traffic 連線失敗提示
  const [forecastError, setForecastError] = useState(false); // /api/{roads,edges}/forecast 失敗提示
  const [healthData, setHealthData] = useState(null);        // /api/health：predict freshness + last strategy
  const [forecastData, setForecastData] = useState({ pred:{}, opt:{} });
  /* Edge 級預測 / 優化（132 條 named edges）— 取代舊版 pred/opt 模式下監控列表
     只能看到 7 條主幹道聚合的問題；資料來自 /api/edges/forecast */
  const [edgeForecast, setEdgeForecast] = useState({ pred:[], opt:[] });

  /* Load heatmap + road forecast from API, refresh every 5 minutes to match pipeline cycle */
  useEffect(() => {
    const load = () => {
      fetch('/api/edge-heatmap')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setHeatmapData(d); })
        .catch(() => {});
      fetch('/api/edge-heatmap/baseline')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setBaselineHeatmapData(d); })
        .catch(() => {});
      fetch('/api/edge-heatmap/current')
        .then(r => r.json())
        .then(d => { if (d && d.edges) setCurrentHeatmapData(d); })
        .catch(() => {});
      /* D3: forecast endpoints 也要 no-store，避免 dashboard 顯示
             /api/traffic 新值（已 no-store）+ forecast 舊值 的混合狀態。
         D4: 任一 forecast 失敗都要讓使用者知道；之前 .catch(()=>{}) 把
             timeout / 500 全吞掉，table 退回 7 行聚合資料卻無視覺提示。
         allSettled 確保兩個 fetch 都跑完才一次 setForecastError，避免兩條
         fetch 平行 + 各自掛 .finally 造成的 race。 */
      Promise.allSettled([
        fetch('/api/roads/forecast', { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => { if (d && (d.pred || d.opt)) setForecastData({ pred: d.pred || {}, opt: d.opt || {} }); }),
        fetch('/api/edges/forecast', { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => { if (d && (Array.isArray(d.pred) || Array.isArray(d.opt))) setEdgeForecast({ pred: d.pred || [], opt: d.opt || [] }); }),
      ]).then(results => {
        const failed = results.filter(r => r.status === 'rejected');
        failed.forEach(r => console.warn('[dashboard] forecast fetch 失敗:', r.reason && r.reason.message));
        setForecastError(failed.length > 0);
      });
    };
    load();
    const tid = setInterval(load, 300000);
    return () => clearInterval(tid);
  }, []);

  /* Fetch prediction / comparison / signal plan data from API */
  useEffect(() => {
    Promise.allSettled([
      fetch('/api/prediction').then(r => r.json()).catch(() => ({})),
      fetch('/api/comparison').then(r => r.json()).catch(() => ({})),
      fetch('/api/signals').then(r => r.json()).catch(() => ({})),
    ]).then(([pred, comp, sig]) => {
      if (pred.status === 'fulfilled' && Array.isArray(pred.value?.records)) setPredRecords(pred.value.records);
      if (comp.status === 'fulfilled' && comp.value?.metrics)               setCompMetrics(comp.value.metrics);
      if (sig.status  === 'fulfilled' && Array.isArray(sig.value?.records))  setSignalApiRecords(sig.value.records);
    });
  }, [lastFetch]);

  /* /api/health — 拉 pipeline freshness 給 banner 顯示 (T1+T2)
     每 30 秒輪詢一次, 比 forecast 的 5 分鐘頻繁, 這樣 scheduler 跑完新一輪
     使用者能比較快看到「上次預測 X 分前」往下倒數。 */
  useEffect(() => {
    const loadHealth = () => {
      fetch('/api/health', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d) setHealthData(d); })
        .catch(() => {});
    };
    loadHealth();
    const tid = setInterval(loadHealth, 30000);
    return () => clearInterval(tid);
  }, []);

  /* Clock */
  useEffect(() => {
    const tick=()=>setTime(new Date().toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}));
    tick(); const id=setInterval(tick,1000); return()=>clearInterval(id);
  }, []);

  /* Refresh logic */
  const doRefresh = useCallback(async () => {
    setRefreshing(true);
    try {
      /* Try real API first */
      const res = await fetch('/api/traffic', { cache: 'no-store', signal: AbortSignal.timeout(3000) });
      if (res.ok) {
        const json = await res.json();
        if (json.data) {
          const entries = Object.entries(json.data);
          setLiveRoads(prev => prev.map(road => {
            const prefix = road.name.trim().split(/\s+/)[0];
            const matches = entries.filter(([name]) => name.startsWith(prefix));
            if (!matches.length) return road;
            const totalVol = matches.reduce((s,[,d])=>s+(d.TotalVol||0),0);
            const avgSpd   = totalVol>0 ? matches.reduce((s,[,d])=>s+(d.AvgSpd||0)*(d.TotalVol||0),0)/totalVol : matches.reduce((s,[,d])=>s+(d.AvgSpd||0),0)/matches.length;
            const avgOcc   = matches.reduce((s,[,d])=>s+(d.AvgOcc||0),0)/matches.length;
            const worstMoe = Math.max(...matches.map(([,d])=>d.MOELevel||0));
            return {...road, cur:{spd:+avgSpd.toFixed(1),vol:Math.round(totalVol/3),occ:+avgOcc.toFixed(1),moe:worstMoe}};
          }));
          /* 逐段 VD 資料（不聚合）：監控列表用，顯示每一條偵測路段。 */
          setVdRoads(entries.map(([name,d]) => ({
            name,
            id: d.SectionId || name,
            cur: {
              spd: d.AvgSpd   != null ? +(+d.AvgSpd).toFixed(1)  : null,
              vol: d.TotalVol != null ? Math.round(+d.TotalVol / 3) : null,
              occ: d.AvgOcc   != null ? +(+d.AvgOcc).toFixed(1)  : null,
              moe: d.MOELevel != null ? +d.MOELevel              : null,
            },
          })));
        }
        setApiError(false);
      } else { throw new Error('no api'); }
    } catch {
      /* API 未啟動：保持 null 數據，不顯示假數值，並顯示連線失敗提示 */
      setApiError(true);
      setLiveRoads(ROADS_BASE.map(r => ({ ...r, cur: { ..._NULL_ROAD_DATA }, pred: { ..._NULL_ROAD_DATA }, opt: { ..._NULL_ROAD_DATA } })));
      setVdRoads([]);
    }
    const ts = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setLastFetch(ts);
    setRefreshing(false);
    setCountdown(300);
  }, []);

  /* Start SUMO optimisation simulation */
  const startOptimize = useCallback(async () => {
    if (simStatus === 'running') {
      await fetch('/api/simulation/stop', { method: 'POST' });
      setSimStatus('idle');
      return;
    }
    setSimStatus('running');
    try {
      const r = await fetch('/api/simulation/start', { method: 'POST' });
      const d = await r.json();
      if (d.status === 'error') setSimStatus('idle');
    } catch { setSimStatus('idle'); }
  }, [simStatus]);

  /* Initial fetch */
  useEffect(() => { doRefresh(); }, []);

  /* 倒數：只做遞減，不在 state updater 內呼 side effect */
  useEffect(() => {
    const tick = setInterval(() => setCountdown(c => c > 0 ? c - 1 : 0), 1000);
    return () => clearInterval(tick);
  }, []);

  /* 倒數歸零 → 觸發刷新（doRefresh 結束會 setCountdown(300) 重啟） */
  useEffect(() => {
    if (countdown === 0) doRefresh();
  }, [countdown, doRefresh]);

  /* WebSocket：訂閱 SUMO 即時模擬串流，驅動「啟動優化」狀態並提供即時號誌相位 */
  useEffect(() => {
    let ws, retry, alive = true;
    const connect = () => {
      if (!alive) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      try { ws = new WebSocket(`${proto}://${location.host}/ws/simulation`); }
      catch { return; }
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'step') {
          setSimStatus('running');
          if (msg.sim_time != null) setSimTime(msg.sim_time);
          if (msg.signals) setLiveSignals(msg.signals);
        } else if (msg.type === 'end') {
          setSimStatus('idle');
          setLiveSignals(null);
        }
      };
      ws.onclose = () => { if (alive) retry = setTimeout(connect, 4000); };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
    };
    connect();
    return () => { alive = false; clearTimeout(retry); try { ws && ws.close(); } catch (e) {} };
  }, []);

  /* Derived pred/opt roads — recomputed only when live roads or API data change */
  const predRoads = useMemo(() => computePredRoads(liveRoads, forecastData.pred), [liveRoads, forecastData]);
  const optRoads  = useMemo(() => computeOptRoads(liveRoads, forecastData.opt),  [liveRoads, forecastData]);
  const displayRoads = mapMode === 'pred' ? predRoads : mapMode === 'opt' ? optRoads : liveRoads;
  const dataKey = mapMode==='pred'?'pred':mapMode==='opt'?'opt':'cur';
  /* Edge 級監控列表：把 /api/edges/forecast 的 132 條 named edges 攤平成
     RoadTable 需要的 {id, name, pred:{...}, opt:{...}} 形狀。
     同時保留每條 edge 的 cur 為 null（cur 模式下我們用 vdRoads，不會走這條） */
  const edgeMonitorRoads = useMemo(() => {
    const byId = new Map();
    (edgeForecast.pred || []).forEach(e => {
      byId.set(e.id, { id: e.id, name: e.name, cur: { spd:null, vol:null, occ:null, moe:null },
                       pred: { spd:e.spd, vol:e.vol, occ:e.occ, moe:e.moe }, opt: null });
    });
    (edgeForecast.opt || []).forEach(e => {
      const ent = byId.get(e.id) || { id: e.id, name: e.name, cur: { spd:null, vol:null, occ:null, moe:null }, pred: null };
      ent.opt = { spd:e.spd, vol:e.vol, occ:e.occ, moe:e.moe };
      byId.set(e.id, ent);
    });
    return Array.from(byId.values());
  }, [edgeForecast]);
  /* 監控列表來源：
       - cur 模式 → vdRoads（64 條逐段 VD，真實感測器）
       - pred / opt 模式 → edgeMonitorRoads（132 條 named SUMO edges，含 75 條全 0 骨架）
         若 /api/edges/forecast 未回應，回退到 displayRoads（7 條聚合）以避免空列表
     舊版兩個三元都鎖在 vdRoads/cur，導致 pred/opt 模式表格永遠顯示 VD 原始值。 */
  const rawMonitorRoads =
    (mapMode === 'cur' && vdRoads.length) ? vdRoads
    : ((mapMode === 'pred' || mapMode === 'opt') && edgeMonitorRoads.length) ? edgeMonitorRoads
    : displayRoads;
  const tableDataKey = dataKey;
  /* 過濾掉當前模式下「速度/車流/佔有率全為 0 或 null」的列。
     pair model 在深夜時段會讓 ~75 條 edge 全 0；表格列出來只會讓使用者看到一堆 0
     而失去意義。地圖上仍會用淡粉白骨架顯示這些 edge，所以路網覆蓋資訊不會遺失。 */
  const monitorRoads = useMemo(() => {
    return rawMonitorRoads.filter(r => {
      const d = r[tableDataKey];
      if (!d) return false;
      const v = (x) => x != null && x !== 0;
      return v(d.spd) || v(d.vol) || v(d.occ);
    });
  }, [rawMonitorRoads, tableDataKey]);
  const borderMed='rgba(99,130,200,0.25)';
  const mins=String(Math.floor(countdown/60)).padStart(2,'0');
  const secs=String(countdown%60).padStart(2,'0');

  /* ── presentational-only derivations for the detail drawer (no data flow change) ──
     selectedRoad is just a lookup into the existing monitorRoads using the
     existing selectedRoadId; drawerOpen is a boolean derived from it. */
  const selectedRoad = selectedRoadId != null ? monitorRoads.find(r => r.id === selectedRoadId) : null;
  const drawerOpen = selectedRoad != null;
  const closeDrawer = () => setSelectedRoadId(null);

  return (
    <div className="app">
      {/* ambient backdrop glow + scanline overlay (decorative) */}
      <div className="bg-glow" aria-hidden="true"></div>
      <div className="scanlines" aria-hidden="true"></div>

      {/* ================= SIDEBAR ================= */}
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="8" y="2" width="8" height="20" rx="3"/><circle cx="12" cy="7" r="1.6" fill="#ef4444" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="#f59e0b" stroke="none"/><circle cx="12" cy="17" r="1.6" fill="#22c55e" stroke="none"/>
            </svg>
          </div>
          <div className="brand-txt">
            <h1>TrafficVision</h1>
            <p>NTUT 交通監控</p>
          </div>
        </div>

        <nav className="nav" aria-label="主導覽">
          <span className="nav-label">監控中心</span>
          <button type="button" className={'nav-item' + (activeNav==='dashboard'?' active':'')} aria-current={activeNav==='dashboard'?'page':undefined} onClick={()=>setActiveNav('dashboard')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            總覽儀表板
          </button>
          <button type="button" className={'nav-item' + (activeNav==='roads'?' active':'')} aria-current={activeNav==='roads'?'page':undefined} onClick={()=>setActiveNav('roads')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19V5"/><path d="M20 19V5"/><path d="M12 19v-3"/><path d="M12 11V8"/><path d="M12 3v1"/></svg>
            路段監控
          </button>
          <button type="button" className={'nav-item' + (activeNav==='signals'?' active':'')} aria-current={activeNav==='signals'?'page':undefined} onClick={()=>setActiveNav('signals')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="2" width="6" height="20" rx="3"/><circle cx="12" cy="7" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="17" r="1"/></svg>
            號誌控制
          </button>
          <button type="button" className={'nav-item' + (activeNav==='predict'?' active':'')} aria-current={activeNav==='predict'?'page':undefined} onClick={()=>setActiveNav('predict')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
            流量預測
          </button>
          <span className="nav-label">智慧分析</span>
          <button type="button" className={'nav-item' + (activeNav==='chat'?' active':'')} aria-current={activeNav==='chat'?'page':undefined} onClick={()=>setActiveNav('chat')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 1 3 3v1a3 3 0 0 1 3 3 3 3 0 0 1 0 6 3 3 0 0 1-3 3 3 3 0 0 1-6 0 3 3 0 0 1-3-3 3 3 0 0 1 0-6 3 3 0 0 1 3-3V5a3 3 0 0 1 3-3Z"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
            AI 助理
          </button>
          <button type="button" className={'nav-item' + (activeNav==='export'?' active':'')} aria-current={activeNav==='export'?'page':undefined} onClick={()=>setActiveNav('export')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3 3 3-3"/></svg>
            匯出報告
          </button>
        </nav>

        <div className="nav-spacer"></div>
        <div className="side-status">
          <div className="row"><span className="dot"></span><span>{apiError ? '連線異常' : '系統運行中'}</span></div>
          <div className="sub mono">下次更新 {mins}:{secs} · {monitorRoads.length} 路段在線</div>
        </div>
      </aside>

      {/* ================= MAIN ================= */}
      <div className="main">
        {/* topbar */}
        <header className="topbar">
          <div className="titles">
            <h2>{(MODES_NAV_TITLE[activeNav]) || '總覽儀表板'}</h2>
            <p>最後更新 <span className="mono">{lastFetch || '—'}</span> · NTUT 校區交通即時監控網</p>
          </div>
          <div className="tb-spacer"></div>
          <span className="live-pill"><span className="live-dot"></span>即時資料 LIVE</span>
          <span className="clock mono"><span className="visually-hidden">目前時間 </span>{time}</span>
          <button type="button" className="btn" onClick={doRefresh} disabled={refreshing}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
            {refreshing ? '更新中…' : '立即更新'}
          </button>
          <button type="button" className="btn btn-primary" onClick={startOptimize} disabled={simStatus==='running'} aria-label={simStatus==='running'?'模擬中':'啟動優化'}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={simStatus==='running'?{animation:'spin 1s linear infinite'}:undefined}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            {simStatus==='running' ? '模擬中…' : '啟動優化'}
          </button>
        </header>

        {/* content */}
        <div className="content">

          {/* ── banners (restyled, logic preserved) ── */}
          {/* API 連線失敗提示 */}
          {apiError && (
            <div className="banner banner-error" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h0"/></svg>
              <span>無法連線到 API 伺服器，顯示的資料可能不是最新。請確認後端是否啟動。</span>
            </div>
          )}
          {/* 預測資料失敗提示 — 區別於 /api/traffic 失敗，這個只影響 5 分鐘預測 / 優化視圖 */}
          {forecastError && !apiError && (
            <div className="banner banner-warn" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h0"/></svg>
              <span>無法取得 5 分鐘預測 / 優化資料（pipeline 可能跳過或尚未產出）。當前車流仍會正常顯示。</span>
            </div>
          )}
          {/* T1+T2: 預測資料新鮮度 + 本輪策略 (僅 pred/opt 模式顯示, 避免 cur 模式佔位)
                  age < 360s: 綠色 (新鮮), 360-900: 黃色 (略舊), > 900: 紅色 (建議查 scheduler) */}
          {(mapMode === 'pred' || mapMode === 'opt') && healthData?.predict && (() => {
            const age = healthData.predict.age_sec ?? 999999;
            const ageMin = Math.floor(age / 60);
            const ageSec = age % 60;
            const ageLabel = age < 60 ? `${age} 秒前` : `${ageMin} 分 ${ageSec} 秒前`;
            const tone = age < 360 ? 'banner-info'
                       : age < 900 ? 'banner-warn'
                       :              'banner-error';
            const strat = healthData.pipeline?.last_strategy;
            const score = healthData.pipeline?.last_composite_score;
            const stratLabel = !strat ? '本輪策略未知'
                             : strat === 'no_control'
                               ? '本輪維持現狀（優化器未找到優於基準的方案，score = 1.000）'
                               : `本輪採用 ${strat}（composite_score = ${typeof score === 'number' ? score.toFixed(4) : '?'}，< 1 即優於基準）`;
            return (
              <div className={'banner ' + tone} role={tone === 'banner-error' ? 'alert' : 'status'} aria-live="polite">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8}}>
                  <span style={{display:'inline-flex',alignItems:'center',gap:5}}>
                    GRU 預測產出於 <b className="mono">{ageLabel}</b>
                  </span>
                  <span style={{opacity:0.55,fontSize:10}}>·</span>
                  <span>{stratLabel}</span>
                  {healthData.pipeline?.last_run_step3_skipped && (
                    <>
                      <span style={{opacity:0.55,fontSize:10}}>·</span>
                      <span style={{color:'var(--red)'}}>Step 3 已跳過：{healthData.pipeline.last_run_step3_skipped}</span>
                    </>
                  )}
                </span>
              </div>
            );
          })()}

          {/* ── KPI STRIP (full width) ── */}
          <MetricsPanel roads={monitorRoads} dataKey={tableDataKey}/>

          {/* ── DASHBOARD VIEW: focal map + signals, then table + AI ── */}
          {activeNav==='dashboard' && (
            <>
              <div className="grid-2">
                {/* MAP panel (TrafficMap rendered inside the focal glass frame) */}
                <div className="map-panel glass">
                  <div className="panel-head">
                    <h3>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3Z"/><path d="M9 7v13M15 4v13"/></svg>
                      即時車流地圖
                    </h3>
                    <div className="ph-spacer"></div>
                    <div className="seg" role="group" aria-label="地圖車流模式">
                      {Object.entries(MODES).map(([k,v])=>{
                        const segRgb = k==='cur' ? '59,130,246' : k==='pred' ? '245,158,11' : '34,197,94';
                        return (
                          <button key={k} type="button" className={mapMode===k?'on':''} onClick={()=>setMapMode(k)}
                                  style={{'--seg-rgb':segRgb}} aria-pressed={mapMode===k} aria-label={`地圖模式：${v.label}`}>
                            <span className="swatch" style={{background:v.accent}}></span>{v.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  <div className="map-wrap">
                    <span className="corner c-tl"></span><span className="corner c-tr"></span><span className="corner c-bl"></span><span className="corner c-br"></span>
                    {/* focal map — TrafficMap component owns the Leaflet root */}
                    <TrafficMap viewMode={mapMode} roads={displayRoads} heatmapData={heatmapData} baselineHeatmapData={baselineHeatmapData} currentHeatmapData={currentHeatmapData}/>
                    <div className="map-banner glass-float" aria-live="polite">
                      <span className="mb-dot" style={{background:MODES[mapMode].accent,boxShadow:`0 0 8px ${MODES[mapMode].accent}`}}></span>
                      <span>策略 · <b>{MODES[mapMode].label}</b></span>
                    </div>
                    <div className="legend glass-float">
                      <h4>車速 km/h <span className="mode-tag" style={{background:`${MODES[mapMode].accent}28`,color:lerpColor(MODES[mapMode].accent,'#ffffff',0.45)}}>{MODES[mapMode].label.slice(0,2)}</span></h4>
                      <div className="scale"></div>
                      <div className="scale-lbls"><span>0</span><span>10</span><span>20</span><span>30</span><span>40+</span></div>
                      <div className="width-note"><span className="ln"></span>線寬 = 車流量<span className="ln big"></span></div>
                    </div>
                    <div style={{position:'absolute',right:14,bottom:14,zIndex:600}}>
                      <span className="panel-sub mono" style={{padding:'6px 10px',borderRadius:9,background:'rgba(8,13,28,0.62)',border:'1px solid var(--glass-bd)'}}>下次更新 {mins}:{secs}</span>
                    </div>
                  </div>
                </div>

                {/* SIGNALS panel (SignalControl component owns its own .sig-panel glass root) */}
                <SignalControl apiRecords={signalApiRecords} liveSignals={liveSignals}/>
              </div>

              <div className="grid-2b">
                {/* ROAD TABLE (RoadTable owns its own .table-panel glass root) */}
                <RoadTable roads={monitorRoads} dataKey={tableDataKey} selectedId={selectedRoadId} onSelectRoad={r=>setSelectedRoadId(r.id)} collapsed={roadListCollapsed} onToggleCollapse={()=>setRoadListCollapsed(c=>!c)}/>

                {/* AI panel (LLMChat owns its own .ai-panel glass root) */}
                <LLMChat msgs={chatMsgs} setMsgs={setChatMsgs}/>
              </div>
            </>
          )}

          {/* ── ROADS VIEW: map + full road table ── */}
          {activeNav==='roads' && (
            <>
              <div className="map-panel glass" style={{marginBottom:18}}>
                <div className="panel-head">
                  <h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3Z"/><path d="M9 7v13M15 4v13"/></svg>
                    即時車流地圖
                  </h3>
                  <div className="ph-spacer"></div>
                  <div className="seg" role="group" aria-label="地圖車流模式">
                    {Object.entries(MODES).map(([k,v])=>{
                      const segRgb = k==='cur' ? '59,130,246' : k==='pred' ? '245,158,11' : '34,197,94';
                      return (
                        <button key={k} type="button" className={mapMode===k?'on':''} onClick={()=>setMapMode(k)}
                                style={{'--seg-rgb':segRgb}} aria-pressed={mapMode===k} aria-label={`地圖模式：${v.label}`}>
                          <span className="swatch" style={{background:v.accent}}></span>{v.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
                <div className="map-wrap">
                  <span className="corner c-tl"></span><span className="corner c-tr"></span><span className="corner c-bl"></span><span className="corner c-br"></span>
                  <TrafficMap viewMode={mapMode} roads={displayRoads} heatmapData={heatmapData} baselineHeatmapData={baselineHeatmapData} currentHeatmapData={currentHeatmapData}/>
                  <div className="legend glass-float">
                    <h4>車速 km/h <span className="mode-tag" style={{background:`${MODES[mapMode].accent}28`,color:lerpColor(MODES[mapMode].accent,'#ffffff',0.45)}}>{MODES[mapMode].label.slice(0,2)}</span></h4>
                    <div className="scale"></div>
                    <div className="scale-lbls"><span>0</span><span>10</span><span>20</span><span>30</span><span>40+</span></div>
                    <div className="width-note"><span className="ln"></span>線寬 = 車流量<span className="ln big"></span></div>
                  </div>
                </div>
              </div>
              {/* RoadTable owns its own .table-panel glass root; wrapper only supplies sizing */}
              <div style={{display:'flex',minHeight:520}}>
                <RoadTable roads={monitorRoads} dataKey={tableDataKey} selectedId={selectedRoadId} onSelectRoad={r=>setSelectedRoadId(r.id)} collapsed={roadListCollapsed} onToggleCollapse={()=>setRoadListCollapsed(c=>!c)}/>
              </div>
            </>
          )}

          {/* ── SIGNALS VIEW: full-width signal control ── */}
          {activeNav==='signals' && (
            /* SignalControl owns its own .sig-panel glass root; wrapper only supplies sizing */
            <div style={{display:'flex',minHeight:520}}>
              <SignalControl apiRecords={signalApiRecords} liveSignals={liveSignals}/>
            </div>
          )}

          {/* ── PREDICT VIEW: prediction panel ── */}
          {activeNav==='predict' && (
            /* PredictPanel owns its own .table-panel glass root; wrapper only supplies sizing */
            <div style={{display:'flex',minHeight:520}}>
              <PredictPanel predRoads={predRoads} predRecords={predRecords}/>
            </div>
          )}

          {/* ── CHAT VIEW: full-width AI ── */}
          {activeNav==='chat' && (
            /* LLMChat owns its own .ai-panel glass root; wrapper only supplies sizing */
            <div style={{display:'flex',minHeight:560}}>
              <LLMChat msgs={chatMsgs} setMsgs={setChatMsgs}/>
            </div>
          )}

          {/* ── EXPORT VIEW: export panel ── */}
          {activeNav==='export' && (
            /* ExportPanel owns its own .table-panel glass root; wrapper only supplies sizing */
            <div style={{display:'flex',minHeight:520}}>
              <ExportPanel/>
            </div>
          )}

        </div>
      </div>

      {/* ================= DETAIL DRAWER ================= */}
      <DetailDrawer open={drawerOpen} road={selectedRoad} dataKey={tableDataKey} onClose={closeDrawer}/>
    </div>
  );
}

/* presentational lookup for the topbar page title (no logic change) */
const MODES_NAV_TITLE = {
  dashboard:'總覽儀表板', roads:'路段監控', signals:'號誌控制',
  predict:'流量預測', chat:'AI 助理', export:'匯出報告',
};


// ==== ErrorBoundary ====
/* VERBATIM — logic */
/* ── Error Boundary：任一元件丟例外時顯示錯誤卡片，避免整頁白屏 ── */
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error('Dashboard render error:', err, info); }
  render(){
    if(this.state.err){
      return (
        <div role="alert" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',gap:12,background:'var(--bg)',color:'var(--txt)',fontFamily:"'Noto Sans TC','PingFang TC',sans-serif",padding:24,textAlign:'center'}}>
          <div style={{fontSize:18,fontWeight:700,color:'var(--red)'}}>儀表板發生錯誤</div>
          <div style={{fontSize:13,color:'var(--txt2)',maxWidth:520}}>{String(this.state.err && this.state.err.message || this.state.err)}</div>
          <button onClick={()=>location.reload()} style={{marginTop:8,fontFamily:"'Inter',system-ui,sans-serif",fontSize:13,padding:'8px 18px',borderRadius:'var(--r-ctrl)',border:'1px solid var(--glass-bd)',background:'rgba(59,130,246,0.12)',color:'var(--blue2)',cursor:'pointer'}}>重新載入</button>
        </div>
      );
    }
    return this.props.children;
  }
}


// ==== render ====
/* VERBATIM — logic */
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
