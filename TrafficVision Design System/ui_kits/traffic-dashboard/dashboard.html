<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficVision v2 — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.js" integrity="sha384-4aETf8z71hiSsoK0xYsa5JtiJHfL3h7uMAsZ2QYOLvcySDL/cEDfdLt0SaBypTQZ" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ============================================================
   TrafficVision — Variant D "Glass Stack Focus" (沉穩玻璃聚焦)
   Restrained premium glassmorphism on a deep-navy OLED base.
   Neon is used ONLY as small accents on live/status elements.
   Class-based, React-drop-in stylesheet (no  wrapper).
   ============================================================ */

/* ============ TOKENS ============ */
:root{
  --bg:#020617; --bg-deep:#060c1a; --surf:#0a0f1e; --surf2:#0f1629; --elev:#162036;
  --txt:#f1f5f9; --txt2:#94a3b8; --muted:#8595b8;
  --cyan:#22d3ee; --blue:#3b82f6; --blue2:#60a5fa; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --magenta:#d946ef;
  /* status aliases (free=暢通 / normal=普通 / cong=壅塞) */
  --free:#22c55e; --normal:#f59e0b; --cong:#ef4444;
  /* glass recipe */
  --glass:rgba(15,22,41,0.55); --glass-float:rgba(8,13,28,0.62);
  --glass-bd:rgba(120,160,240,0.18);
  --glass-sh:0 8px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  --r-panel:15px; --r-ctrl:10px;
  --accent:var(--blue2); --accent-rgb:96,165,250;
}

/* ============ BASE / RESET ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  background:var(--bg); color:var(--txt);
  font-size:14px; line-height:1.5; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:'JetBrains Mono',monospace}
/* a11y-only label, kept off-screen but readable to AT */
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============ AMBIENT BACKDROP GLOW ============ */
/* fixed radial wash behind everything; pure decoration, no pointer events */
.bg-glow{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 600px at 78% -8%, rgba(34,211,238,0.10), transparent 60%),
    radial-gradient(800px 700px at 12% 110%, rgba(59,130,246,0.12), transparent 60%),
    radial-gradient(600px 500px at 95% 95%, rgba(217,70,239,0.06), transparent 60%);
}
/* faint scanline overlay (above content, below modals) */
.scanlines{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:30; opacity:.35;
  background:repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(120,160,240,0.018) 3px, transparent 4px);
}

/* app shell: 248px sidebar + fluid main */
.app{position:relative; z-index:1; display:grid; grid-template-columns:248px 1fr; height:100vh; width:100vw}

/* ============ SCROLLBARS ============ */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,160,240,0.22);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,160,240,0.4);background-clip:padding-box}

/* ============ GLASS RECIPES ============ */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-bd);
  border-radius:var(--r-panel);
  box-shadow:var(--glass-sh);
}
.glass-float{
  background:var(--glass-float);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-bd);
  border-radius:var(--r-panel);
  box-shadow:var(--glass-sh);
}

/* ============ SIDEBAR ============ */
.sidebar{
  background:linear-gradient(180deg, rgba(10,15,30,0.82), rgba(6,12,26,0.92));
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
  border-right:1px solid rgba(120,160,240,0.12);
  display:flex; flex-direction:column; padding:20px 16px;
  position:relative;
}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 22px}
.brand-logo{
  width:42px; height:42px; border-radius:12px; flex-shrink:0;
  display:grid; place-items:center;
  background:linear-gradient(135deg, rgba(34,211,238,0.22), rgba(59,130,246,0.18));
  border:1px solid rgba(34,211,238,0.35);
  box-shadow:0 0 0 1px rgba(34,211,238,0.18), 0 0 18px rgba(34,211,238,0.18);
}
.brand-logo svg{width:24px;height:24px}
.brand-txt h1{font-size:16px; font-weight:700; letter-spacing:.2px}
.brand-txt p{font-size:11px; color:var(--txt2); font-weight:400; margin-top:1px}

/* nav */
.nav{display:flex; flex-direction:column; gap:4px; margin-top:8px}
.nav-label{font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); padding:8px 12px 6px; font-weight:600}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:var(--r-ctrl);
  color:var(--txt2); cursor:pointer; position:relative;
  font-size:13.5px; font-weight:500; border:1px solid transparent;
  transition:background .2s, color .2s, transform .15s;
  background:none; width:100%; text-align:left; font-family:inherit;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0; transition:transform .2s}
.nav-item:hover{background:rgba(120,160,240,0.08); color:var(--txt); transform:translateX(2px)}
.nav-item:hover svg{transform:scale(1.05)}
.nav-item.active{
  color:#fff; background:linear-gradient(90deg, rgba(59,130,246,0.22), rgba(34,211,238,0.08));
  border:1px solid rgba(96,165,250,0.3);
}
/* neon spine on the active nav item — one of the few neon accents */
.nav-item.active::before{
  content:""; position:absolute; left:-16px; top:50%; transform:translateY(-50%);
  width:3px; height:22px; border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--cyan),var(--blue));
  box-shadow:0 0 12px rgba(34,211,238,0.6);
}
.nav-spacer{flex:1}

/* sidebar live status card */
.side-status{
  margin-top:14px; padding:12px; border-radius:12px;
  background:rgba(8,13,28,0.5); border:1px solid rgba(120,160,240,0.12);
  font-size:11px; color:var(--txt2);
}
.side-status .row{display:flex; align-items:center; gap:8px}
.side-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite}
.side-status .sub{margin-top:6px;color:var(--muted);font-size:10.5px}

/* ============ MAIN COLUMN ============ */
.main{display:flex; flex-direction:column; min-width:0; height:100vh; overflow:hidden}

/* ============ TOPBAR ============ */
.topbar{
  display:flex; align-items:center; gap:16px;
  padding:16px 26px; flex-shrink:0;
  border-bottom:1px solid rgba(120,160,240,0.1);
  background:rgba(6,12,26,0.4);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.topbar .titles h2{font-size:20px;font-weight:700;letter-spacing:.2px}
.topbar .titles p{font-size:12px;color:var(--txt2);margin-top:2px}
.topbar .titles p .mono{color:var(--blue2)}
.tb-spacer{flex:1}

/* LIVE pill — neon green accent on live status */
.live-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;
  color:#bbf7d0; background:rgba(34,197,94,0.1);
  border:1px solid rgba(34,197,94,0.35);
  box-shadow:0 0 0 1px rgba(34,197,94,0.12), 0 0 16px rgba(34,197,94,0.12);
}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}

/* monospace clock */
.clock{
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;
  color:var(--cyan); padding:7px 13px; border-radius:var(--r-ctrl);
  background:rgba(34,211,238,0.06); border:1px solid rgba(34,211,238,0.2);
  letter-spacing:1px;
}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:var(--r-ctrl);font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid var(--glass-bd);color:var(--txt);
  background:rgba(22,32,54,0.6); font-family:inherit;
  transition:background .2s, transform .15s, box-shadow .2s, color .2s;
}
.btn svg{width:16px;height:16px}
.btn:hover{background:rgba(34,46,74,0.8); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:linear-gradient(135deg, var(--blue), var(--cyan));
  border:1px solid rgba(34,211,238,0.5); color:#03121a; font-weight:700;
  box-shadow:0 0 0 1px rgba(34,211,238,0.25), 0 6px 20px rgba(34,211,238,0.22);
}
.btn-primary:hover{box-shadow:0 0 0 1px rgba(34,211,238,0.4), 0 8px 26px rgba(34,211,238,0.34); transform:translateY(-1px)}

/* content scroll area + view transitions */
.content{flex:1; overflow-y:auto; padding:20px 26px 28px; position:relative}
.view{display:none}
.view.active{display:block; animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* spinner for refresh / optimize buttons while a request is in flight */
@keyframes spin{to{transform:rotate(360deg)}}
/* typing-indicator dots in the AI chat loading state */
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

/* ============ KPI STRIP ============ */
.kpi-strip{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:20px}
.kpi{
  padding:14px 16px; position:relative; overflow:hidden;
  transition:transform .2s, box-shadow .2s, border-color .2s;
}
/* per-card accent uses --kc / --kc-rgb set inline by the React component */
.kpi::after{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--kc,var(--blue2)), transparent);
  opacity:.7;
}
.kpi:hover{transform:translateY(-3px); border-color:rgba(120,160,240,0.32)}
.kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.kpi-label{font-size:11.5px; color:var(--txt2); font-weight:500}
.kpi-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:rgba(var(--kc-rgb,96,165,250),0.12); color:var(--kc,var(--blue2))}
.kpi-ico svg{width:16px;height:16px}
.kpi-num{font-size:30px; font-weight:700; letter-spacing:-.5px; line-height:1; color:#fff}
.kpi-unit{font-size:12px; color:var(--txt2); font-weight:500; margin-left:4px}
.kpi-bar{height:4px; border-radius:3px; background:rgba(120,160,240,0.12); margin-top:11px; overflow:hidden}
.kpi-bar span{display:block; height:100%; border-radius:3px; background:var(--kc,var(--blue2));
  box-shadow:0 0 8px var(--kc,var(--blue2)); transition:width .8s cubic-bezier(.3,.8,.3,1)}

/* ============ CONTENT GRIDS ============ */
.grid-2{display:grid; grid-template-columns:1.55fr 1fr; gap:18px; margin-bottom:18px}
.grid-2b{display:grid; grid-template-columns:1fr 1fr; gap:18px}

/* ============ PANEL CHROME ============ */
.panel-head{display:flex; align-items:center; gap:10px; padding:14px 18px 12px; border-bottom:1px solid rgba(120,160,240,0.1)}
.panel-head h3{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:9px}
.panel-head h3 svg{width:17px;height:17px;color:var(--cyan)}
.ph-spacer{flex:1}
.panel-sub{font-size:11px; color:var(--muted)}

/* ============ MAP PANEL ============ */
.map-panel{display:flex; flex-direction:column; min-height:480px}
/* segmented mode switch (原始 / 預測 / 優化); per-seg accent via --seg-rgb */
.seg{display:inline-flex; gap:3px; padding:3px; border-radius:10px; background:rgba(8,13,28,0.6); border:1px solid rgba(120,160,240,0.12)}
.seg button{
  font-family:inherit; font-size:12px; font-weight:600; cursor:pointer;
  padding:6px 13px; border-radius:7px; border:1px solid transparent; color:var(--txt2);
  background:none; transition:background .2s, color .2s, box-shadow .2s; display:flex; align-items:center; gap:6px;
}
.seg button .swatch{width:8px;height:8px;border-radius:2px}
.seg button:hover{color:var(--txt)}
.seg button.on{color:#fff; background:rgba(var(--seg-rgb,59,130,246),0.16);
  border:1px solid rgba(var(--seg-rgb,59,130,246),0.4);
  box-shadow:0 0 0 1px rgba(var(--seg-rgb,59,130,246),0.2), 0 0 14px rgba(var(--seg-rgb,59,130,246),0.18)}

.map-wrap{flex:1; position:relative; margin:14px 16px 16px; border-radius:13px; overflow:hidden;
  border:1px solid rgba(120,160,240,0.16); min-height:420px}
.map-canvas{position:absolute; inset:0; background:#0a0f1e}

/* HUD corner brackets framing the map */
.corner{position:absolute; width:18px; height:18px; z-index:500; pointer-events:none; border-color:rgba(34,211,238,0.5)}
.c-tl{top:8px;left:8px;border-top:2px solid;border-left:2px solid;border-radius:3px 0 0 0}
.c-tr{top:8px;right:8px;border-top:2px solid;border-right:2px solid;border-radius:0 3px 0 0}
.c-bl{bottom:8px;left:8px;border-bottom:2px solid;border-left:2px solid;border-radius:0 0 0 3px}
.c-br{bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid;border-radius:0 0 3px 0}

/* speed legend overlay (bottom-left) */
.legend{position:absolute; left:14px; bottom:14px; z-index:600; padding:11px 13px; border-radius:12px; min-width:182px}
.legend h4{font-size:11px; color:var(--txt); margin-bottom:9px; font-weight:600; display:flex; align-items:center; gap:6px}
.legend .mode-tag{font-size:9.5px; padding:2px 7px; border-radius:6px; font-weight:700; letter-spacing:.4px}
.legend .scale{height:8px; border-radius:4px; background:linear-gradient(90deg,#ef4444,#f97316,#f59e0b,#84cc16,#22c55e)}
.legend .scale-lbls{display:flex; justify-content:space-between; font-size:9.5px; color:var(--txt2); margin-top:4px; font-family:'JetBrains Mono',monospace}
.legend .width-note{font-size:10px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:7px}
.legend .width-note .ln{height:3px;width:30px;border-radius:2px;background:var(--blue2)}
.legend .width-note .ln.big{height:6px}

/* mode banner (top-right of map) */
.map-banner{position:absolute; right:14px; top:14px; z-index:600; padding:9px 13px; border-radius:11px; font-size:11px; display:flex; align-items:center; gap:9px}
.map-banner .mb-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.map-banner b{font-size:12px}

/* ============ LEAFLET OVERRIDES (dark glass theme) ============ */
/* self-contained neon-grid basemap so polylines never float on void */
.leaflet-container{
  background:
    radial-gradient(700px 500px at 60% 35%, rgba(34,211,238,0.05), transparent 70%),
    radial-gradient(600px 600px at 20% 85%, rgba(59,130,246,0.06), transparent 70%),
    linear-gradient(rgba(120,160,240,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,160,240,0.06) 1px, transparent 1px),
    linear-gradient(rgba(120,160,240,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,160,240,0.03) 1px, transparent 1px),
    #0a0f1e !important;
  background-size:auto, auto, 64px 64px, 64px 64px, 16px 16px, 16px 16px !important;
  background-position:center, center, center, center, center, center !important;
  font-family:'Inter','Noto Sans TC',sans-serif !important;
}
/* glass popup */
.leaflet-popup-content-wrapper{
  background:rgba(8,13,28,0.88) !important;
  -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(120,160,240,0.28) !important; border-radius:12px !important;
  box-shadow:0 8px 32px rgba(0,0,0,0.6) !important; color:var(--txt) !important;
}
.leaflet-popup-tip{background:rgba(8,13,28,0.88) !important; border:1px solid rgba(120,160,240,0.28) !important}
.leaflet-popup-content{margin:12px 14px !important; font-family:'Inter','Noto Sans TC',sans-serif !important}
.leaflet-popup-close-button{color:var(--txt2) !important}
.leaflet-popup-close-button:hover{color:#fff !important}
/* zoom control as glass chips */
.leaflet-bar,
.leaflet-control-zoom{border:1px solid rgba(120,160,240,0.2) !important; box-shadow:0 4px 18px rgba(0,0,0,0.5) !important; border-radius:9px !important; overflow:hidden}
.leaflet-bar a,
.leaflet-control-zoom a{
  background:rgba(8,13,28,0.82) !important; color:var(--txt) !important;
  border-bottom:1px solid rgba(120,160,240,0.16) !important;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  width:30px !important; height:30px !important; line-height:30px !important; font-size:17px !important;
}
.leaflet-bar a:hover,
.leaflet-control-zoom a:hover{background:rgba(34,211,238,0.16) !important; color:var(--cyan) !important}
.leaflet-bar a:last-child,
.leaflet-control-zoom a:last-child{border-bottom:none !important}
.leaflet-control-zoom a.leaflet-disabled{background:rgba(8,13,28,0.5) !important; color:var(--muted) !important}
/* attribution */
.leaflet-control-attribution{
  background:rgba(8,13,28,0.7) !important; color:var(--muted) !important;
  border-radius:7px 0 0 0 !important; font-size:10px !important; padding:2px 7px !important;
}
.leaflet-control-attribution a{color:var(--txt2) !important}

/* popup inner text helpers */
.pop-name{font-weight:700; font-size:13px; color:#fff; margin-bottom:2px}
.pop-id{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--cyan); margin-bottom:8px}
.pop-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px}
.pop-grid .k{font-size:10px;color:var(--txt2)}
.pop-grid .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* NTUT campus marker */
.marker-ntut{
  display:flex;align-items:center;gap:6px; white-space:nowrap;
  background:rgba(8,13,28,0.85); border:1px solid rgba(34,211,238,0.5);
  padding:5px 10px; border-radius:999px; font-size:11px; font-weight:700; color:#fff;
  box-shadow:0 0 0 1px rgba(34,211,238,0.25), 0 0 18px rgba(34,211,238,0.3);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.marker-ntut .pin{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* ============ ROAD TABLE ============ */
.table-panel{display:flex; flex-direction:column; min-height:480px}
.search-box{display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:9px;
  background:rgba(8,13,28,0.6); border:1px solid rgba(120,160,240,0.16); width:200px}
.search-box svg{width:15px;height:15px;color:var(--muted);flex-shrink:0}
.search-box input{background:none; border:none; outline:none; color:var(--txt); font-family:inherit; font-size:12.5px; width:100%}
.search-box input::placeholder{color:var(--muted)}
.tbl-scroll{flex:1; overflow-y:auto; padding:6px 8px 10px}
.tbl{width:100%; border-collapse:collapse}
.tbl thead th{
  position:sticky; top:0; z-index:2; text-align:left; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase;
  color:var(--txt2); font-weight:600; padding:9px 12px;

/* phase ribbon */
.phase-bar{display:flex; height:14px; border-radius:7px; overflow:hidden; border:1px solid rgba(120,160,240,0.12)}

/* ============ DETAIL DRAWER (slide-in + scrim) ============ */
.drawer-scrim{position:fixed; inset:0; z-index:1400; background:rgba(2,6,18,0.55);

.drawer{

  background:linear-gradient(180deg, rgba(12,18,36,0.92), rgba(7,12,26,0.95));

}

.drawer-head{display:flex; align-items:flex-start; gap:12px; padding:20px 20px 16px; border-bottom:1px solid rgba(120,160,240,0.12)}
.drawer-head .dh-ico{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;

.drawer-head .dh-ico svg{width:21px;height:21px}
.drawer-head .nm{font-size:16px;font-weight:700;line-height:1.3}
.drawer-head .id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);margin-top:4px}
.drawer-close{

.fc-card{padding:18px;text-align:center}

.fc-card .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* ============ BANNERS (error / warn / info) ============ */
.banner{
  display:flex; align-items:flex-start; gap:11px; padding:12px 15px; border-radius:12px;
  font-size:12.5px; line-height:1.55; margin-bottom:16px;
  -webkit-backdrop-filter:blur(12px) saturate(140%); backdrop-filter:blur(12px) saturate(140%);
}
.banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.banner b{font-weight:700}
.banner .b-close{margin-left:auto;background:none;border:none;cursor:pointer;color:inherit;opacity:.7;padding:2px}

}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
  .view.active{animation:none}
}

/* ══════════════════════════════════════════════════

══════════════════════════════════════════════════ */
function lerpColor(a, b, t) {
  const ah=parseInt(a.slice(1),16), bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&0xff, ag=(ah>>8)&0xff, ab=ah&0xff;
  const br=(bh>>16)&0xff, bg=(bh>>8)&0xff, bb=bh&0xff;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return `#${((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0')}`;
}
function speedColor(spd) {
  if (spd <=  0) return '#ef4444';
  if (spd <= 10) return lerpColor('#ef4444','#f97316', spd/10);
  if (spd <= 20) return lerpColor('#f97316','#f59e0b',(spd-10)/10);
  if (spd <= 30) return lerpColor('#f59e0b','#84cc16',(spd-20)/10);
  if (spd <= 40) return lerpColor('#84cc16','#22c55e',(spd-30)/10);
  return '#22c55e';
}
function countColorMode(count, maxCount, mode) {
  if (!count || !maxCount) return 'rgba(99,130,200,0.12)';
  const t = Math.min(1, count / maxCount);
  if (mode === 'pred') {
    if (t < 0.25) return lerpColor('#22c55e','#84cc16', t/0.25);
    if (t < 0.5)  return lerpColor('#84cc16','#f59e0b',(t-0.25)/0.25);
    if (t < 0.75) return lerpColor('#f59e0b','#fb923c',(t-0.5)/0.25);
    return             lerpColor('#fb923c','#dc2626',(t-0.75)/0.25);
  }
  if (t < 0.25) return lerpColor('#22c55e','#84cc16', t/0.25);
  if (t < 0.5)  return lerpColor('#84cc16','#f59e0b',(t-0.25)/0.25);
  if (t < 0.75) return lerpColor('#f59e0b','#f97316',(t-0.5)/0.25);
  return             lerpColor('#f97316','#ef4444',(t-0.75)/0.25);
}
function polylineMidpoint(pts) {
  if (pts.length < 2) return pts[0] || [0,0];
  let total=0;
  const dists=pts.slice(0,-1).map((p,i)=>{ const d=L.latLng(p).distanceTo(L.latLng(pts[i+1])); total+=d; return d; });
  let acc=0; const half=total/2;
  for (let i=0;i<dists.length;i++) {
    if (acc+dists[i]>=half) { const t=dists[i]>0?(half-acc)/dists[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t, pts[i][1]+(pts[i+1][1]-pts[i][1])*t]; }
    acc+=dists[i];
  }
  return pts[Math.floor(pts.length/2)];
}

/* ==== MetricsPanel ==== */
/* KPI strip — six thin glass cards. avgSpd / totalVol / congested / free /
   sigCount computations preserved byte-for-byte from the original. Only the
   per-card accent (--kc / --kc-rgb) and bar width are presentational. */
function MetricsPanel({ roads, dataKey = 'cur' }) {
  const n = roads.length;
  /* 依當前模式 (cur / pred / opt) 取對應的指標欄位；
     不然 pred / opt 模式下 edgeMonitorRoads 的 cur 是空殼，所有統計都會變 -- */
  const _d = (r) => r[dataKey] || r.cur || {};
  const roadsWithData = roads.filter(r => _d(r).spd != null);
  const hasData = roadsWithData.length > 0;
  /* avgSpd 用 spd > 0 的子集計算：dashboard 監控列表會包含 SUMO 路網中
     沒車經過的死巷邊 (spd 紀錄為 0 但非 null)，把它們算進平均會把整體車速
     往下拉 (pred 模式 32.9 vs 排除後 41 km/h)。物理意義也對：「平均車速」
     應該是「實際在動的路段平均速度」。其他統計 (totalVol/congested/free)
     仍用 roadsWithData，因為 vol/moe 對 spd=0 的邊仍有意義 */
  const movingRoads = roadsWithData.filter(r => _d(r).spd > 0);
  const avgSpd = movingRoads.length ? +(movingRoads.reduce((s,r)=>s+_d(r).spd,0)/movingRoads.length).toFixed(1) : null;
  const totalVol = hasData ? roadsWithData.reduce((s,r)=>s+(_d(r).vol||0),0) : null;
  const congested = hasData ? roadsWithData.filter(r=>_d(r).moe===2).length : null;
  const free = hasData ? roadsWithData.filter(r=>_d(r).moe===0).length : null;
  const sigCount = signalData.length;

  /* T3: 每張 card 加 tooltip 解釋資料源 + 單位, 依當前 dataKey (cur/pred/opt) 分歧.
         今天踩過好幾個「為何 X 跟 Y 數字差這麼多」的問題, 把單位明寫在 hover 提示
         可以避免類似誤會. 用 native HTML title 屬性 (browser tooltip), 不增加 deps. */
  const _src = {
    cur:  {vol:'VD 偵測器即時通過量 (TotalVol/3)', spd:'VD 即時平均車速', occ:'VD 即時佔有率'},
    pred: {vol:'GRU pair model 預測 (15 步 × 20 秒 snapshot Σ vehicle_count) — 單位不同於 VD 通過量,差約 6 倍由 Little\'s Law',
           spd:'SUMO no_control 基準模擬, 排除 spd=0 死巷後算術平均', occ:'SUMO no_control 基準模擬'},

  };
  const s = _src[dataKey] || _src.cur;

  const _spdIco = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 4v2M4.9 7.5l1.4 1.4M2 14h2M20 14h2M18.7 7.5l-1.4 1.4M13.4 12.6 16 8"/></svg>;
  const _roadIco = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 19V5M20 19V5M12 19v-3"/></svg>;
  const _volIco = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 17h14M5 17a2 2 0 0 1-2-2v-3l2-5h14l2 5v3a2 2 0 0 1-2 2M7 17v2M17 17v2"/><circle cx="7.5" cy="14" r="1"/><circle cx="16.5" cy="14" r="1"/></svg>;
  const _congIco = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h0"/></svg>;
  const _freeIco = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6 9 17l-5-5"/></svg>;
  const _sigIco = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="4"/></svg>;

  const cards = [
    { label:'監控路段', value:String(n),                            unit:'條',   accent:'#3b82f6', rgb:'59,130,246',  ico:_roadIco, barW: 1.0, tip:`${dataKey==='cur'?'VD 偵測器':'SUMO + GRU'} 覆蓋的路段/邊數` },

    { label:'總車流量', value:totalVol!==null?totalVol.toLocaleString():'--', unit:'輛', accent:'#3b82f6', rgb:'59,130,246', ico:_volIco, barW:totalVol!==null?Math.min(1,totalVol/2000):0, tip:s.vol },

  ];
  return (
    <div className="kpi-strip">
      {cards.map((c,i) => (
        <div key={i} className="kpi glass" title={c.tip || ''} style={{['--kc']:c.accent,['--kc-rgb']:c.rgb,cursor:c.tip?'help':'default'}}>
          <div className="kpi-top">

/* ==== HeatmapLegend ==== */
/* countColorMode() drives every swatch — data-driven, untouched. */
function HeatmapLegend({ maxCount, mode }) {
  const stops=[0,0.25,0.5,0.75,1.0]; const mc=maxCount||1;
  const cf=v=>countColorMode(v*mc,mc,mode);
  return (
    <div style={{ display:'flex',alignItems:'center',gap:8 }}>
      <span style={{ fontFamily:"'Noto Sans TC',sans-serif",fontSize:10,color:'var(--muted)',whiteSpace:'nowrap' }}>車次密度</span>
      <div style={{ display:'flex',alignItems:'center' }}>
        {stops.map((t,i)=>i<stops.length-1&&(
          <div key={t} style={{ display:'flex',flexDirection:'column',alignItems:'center' }}>
            <div style={{ width:28,height:4,background:`linear-gradient(90deg,${cf(t)},${cf(stops[i+1])})`,borderRadius:i===0?'3px 0 0 3px':i===stops.length-2?'0 3px 3px 0':'0' }}/>
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'var(--muted)',marginTop:1 }}>{Math.round(t*mc)}</span>
          </div>
        ))}
        <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'var(--muted)',marginTop:5,marginLeft:2 }}>{mc}+</span>
      </div>
      <span style={{ fontFamily:"'Noto Sans TC',sans-serif",fontSize:10,color:'var(--muted)' }}>車次</span>
    </div>
  );
}

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ transform:collapsed?'rotate(0deg)':'rotate(180deg)',transition:'transform 150ms',flexShrink:0 }}><polyline points="6 9 12 15 18 9"/></svg>
          <h3 style={{margin:0}}>路段監控列表</h3>
          <span className="panel-sub" style={{marginLeft:2}}>{roads.length} 路段</span>
        </button>
        <div className="ph-spacer"></div>
        {!collapsed && (
        <div className="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋路段…" aria-label="搜尋路段"/>
          {search && <button onClick={()=>setSearch('')} aria-label="清除搜尋" style={{ background:'none',border:'none',color:'var(--muted)',cursor:'pointer',padding:0,fontSize:15,lineHeight:1 }}>×</button>}
        </div>
        )}
      </div>
      <div className="tbl-scroll" style={{display:collapsed?'none':'block'}}>
        <table className="tbl">
          <thead>
            <tr>
              <th>路段名稱</th><th className="r">平均車速</th><th className="r">車流量</th><th className="r">佔有率</th><th className="r">狀態</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(row => {
              const d = row[dataKey]||row.cur;
              const noData = d.spd === null && d.vol === null;
              // 顏色與狀態一律由顯示的車速推導，避免與 VD worstMoe 聚合脫節（高均速卻標紅）。
              const lvl = noData ? null : (d.spd === null ? (d.moe ?? 1) : _moeFromSpd(d.spd));
              const m = noData ? null : moeCfg[lvl];
              const spdCol = noData ? null : (d.spd === null ? m.sc : speedColor(d.spd));
              const occVal = (noData || d.occ === null || d.occ === undefined) ? null : d.occ;
              const occCol = occVal === null ? null : (occVal>=55?'#ef4444':occVal>=30?'#f59e0b':'#22c55e');
              const isSel=selectedId===row.id;
              return (
                <tr key={row.id} className={isSel?'sel':undefined} onClick={()=>onSelectRoad&&onSelectRoad(row)} onMouseEnter={()=>setHovered(row.id)} onMouseLeave={()=>setHovered(null)}>
                  <td>
                    <div className="road-name">{row.name}</div>
                    <div className="road-id">{row.id}</div>
                  </td>
                  <td className="r">
                    {(noData || d.spd === null || d.spd === undefined)
                      ? <span className="mono" style={{ color:'var(--muted)' }}>---</span>
                      : <span className="spd-val" style={{color:spdCol}}>{d.spd}<small>km/h</small></span>}
                  </td>
                  <td className="r">
                    {(noData || d.vol === null || d.vol === undefined)
                      ? <span className="mono" style={{ color:'var(--muted)' }}>---</span>
                      : <span className="tnum">{d.vol}<small style={{fontWeight:400,color:'var(--txt2)',marginLeft:3}}>輛</small></span>}
                  </td>
                  <td className="r">
                    {occVal === null
                      ? <span className="mono" style={{ color:'var(--muted)' }}>---</span>
                      : <div className="occ-cell"><div className="occ-track"><span style={{width:`${Math.min(100,occVal)}%`,background:occCol,boxShadow:`0 0 6px ${occCol}`}}/></div>{occVal}%</div>}
                  </td>
                  <td className="r">
                    {noData
                      ? <span style={{ color:'var(--muted)',fontWeight:400 }}>等待數據</span>
                      : <span className={`pill ${m.cls}`}><span className="pd"/>{m.label}</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ==== phaseStyle (VERBATIM) ==== */
function phaseStyle(state){
  if(!state) return {bg:'#4e6080',label:'未知'};
  const g=(state.match(/[Gg]/g)||[]).length;
  const y=(state.match(/y/g)||[]).length;
  if(y>0) return {bg:'#d97706',label:'黃燈清道'};
  if(g>0) return {bg:'#16a34a',label:'放行通車'};
  return {bg:'#dc2626',label:'全紅間隔'};
}

/* ==== SignalControl ==== */
/* mergedSignals useMemo, getPhase wall-clock math, lightState, selected state,
   the 1-second re-render interval — ALL preserved verbatim. Only the panel,
   list cards, mini-light, and detail markup were reclassed. Lamp glow and
   phase colors stay computed from phaseStyle(...)/lightState(...). */
function SignalControl({ apiRecords = [], liveSignals = null }){
  /* 合併：號誌計畫(apiRecords) 決定相位/狀態；即時串流(liveSignals) 提供當前燈號 */
  const mergedSignals = useMemo(() => {
    const liveKeys = liveSignals ? Object.keys(liveSignals) : [];
    const matchToken = (id, sid) => id === sid || id.split(/[^A-Za-z0-9]+/).includes(sid);
    const findLive = (sid) => {
      const k = liveKeys.find(k => matchToken(k, sid));
      return k ? liveSignals[k] : null;
    };
    return signalData.map(s => {
      const live = findLive(s.id);
      const rec = apiRecords.find(r => {
        const id = String(r.tl_id || r.tls_id || r.junction_id || r.id || '');
        return id ? matchToken(id, s.id) : false;
      });
      let out = s;
      if (rec) {
        const keys = Object.keys(rec);
        const phases = s.phases.map((p, i) => {
          const durKey = keys.find(k => new RegExp(`phase[_\\s]?${i}[_\\s]?dur`, 'i').test(k)) ||
                         keys.find(k => new RegExp(`phase${i}`, 'i').test(k));
          const dur = durKey ? Math.max(5, parseInt(rec[durKey]) || p.dur) : p.dur;
          return { ...p, dur };
        });
        const cycle = phases.reduce((acc, p) => acc + p.dur, 0);
        // 號誌計畫的 score 是壅塞優先度分數：高分代表該路口較壅塞
        const score = parseFloat(rec.score);
        const status = (!isNaN(score) && score >= 1.3) ? 'congested' : 'optimized';
        out = { ...s, phases, cycle, status };
      }
      if (live) out = { ...out, live };
      return out;
    });
  }, [apiRecords, liveSignals]);

  const [selected,setSelected]=useState('655375241');
  const [,setClock]=useState(0);   // 僅用來每秒觸發重繪；相位以 Date.now() 計算
  useEffect(()=>{ const id=setInterval(()=>setClock(c=>c+1),1000); return()=>clearInterval(id); },[]);

  function getPhase(sig){
    // 以牆上時鐘（秒）計算相位，背景頁籤被 throttle 也不會漂移
    const nowSec=Math.floor(Date.now()/1000);
    const elapsed=(nowSec+(sig.offset||0))%sig.cycle;
    let acc=0;
    for(let i=0;i<sig.phases.length;i++){
      if(elapsed<acc+sig.phases[i].dur) return{idx:i,phase:sig.phases[i],remaining:sig.phases[i].dur-(elapsed-acc)};
      acc+=sig.phases[i].dur;
    }
    return{idx:0,phase:sig.phases[0],remaining:sig.phases[0].dur};
  }
  /* 燈號狀態：從 SUMO state 字串判斷 */
  function lightState(state){
    if(!state) return 'red';
    if((state.match(/y/g)||[]).length>0) return 'amber';
    if((state.match(/[Gg]/g)||[]).length>0) return 'green';
    return 'red';
  }

  const sel=mergedSignals.find(s=>s.id===selected);
  const selInfo=sel?getPhase(sel):null;

  return(
    <div className="sig-panel glass" style={{flex:1,minHeight:0}}>

      {/* ── Header ── */}
      <div className="panel-head">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="2" width="6" height="20" rx="3"/><circle cx="12" cy="7" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="17" r="1"/></svg>號誌控制</h3>
        <div className="ph-spacer"></div>
        <span className="panel-sub mono">{signalData.length} 個路口</span>
      </div>

      {/* ── Signal list ── */}
      <div className="sig-scroll">
        {mergedSignals.map(s=>{
          const cfg=sigStatusCfg[s.status]; const isAct=selected===s.id;
          const info=getPhase(s);
          // 有 WS 即時燈號時優先採用，否則用相位時鐘推算
          const ls = s.live ? lightState(s.live.state) : lightState(info.phase.state);
          return(
            <div key={s.id} className={isAct?'sig-card sel':'sig-card'} onClick={()=>setSelected(s.id)}>
              {/* Mini traffic light — lamps glow via .on, driven by ls */}
              <div className="mini-light">
                <span className={ls==='red'?'lamp red on':'lamp red'}/>
                <span className={ls==='amber'?'lamp amber on':'lamp amber'}/>
                <span className={ls==='green'?'lamp green on':'lamp green'}/>
              </div>
              <div className="sig-info">
                <div className="nm">{s.name}</div>
                <div className="id">{s.id}</div>
              </div>
              <div className="sig-right">
                <span className="sig-count" style={{color:phaseStyle(info.phase.state).bg}}>{info.remaining}s</span>
                <span className={`${cfg.cls} sm`}><span className="pd"/>{cfg.label}</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── Detail panel ── */}
      {sel&&selInfo&&(
        <div className="sig-detail">
          <div className="sd-top">
            <div>
              <div className="nm">{sel.name}</div>
              <div className="id mono">{sel.id}</div>
              <div style={{display:'flex',alignItems:'center',gap:6,marginTop:8}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:phaseStyle(selInfo.phase.state).bg,flexShrink:0,boxShadow:`0 0 6px ${phaseStyle(selInfo.phase.state).bg}`}}/>
                <span style={{fontSize:13,fontWeight:600,color:phaseStyle(selInfo.phase.state).bg}}>{phaseStyle(selInfo.phase.state).label}</span>
              </div>
              <div className="panel-sub" style={{marginTop:6}}>週期 {sel.cycle}s · {sel.id}</div>
            </div>
            <div className="sd-count">
              <div className="big mono" style={{color:phaseStyle(selInfo.phase.state).bg}} aria-live="polite" aria-atomic="true">{selInfo.remaining}</div>
              <div className="lbl">秒</div>
            </div>
          </div>

          {/* 四相位色條 — phase fill from phaseStyle(p.state).bg */}
          <div className="phase-bar">
            {sel.phases.map((p,i)=>(
              <div key={i} title={`${phaseStyle(p.state).label} ${p.dur}s`}
                style={{width:`${(p.dur/sel.cycle)*100}%`,background:phaseStyle(p.state).bg,filter:i===selInfo.idx?'brightness(1.3) saturate(1.3)':'none',opacity:i===selInfo.idx?1:0.32,boxShadow:i===selInfo.idx?'inset 0 0 8px rgba(255,255,255,0.5)':'none',transition:'opacity 300ms,filter 300ms'}}/>
            ))}
          </div>

          {/* 當前相位進度條 */}
          <div className="phase-meta">
            <span>{phaseStyle(selInfo.phase.state).label}</span>
            <span className="mono">{selInfo.remaining}s / {selInfo.phase.dur}s</span>
          </div>
          <div style={{height:3,background:'rgba(120,160,240,0.14)',borderRadius:2,overflow:'hidden',margin:'8px 0 12px'}}>
            <div style={{height:'100%',borderRadius:2,background:phaseStyle(selInfo.phase.state).bg,
              width:`${Math.max(0,((selInfo.phase.dur-selInfo.remaining)/selInfo.phase.dur)*100)}%`,
              transition:'width 900ms linear'}}/>
          </div>

          {/* 四相位圖例 */}
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px 10px'}}>
            {sel.phases.map((p,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:i===selInfo.idx?phaseStyle(p.state).bg:'var(--muted)',transition:'color 300ms'}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:phaseStyle(p.state).bg,display:'inline-block',opacity:i===selInfo.idx?1:0.4}}/>
                {phaseStyle(p.state).label} {p.dur}s
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ==== parseMarkdown (VERBATIM logic; emphasis uses .bub b styling via <strong>) ==== */
function parseMarkdown(text){
  return text.split(/\*\*(.*?)\*\*/g).map((part,i)=>i%2===1?<strong key={i} style={{color:'var(--cyan)',fontWeight:700}}>{part}</strong>:part);
}

/* ==== LLMChat ==== */
/* send() + AbortController + 125s timeout + /api/chat fetch + history mapping +
   scroll-to-bottom effect — ALL preserved verbatim. Presentation -> AI-panel
   classes (.ai-head/.chat/.msg/.chips/.ai-input/.send-btn). */
function LLMChat({ msgs, setMsgs }){
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  const abortRef=useRef(null);
  const now=()=>new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const send=()=>{
    if(!input.trim()||loading) return;
    const t=input;
    setMsgs(m=>[...m,{role:'user',text:t,time:now()}]);
    setInput(''); setLoading(true);
    const history = msgs
      .filter(m => m.role==='user' || m.role==='assistant')
      .map(m => ({role: m.role, content: m.text}));
    // 中斷前一個未完成的請求，避免先發後到覆蓋；並設 125s 逾時
    if(abortRef.current) abortRef.current.abort();
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    const timer = setTimeout(()=>ctrl.abort(), 125000);
    fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:t, history}),
      signal: ctrl.signal
    })
    .then(r=>r.json())
    .then(data=>{
      clearTimeout(timer);
      setMsgs(m=>[...m,{role:'assistant',text:data.reply||'無法取得回應',time:now()}]);
      setLoading(false);
    })
    .catch(err=>{
      clearTimeout(timer);
      if(err && err.name==='AbortError') { setLoading(false); return; }
      setMsgs(m=>[...m,{role:'assistant',text:'連線失敗，請確認 API 伺服器已啟動。',time:now()}]);
      setLoading(false);
    });
  };
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading]);
  return (
    <div className="ai-panel glass" style={{flex:1,minHeight:0}}>
      <div className="ai-head">
        <div className="ai-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M8 4h8"/><circle cx="9" cy="13.5" r="1.2" fill="#22d3ee" stroke="none"/><circle cx="15" cy="13.5" r="1.2" fill="#22d3ee" stroke="none"/></svg>
        </div>
        <div>
          <div className="nm">AI 數據助理 <span className="gemma-tag">gemma-4</span></div>
          <div className="st"><span className="d"></span>線上 · 即時分析交通數據</div>
        </div>
      </div>
      <div className="chat">
        {msgs.map((m,i)=>{
          const isUser=m.role==='user';
          return (
            <div key={i} className={isUser?'msg user':'msg assistant'}>
              <div className="av">{isUser?'您':'AI'}</div>
              <div style={{display:'flex',flexDirection:'column',gap:3,alignItems:isUser?'flex-end':'flex-start',minWidth:0}}>
                <div className="bub">
                  {m.text.split('\n').filter(Boolean).map((ln,j)=><p key={j} style={{margin:j>0?'6px 0 0':0}}>{parseMarkdown(ln)}</p>)}
                </div>
                <div className="mono" style={{fontSize:10,color:'var(--muted)'}}>{m.time}</div>
              </div>
            </div>
          );
        })}
        {loading&&(
          <div className="msg assistant">
            <div className="av">AI</div>
            <div className="bub" style={{display:'flex',gap:5,alignItems:'center'}}>
              {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:'50%',background:'var(--txt2)',animation:`bounce 1.2s ${i*0.2}s ease-in-out infinite`}}/>)}
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>
      <div className="chips">
        {['壅塞原因分析','號誌優化建議'].map(s=>(
          <button key={s} className="chip" onClick={()=>setInput(s)}>{s}</button>
        ))}
      </div>
      <div className="ai-input">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} placeholder="詢問交通狀況、號誌建議…" aria-label="輸入訊息給 AI 助理"/>
        <button className="send-btn" onClick={send} disabled={loading||!input.trim()} aria-label="送出訊息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  );
}

/* ==== PredictPanel ==== */
/* delta / arrow / moe label+color computations preserved verbatim. Panel ->
   .table-panel glass; table -> .tbl; status chip -> data-driven pill modifier. */
function PredictPanel({ predRoads, predRecords }) {
  return (
    <div className="table-panel glass" style={{flex:1,minHeight:0}}>
      <div className="panel-head">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>GRU 5 分鐘流量預測</h3>
        <div className="ph-spacer"></div>
        {predRecords.length === 0 && <span className="panel-sub">尚無數據 — 請先執行 runtime_pipeline.py</span>}
        {predRecords.length > 0  && <span className="panel-sub mono">{predRecords.length} 筆記錄</span>}
      </div>
      <div className="tbl-scroll">
        <table className="tbl">
          <thead>
            <tr>
              {['路段','當前車速','預測車速 (5 min)','當前車流','預測車流','預測狀態'].map(h => (
                <th key={h} className={h==='路段'?undefined:'r'}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {predRoads.map(r => {
              const noData = r.cur.spd === null || r.pred.spd === null;
              const delta = noData ? 0 : r.pred.spd - r.cur.spd;
              const arrowCol = delta > 1 ? '#4ade80' : delta < -3 ? '#f87171' : '#fbbf24';
              const arrow    = delta > 1 ? '↑' : delta < -3 ? '↓' : '→';
              const moeLabel = r.pred.moe === 2 ? '壅塞' : r.pred.moe === 1 ? '普通' : '暢通';
              const moeCls   = r.pred.moe === 2 ? 'pill-cong' : r.pred.moe === 1 ? 'pill-normal' : 'pill-ok';
              return (
                <tr key={r.id} style={{cursor:'default'}}>
                  <td><span className="road-name">{r.name}</span></td>
                  <td className="r" style={{color:'var(--txt2)',fontWeight:600}}>{r.cur.spd === null ? '---' : `${r.cur.spd} km/h`}</td>
                  <td className="r" style={{color:noData?'var(--muted)':arrowCol,whiteSpace:'nowrap',fontWeight:700}}>{noData ? '---' : `${arrow} ${r.pred.spd} km/h`}{!noData && r.pred.estimated && <span title="無模擬資料，依當前車況推估" className="pill pill-normal sm" style={{ marginLeft:6 }}>推估</span>}</td>
                  <td className="r" style={{color:'var(--txt2)',fontWeight:600}}>{r.cur.vol === null ? '---' : `${r.cur.vol} 輛`}</td>
                  <td className="r" style={{color:'#fff',fontWeight:600}}>{r.pred.vol === null ? '---' : `${r.pred.vol} 輛`}</td>
                  <td className="r">
                    {noData
                      ? <span style={{ color:'var(--muted)',fontWeight:400 }}>等待數據</span>
                      : <span className={`pill ${moeCls}`}><span className="pd"/>{moeLabel}</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}
