<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--color-bg-base); padding: 20px; font-family: var(--font-body); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-text-muted); padding: 0 12px 8px; text-align: left; border-bottom: 1px solid var(--color-border); }
  tbody tr { transition: background 150ms ease-out; }
  tbody tr:hover { background: rgba(59,130,246,0.07); }
  tbody td { padding: 10px 12px; font-size: 13px; color: var(--color-text-secondary); border-bottom: 1px solid rgba(42,53,85,0.5); }
  .road-name { color: var(--color-text-primary); font-weight: 500; font-size: 13px; }
  .road-id { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
  .speed { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 500; }
  .badge-free { background:rgba(34,197,94,0.12);color:#4ade80; }
  .badge-moderate { background:rgba(245,158,11,0.12);color:#fbbf24; }
  .badge-congested { background:rgba(239,68,68,0.12);color:#f87171; }
  .dot { width:6px;height:6px;border-radius:50%;flex-shrink:0; }
</style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th>路段名稱</th>
      <th>平均車速</th>
      <th>車流量</th>
      <th>佔有率</th>
      <th>狀態</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><div class="road-name">建國南路 忠孝–仁愛</div><div class="road-id">ZJHKR40</div></td>
      <td><span class="speed">34.6</span> km/h</td>
      <td>61 輛</td>
      <td>2.1%</td>
      <td><span class="badge badge-moderate"><span class="dot" style="background:#f59e0b;"></span>普通</span></td>
    </tr>
    <tr>
      <td><div class="road-name">建國北路 長安–忠孝</div><div class="road-id">ZK7KP40</div></td>
      <td><span class="speed" style="color:#f87171;">9.8</span> km/h</td>
      <td>30 輛</td>
      <td>47.7%</td>
      <td><span class="badge badge-congested"><span class="dot" style="background:#ef4444;"></span>壅塞</span></td>
    </tr>
    <tr>
      <td><div class="road-name">市民大道 建國–金山</div><div class="road-id">ZK9KC60</div></td>
      <td><span class="speed" style="color:#4ade80;">42.8</span> km/h</td>
      <td>123 輛</td>
      <td>9.0%</td>
      <td><span class="badge badge-free"><span class="dot" style="background:#22c55e;"></span>暢通</span></td>
    </tr>
  </tbody>
</table>
</body>
</html>
